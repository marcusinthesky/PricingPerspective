    - ${p1}/wasserstein_comparator/pairs.parquet
    - ${p1}/dyadic_confound/node_bootstrap_counts.parquet
    - ${p1}/tfidf_controls
    - ${p1}/pretraining_distances/cells/clm
    - ${p1}/pretraining_distances/cells/mlm30
    - ${p1}/pretraining_distances/cells/mlm40
    - ${p1}/pretraining_distances/cells/mlm50
