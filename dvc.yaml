  p5_two_field_qmle:
    desc: Paper 5 joint two-field spatial estimates and interaction-field overlap. The barycentric interaction
      field, computed by transport-aligned simplex reconstruction, and the persistent news co-mention
      graph enter one exposure equilibrium as separate adjustment channels; the single-field fits are
      re-estimated as the pinned boundaries of the same nested family, so the reported likelihood gains
      are exact. Every matrix stays frozen at 2022. The pooled result also carries a primary FF5-plus-momentum
      factor- conditioned joint fit; the raw-return joint fit remains as appendix corroboration.
    cmd: ${py_pipeline} paper5-two-field-qmle --returns-dir ${shared}/returns --oos-returns-dir ${shared}/oos/returns
      --shared-barycentre-dir ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
      --co-mentions-adjacency ${shared}/co_mentions/adjacency.parquet --params-file params.yaml --output-dir
      ${p5}/two_field_qmle --n-bootstrap ${paper5.two_field.n_bootstrap} --block-length ${paper5.two_field.block_length}
      --seed ${paper5.two_field.seed} --n-random ${paper5.two_field.n_random} --theta-points ${paper5.two_field.theta_points}
      --rho-points ${paper5.two_field.rho_points} --provider-id ${paper5.provider_id} --representation-id
      ${paper5.representation_id} --barycentre-arm-id ${paper5.barycentre_arm_id} --geometry-id ${paper5.distance_id}
