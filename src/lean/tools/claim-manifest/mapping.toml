[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:spatial-attenuation"
assumptions = [
  "nonnegative row-stochastic interaction matrix",
  "strictly positive stationary probability weights",
  "feedback parameter in the unit interval below one",
  "nonempty finite cross-section"
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace for a nonnegative row-stochastic matrix centered at strictly positive stationary probability weights. No reversibility, symmetry, or spectral premise is used; the upper factor of one is exact and the lower factor is a universal worst case."

[[claims]]
paper = "03_distance_implied_mpt"
claim_id = "thm:p3-information-certified-cap"
assumptions = [
  "finite asset universe and normalized long-only portfolio weights",
  "common measurable antilipschitz carrier and measurable asset-specific exposure maps",
  "pointwise draw-synchronous asset-specific slack bounds",
  "one coherent joint exposure law with the declared coordinate marginals",
  "integrability of every pairwise exposure inner product",
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace by composing the carrier-and-slack W2 floor with the coherent joint-law portfolio-variance cap. The theorem is conditional on the displayed transmission, slack, joint-law, and integrability hypotheses; it neither calibrates those inputs nor establishes a realized total-return or ex-ante empirical bound."

[[claims]]
paper = "03_distance_implied_mpt"
claim_id = "eq:p3-residual-budget-cap"
assumptions = [
  "an additive decomposition of total standardized variance into systematic and residual contributions",
  "the information-certificate systematic variance cap",
  "an assumed upper budget for the aggregate residual contribution",
]
disclosure = "Machine-checked as an additive portfolio-level sensitivity wrapper: if systematic standardized variance is at most one minus the certificate credit and the aggregate residual contribution is at most delta, total standardized variance is at most one minus the credit plus delta. Delta is an assumed budget, not an estimated structural parameter, and the theorem does not derive residual orthogonality."

[[claims]]
paper = "03_distance_implied_mpt"
claim_id = "thm:p3-certified-minimizer"
assumptions = [
  "finite asset universe",
  "nonempty compact feasible subset of the long-only simplex",
  "pointwise actual-variance upper certificate on the feasible set",
]
disclosure = "Machine-checked by continuity and compactness in the pinned Lean 4 / mathlib v4.35.0 workspace. The result establishes existence and the inherited risk guarantee, not uniqueness, unconditional convexity for an arbitrary distance matrix, or superior realized variance relative to competing portfolios."

# Added 2026-08-26 (paper3/t37). The sharp multi-marginal form of the certificate, the
# exactness of its envelope, its curvature under a stated distance-matrix condition, and
# the two-asset bridge to Paper 1. All four declarations existed and were machine-checked
# before this cycle; only the last row's declaration is new.
[[claims]]
paper = "03_distance_implied_mpt"
claim_id = "thm:p3-sharp-certificate"
assumptions = [
  "finite asset universe and normalized long-only risk weights",
  "a measurable embedding that is antilipschitz with nonzero constant",
  "common carrier and realized exposure laws are coordinatewise pushforwards of the characteristic laws",
  "each realized transmission has the stated integrated squared slack radius",
  "one coherent joint exposure law with the declared coordinate marginals",
  "integrability of every pairwise exposure inner product",
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace by composing the aggregate carrier floor with an attainment-free multi-marginal variance envelope; no optimal joint plan or barycentre is assumed to exist. This verifies the aggregate bound only; it does not establish uniform dominance over the pairwise certificate. It requires a measurable embedding, synchronous pushforward transmission, finite moments and the stated joint-law and integrability premises, and calibrates none of them."

[[claims]]
paper = "03_distance_implied_mpt"
claim_id = "thm:p3-envelope-exactness"
assumptions = [
  "finite asset universe and normalized risk weights",
  "a supplied certificate that some coherent joint law attains the dispersion minimum",
  "integrability of every pairwise inner product under that attaining law",
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace as an exact greatest-element statement, so the multi-marginal bound is not merely valid but unimprovable within the coherent-joint-law class. Attainment is a supplied premise: no general existence theorem for an optimal multi-marginal plan is claimed, and the result says nothing about which joint law the data realize."

[[claims]]
paper = "03_distance_implied_mpt"
claim_id = "thm:p3-certificate-convexity"
assumptions = [
  "finite asset universe",
  "the squared distance matrix is conditionally negative definite",
  "two sets of normalized risk weights and a mixing parameter in the unit interval",
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace. Convexity is conditional on the stated curvature property of the squared distance matrix and is asserted for no other matrix; whether a given empirical matrix satisfies it is a separate numerical question the theorem does not answer. Convexity concerns the standardized objective along weight mixtures and implies neither uniqueness of a minimizer nor any claim about realized variance."

[[claims]]
paper = "03_distance_implied_mpt"
claim_id = "thm:p3-pairwise-bridge"
assumptions = [
  "exactly two assets with normalized risk weights",
  "a supplied certificate that some coherent joint law attains the dispersion minimum",
  "integrability of every pairwise inner product under that attaining law",
]
disclosure = "Machine-checked as an exact equality in the pinned Lean 4 / mathlib v4.35.0 workspace. It identifies the pairwise covariance-envelope correction as the two-asset case of the multi-firm construction, establishing that the two papers describe one object rather than two compatible ones. It imports no assumption or empirical result from the pairwise paper."

