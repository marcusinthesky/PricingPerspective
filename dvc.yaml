  p5_two_field_qmle:
    desc: >-
      Paper 5 joint two-field spatial estimates and interaction-field overlap.
      The barycentric interaction field, computed by transport-aligned simplex
      reconstruction, and the persistent news co-mention graph enter one exposure
      equilibrium as separate adjustment channels; the single-field fits are
      re-estimated as the pinned boundaries of the same nested family, so the
      reported likelihood gains are exact. Every matrix stays frozen at 2022.
    cmd: >-
      ${py_pipeline} paper5-two-field-qmle
      --returns-dir ${shared}/returns
      --oos-returns-dir ${shared}/oos/returns
