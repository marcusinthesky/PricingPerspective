    - data/raw/fama_french/2026-09-02/F-F_Research_Data_5_Factors_2x3_daily_CSV.zip
    - data/raw/fama_french/2026-09-02/F-F_Momentum_Factor_daily_CSV.zip
    params:
    - paper5.two_field.n_bootstrap
    - paper5.two_field.block_length
    - paper5.two_field.seed
    - paper5.two_field.n_random
    - paper5.two_field.theta_points
    - paper5.two_field.rho_points
    - paper5.factor_data
    - paper5.transport_order.factor_model
    - paper5.provider_id
    - paper5.representation_id
    - paper5.distance_id
    - paper5.barycentre_arm_id
