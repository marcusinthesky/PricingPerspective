    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-illustrations.json
    outs:
    - src/latex/projects/01_continuous_bounds/src/images/continuous_bound_construction.pgf:
        cache: false

  p1_figures:
    desc: >-
      Generate Paper 1's sector MDS and Shepard diagnostic from the exact W2
      artifact and universe metadata. LaTeX number bindings are a separate
      p1_numbers stage (t15 R3 split) so a
      figure-code-only edit or an unrelated summary refresh doesn't invalidate
