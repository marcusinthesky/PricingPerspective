      --vintage-dir ${shared}/typed_distances/ettax-v3/ettax-v3-unit/wasserstein_w2
      --vintage-equivalence-bound ${encoder_vintage_analysis.effect_one_sd_equivalence_bound}
      --vintage-confidence-level ${encoder_vintage_analysis.confidence_level}
