# DVC Pipeline for Pricing Perspective Analysis

params:
- params.yaml
- data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V0/params.yaml
- data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V1/params.yaml
- data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V3/params.yaml

metrics:
- ${mc}/monte_carlo_validation/summary.yaml
- ${mc}/hedging_error_validation/summary.yaml
- ${mc}/pricefree_comparison/summary.yaml
- ${mc}/test_size_power/summary.yaml
- ${mc}/equivalence_calibration/summary.yaml
- data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V0/metrics.json
- data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V1/metrics.json
- data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V3/metrics.json

plots:
- ettax_checkpoint_probe_loss:
    title: EttaX fixed training-probe loss by corpus vintage
    x: step
    y:
      data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V0/plots/metrics/checkpoint_probe_loss.tsv: checkpoint_probe_loss
      data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V1/plots/metrics/checkpoint_probe_loss.tsv: checkpoint_probe_loss
      data/.encoder_vintage/ettax/runs/v3-byte-complete/dvclive/V3/plots/metrics/checkpoint_probe_loss.tsv: checkpoint_probe_loss

vars:
- py_pipeline: uv run --project src/python pipeline
- py_sim: uv run --project src/python simulation
- py_semflow: uv run --project src/python semflow
- shared: data/shared
- p1: data/papers/paper1
- p3: data/papers/paper3
- p5: data/papers/paper5
- mc: data/mc
- py_ettax: uv run --project src/python --package ettax --extra cuda ettax
- ettax_run_root: data/.encoder_vintage/ettax/runs/v3-byte-complete
- ettax_arms:
  - V0
  - V1
  - V3
# Keyed by provider_id so the shard directory basename equals the registered
# provider, as it does for every other provider. The arm letter stays uppercase
# because it is the vintage identity the CLI and checkpoint tree use.
- ettax_embedding_cells:
    ettax-v0:
      arm: V0
    ettax-v1:
      arm: V1
    ettax-v3:
      arm: V3
stages:

  # ====================================================================
  # SEMFLOW CONTROL PLANE
  # ====================================================================

  semflow_refresh:
    desc: >-
      Refresh semantic entrypoint fingerprints after source changes. This
      control-plane stage owns JSON only; semflow instrumentation of dvc.yaml
      remains an explicit human-reviewed patch.
    cmd: ${py_semflow} refresh --apply
    deps:
    - semflow.toml
    - src/python/packages/semflow/src/semflow
    - src/python/apps/pipeline/src
    - src/python/apps/simulation/src
    - src/python/apps/ettax/src
    - src/python/packages/jcor/src
    outs:
    - .semflow/hashes:
        cache: false

  # ====================================================================
  # SHARED SUBSTRATE
  # ====================================================================

  ## corpus & embeddings

  normalize_corpus:
    # FROZEN: reads `data/raw/nasdaq.jsonlines`, a licensed news corpus that the
    # public replication bucket cannot carry. Its outputs are published instead,
    # so a replicator verifies this stage by hash rather than re-running it.
    # To deliberately re-normalize with the corpus present:
    # `dvc unfreeze normalize_corpus`, repro, then restore this marker.
    frozen: true
    desc: >-
      Deduplicate, date-parse, and filter the raw NASDAQ corpus to the configured
      ticker universe; output articles.parquet + summary.yaml.
    cmd: >-
      ${py_pipeline} normalize-corpus
      --input data/raw/nasdaq.jsonlines
      --output-parquet ${shared}/corpus/articles.parquet
      --output-summary ${shared}/corpus/summary.yaml
      --params params.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/normalize-corpus.json
    - data/raw/nasdaq.jsonlines
    params:
    # The roster reaches this stage through `--params params.yaml`, not through
    # the interpolated `cmd`, so without this declaration a universe change
    # leaves the stage falsely clean and the corpus silently stale.
    - symbols
    outs:
    - ${shared}/corpus/articles.parquet
    - ${shared}/corpus/summary.yaml

  co_mentions:
    # FROZEN: reads `data/shared/corpus/articles.parquet` (full article text),
    # which is not redistributable. Its outputs are published; see
    # `normalize_corpus` above for the unfreeze procedure.
    frozen: true
    desc: >-
      Build a Ge--Linton--Li-style news co-mention graph from exact-two
      company tags in the normalized corpus; emit article edges, yearly pair
      counts, persistent weighted edges, and a JSON audit summary. The source
      taxonomy has no RavenPack topic IDs, so analyst, rating, and index-topic
      exclusions from the paper are not applied.
    cmd: >-
      bash src/python/apps/pipeline/src/pipeline/stages/substrate/co_mentions.sh
      ${shared}/corpus/articles.parquet
      data/universe.csv
      ${shared}/co_mentions
      ${start_date}
      ${end_date}
      ${co_mentions.min_persistence_years}
    deps:
    - ${shared}/corpus/articles.parquet
    - data/universe.csv
    - src/python/apps/pipeline/src/pipeline/stages/substrate/co_mentions.sh
    params:
    - start_date
    - end_date
    - co_mentions.min_persistence_years
    outs:
    - ${shared}/co_mentions/events.parquet
    - ${shared}/co_mentions/pair_year.parquet
    - ${shared}/co_mentions/adjacency.parquet
    - ${shared}/co_mentions/summary.json

  subsample:
    foreach: ${symbols}
    do:
      frozen: true
      desc: >-
        Subsample normalized corpus articles for a ticker using DuckDB with
        date and body-length filtering; deterministic md5-ordered sampling.
      cmd: >-
        ${py_pipeline} subsample
        --symbol ${item}
        --input-path ${shared}/corpus/articles.parquet
        --output ${shared}/subsampled_headlines/${item}.parquet
        --start-date ${start_date}
        --end-date ${end_date}
        --min-body-chars ${min_body_chars}
        --n-samples ${n_samples}
      deps:
      - .semflow/hashes/entrypoints/pipeline/subsample.json
      - ${shared}/corpus/articles.parquet
      outs:
      - ${shared}/subsampled_headlines/${item}.parquet

  generate_embeddings:
    matrix:
      symbol: ${symbols}
      embedding_model: ${embedding_models}
    frozen: true
    desc: >-
      Generate embeddings for subsampled articles via OpenRouter (OpenAI-compatible).
    cmd: >-
      ${py_pipeline} generate-embeddings
      --symbol ${item.symbol}
      --parquet-path ${shared}/subsampled_headlines/${item.symbol}.parquet
      --model-key ${item.embedding_model}
      --output-file ${shared}/embeddings/${item.embedding_model}/${item.symbol}.parquet
      --params-file params.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/generate-embeddings.json
    - ${shared}/subsampled_headlines/${item.symbol}.parquet
    params:
    - embedding.models
    - embedding.base_url
    - embedding.batch_size
    - embedding.concurrency
    - embedding.max_chars
    outs:
    - ${shared}/embeddings/${item.embedding_model}/${item.symbol}.parquet

  ettax_embeddings:
    foreach: ${ettax_embedding_cells}
    do:
      frozen: true
      desc: >-
        Materialize corrected EttaX document embeddings for one corpus vintage
        using the shared Paper 1 article sample. This diagnostic roster is
        intentionally separate from the published off-the-shelf embedding
        roster.
      cmd: >-
        ${py_ettax} vintage embed ${item.arm}
        --articles-dir ${shared}/subsampled_headlines
        --output-dir ${shared}/embeddings/${key}
      deps:
      - .semflow/hashes/entrypoints/ettax/vintage/embed.json
      - ${ettax_run_root}/tokenizer.json
      - ${ettax_run_root}/checkpoints/${item.arm}/model
      - ${shared}/subsampled_headlines
      outs:
      - ${shared}/embeddings/${key}

  embedding_coverage:
    matrix:
      embedding_model: ${baseline_embedding_models}
    desc: >-
      Validate one embedding file per configured ticker (currently 100/100),
      the model's configured row range, uniform dimensions, no NaN/zero vectors,
      and split-half energy-distance sanity check. Qwen3-Embedding-8B is frozen at
      its preregistered m=128 panel, while the shared source subsample remains
      n_samples=445.
    cmd: >-
      ${py_pipeline} validate-coverage
      --model-key ${item.embedding_model}
      --embeddings-dir ${shared}/embeddings/${item.embedding_model}
      --output-dir ${shared}/validation/${item.embedding_model}
      --params-file params.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/validate-coverage.json
    - ${shared}/embeddings/${item.embedding_model}
    params:
    - embedding.models
    - n_samples
    - symbols
    outs:
    - ${shared}/validation/${item.embedding_model}/summary.yaml
    - ${shared}/validation/${item.embedding_model}/coverage.csv

  ## energy & association

  typed_geometry_components:
    foreach: ${typed_geometry_component_specs}
    do:
      desc: >-
        Materialize one reusable raw mean-ground-distance or kernel-mean
        component for an explicit provider/representation/geometry identity.
      cmd: >-
        ${py_pipeline} typed-geometry-component
        --provider-id ${item.provider_id}
        --representation-id ${item.representation_id}
        --geometry-id ${item.geometry_id}
        --output-dir
        ${shared}/typed_geometry_components/${item.provider_id}/${item.representation_id}/${item.geometry_id}
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-geometry-component.json
      - ${shared}/embeddings/${item.provider_id}
      - data/universe.csv
      params:
      - typed_geometry_component_specs.${key}
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.geometry_id}
      - market_symbols
      outs:
      - ${shared}/typed_geometry_components/${item.provider_id}/${item.representation_id}/${item.geometry_id}

  typed_geometry_windowed_components:
    foreach: ${typed_geometry_windowed_component_specs}
    do:
      desc: >-
        Materialize one window-scoped raw mean-ground-distance component with
        an exact provider, representation, geometry, and observation window.
      cmd: >-
        ${py_pipeline} typed-geometry-component
        --provider-id ${item.provider_id}
        --representation-id ${item.representation_id}
        --geometry-id ${item.geometry_id}
        --output-dir
        ${shared}/typed_geometry_components/${item.provider_id}/${item.representation_id}/${item.geometry_id}
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-geometry-component.json
      - ${shared}/embeddings/${item.provider_id}
      - data/universe.csv
      params:
      - typed_geometry_windowed_component_specs.${key}
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.geometry_id}
      - typed_analysis.windows.${item.window_key}
      - market_symbols
      outs:
      - ${shared}/typed_geometry_components/${item.provider_id}/${item.representation_id}/${item.geometry_id}

  typed_distance_windowed:
    foreach: ${typed_distance_windowed_specs}
    do:
      desc: >-
        Materialize one window-scoped final statistical-distance artifact.
        This family is required for W2, whose balanced transport solve has no
        reusable mean-ground-distance component.
      cmd: >-
        ${py_pipeline} typed-distance
        --provider-id ${item.provider_id}
        --representation-id ${item.representation_id}
        --distance-id ${item.distance_id}
        --output-dir
        ${shared}/typed_distances_windowed/${item.provider_id}/${item.representation_id}/${item.distance_id}
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-distance.json
      - ${shared}/embeddings/${item.provider_id}
      - data/universe.csv
      params:
      - typed_distance_windowed_specs.${key}
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.distance_id}
      - typed_analysis.windows.${item.window_key}
      - market_symbols
      outs:
      - ${shared}/typed_distances_windowed/${item.provider_id}/${item.representation_id}/${item.distance_id}/distances.parquet
      - ${shared}/typed_distances_windowed/${item.provider_id}/${item.representation_id}/${item.distance_id}/summary.json
      - ${shared}/typed_distances_windowed/${item.provider_id}/${item.representation_id}/${item.distance_id}/provenance.manifest.json

  typed_distances:
    foreach: ${typed_distance_providers}
    do:
      desc: >-
        Materialize all declared statistical-distance matrices for one provider.
      cmd: >-
        ${py_pipeline} typed-distance
        --provider-id ${item.provider_id}
        --roster-key ${key}
        --output-dir ${shared}/typed_distances/${item.provider_id}
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-distance.json
      - ${shared}/embeddings/${item.provider_id}
      - ${shared}/typed_geometry_components/${item.provider_id}
      - data/universe.csv
      # The fixed parameter list mirrors TRACKED_PROVIDER_DISTANCE_IDS in
      # pipeline.io.typed_analysis; every provider must materialize the shared
      # energy/W1/W2 arms before a stage can execute.
      params:
      - typed_distance_providers.${key}
      - typed_distance_representation_suffixes
      - typed_distance_ids
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.energy_v
      - typed_analysis.distances.wasserstein_w1
      - typed_analysis.distances.wasserstein_w2
      - typed_analysis.distances.linear_mmd
      - typed_analysis.distances.rbf_mmd
      - market_symbols
      outs:
      - ${shared}/typed_distances/${item.provider_id}

  encoder_vintage_w2_distances:
    foreach: ${encoder_vintage_ablation_specs}
    do:
      desc: >-
        Materialize one direct rooted-W2 matrix for the encoder-vintage ladder.
        W2 has no reusable typed-geometry component, and this family must not
        widen the locked seven-cell base roster.
      cmd: >-
        ${py_pipeline} typed-distance
        --provider-id ${item.provider_id}
        --representation-id ${item.representation_id}
        --distance-id wasserstein_w2
        --output-dir
        ${shared}/typed_distances/${item.provider_id}/${item.representation_id}/wasserstein_w2
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-distance.json
      - ${shared}/embeddings/${item.provider_id}
      - data/universe.csv
      params:
      - encoder_vintage_ablation_specs.${key}
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.wasserstein_w2
      - market_symbols
      outs:
      - ${shared}/typed_distances/${item.provider_id}/${item.representation_id}/wasserstein_w2

  typed_barycentres:
    foreach: ${typed_barycentre_specs}
    do:
      desc: >-
        Materialize one validated typed target-projection artifact per
        barycentre arm.
      cmd: >-
        ${py_pipeline} typed-barycentre
        --provider-id ${scientific_selectors.baseline_model}
        --representation-id ${scientific_selectors.typed_distance_representation}
        --arm-id ${key}
        --geometry-component-dir
        ${shared}/typed_geometry_components/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${item.geometry_id}
        --output-dir
        ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-barycentre.json
      - ${shared}/embeddings/${scientific_selectors.baseline_model}
      - ${shared}/typed_geometry_components/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${item.geometry_id}
      - data/universe.csv
      params:
      - scientific_selectors.baseline_model
      - scientific_selectors.typed_distance_representation
      - typed_barycentre_specs.${key}
      - typed_analysis.providers.${scientific_selectors.typed_distance_provider_key}
      - typed_analysis.representations.${scientific_selectors.typed_distance_representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.geometry_id}
      - typed_analysis.feasible_sets.simplex_nonnegative
      - typed_analysis.barycentres.${key}
      - market_symbols
      outs:
      - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}/weights.parquet
      - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}/diagnostics.parquet
      - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}/summary.json
      - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}/provenance.manifest.json

  typed_wasserstein_w1_barycentre:
    desc: >-
      Preserve the canonical leave-one-out W1 target projection as one exact
      leaf. W2 publication ablations use the roster-driven family below.
    cmd: >-
      ${py_pipeline} typed-barycentre
      --provider-id ${scientific_selectors.baseline_model}
      --representation-id ${scientific_selectors.typed_distance_representation}
      --arm-id wasserstein_w1_loo
      --output-dir
      ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/wasserstein_w1_loo
      --params-file params.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/typed-barycentre.json
    - ${shared}/embeddings/${scientific_selectors.baseline_model}
    - data/universe.csv
    params:
    - scientific_selectors.baseline_model
    - scientific_selectors.typed_distance_representation
    - typed_wasserstein_barycentre_specs.wasserstein_w1_loo
    - typed_analysis.providers.${scientific_selectors.typed_distance_provider_key}
    - typed_analysis.representations.${scientific_selectors.typed_distance_representation_key}
    - typed_analysis.distances.euclidean_chord
    - typed_analysis.distances.wasserstein_w1
    - typed_analysis.feasible_sets.simplex_nonnegative
    - typed_analysis.barycentres.wasserstein_w1_loo
    - market_symbols
    outs:
    - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/wasserstein_w1_loo/weights.parquet
    - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/wasserstein_w1_loo/diagnostics.parquet
    - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/wasserstein_w1_loo/summary.json
    - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/wasserstein_w1_loo/provenance.manifest.json

  typed_wasserstein_w2_barycentres:
    foreach: ${representation_ablation_specs}
    do:
      desc: >-
        Materialize one independently cached leave-one-out W2 target projection
        for each governed cross-paper representation cell.
      cmd: >-
        ${py_pipeline} typed-barycentre
        --provider-id ${item.provider_id}
        --representation-id ${item.representation_id}
        --arm-id wasserstein_w2_loo
        --output-dir
        ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-barycentre.json
      - ${shared}/embeddings/${item.provider_id}
      - data/universe.csv
      params:
      - representation_ablation_specs.${key}
      - typed_wasserstein_barycentre_specs.wasserstein_w2_loo
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.wasserstein_w2
      - typed_analysis.feasible_sets.simplex_nonnegative
      - typed_analysis.barycentres.wasserstein_w2_loo
      - market_symbols
      outs:
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo/weights.parquet
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo/diagnostics.parquet
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo/summary.json
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo/provenance.manifest.json

  encoder_vintage_w2_barycentres:
    foreach: ${encoder_vintage_ablation_specs}
    do:
      desc: >-
        Materialize one independently cached leave-one-out W2 target projection
        for each EttaX encoder vintage used by Paper 5.
      cmd: >-
        ${py_pipeline} typed-barycentre
        --provider-id ${item.provider_id}
        --representation-id ${item.representation_id}
        --arm-id wasserstein_w2_loo
        --output-dir
        ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-barycentre.json
      - ${shared}/embeddings/${item.provider_id}
      - data/universe.csv
      params:
      - encoder_vintage_ablation_specs.${key}
      - typed_wasserstein_barycentre_specs.wasserstein_w2_loo
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.wasserstein_w2
      - typed_analysis.feasible_sets.simplex_nonnegative
      - typed_analysis.barycentres.wasserstein_w2_loo
      - market_symbols
      outs:
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo/weights.parquet
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo/diagnostics.parquet
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo/summary.json
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo/provenance.manifest.json

  typed_measure_barycentres:
    foreach: ${typed_measure_barycentre_specs}
    do:
      desc: >-
        Materialize one Wasserstein measure barycentre over the leading clouds
        of the governed universe order, in the arity its arm declares. A
        `wasserstein_ot` arm takes exactly two sources and is a closed form: an
        optimal matching followed by displacement interpolation along each
        matched segment, which is exactly the W2 geodesic. A
        `wasserstein_free_support` arm takes K sources and alternates
        assignment against support updates to a LOCAL optimum, because the
        free-support objective is non-convex in the support; its summary
        reports the fixed point it reached, not a global certificate. The
        artifact records which sources it used. Separate from
        typed_barycentres because a Wasserstein geometry has no cached
        mean-ground-distance component to depend on.
      cmd: >-
        ${py_pipeline} typed-barycentre
        --provider-id ${scientific_selectors.baseline_model}
        --representation-id ${scientific_selectors.typed_distance_representation}
        --arm-id ${key}
        --output-dir
        ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}
        --params-file params.yaml
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-barycentre.json
      - ${shared}/embeddings/${scientific_selectors.baseline_model}
      - data/universe.csv
      params:
      - scientific_selectors.baseline_model
      - scientific_selectors.typed_distance_representation
      - typed_measure_barycentre_specs.${key}
      - typed_analysis.providers.${scientific_selectors.typed_distance_provider_key}
      - typed_analysis.representations.${scientific_selectors.typed_distance_representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.geometry_id}
      # Both prescribed feasible sets are tracked by every cell rather than
      # indexed per arm: `TypedBarycentreCell` forbids extra keys, so the arity
      # is not addressable from `${item}`. Over-tracking costs a spurious rerun
      # when the unused arity changes and never leaves a cell stale, which is
      # the correct direction for a governed artifact.
      - typed_analysis.feasible_sets.prescribed_source_weights
      - typed_analysis.feasible_sets.prescribed_source_weights_k3
      - typed_analysis.barycentres.${key}
      - market_symbols
      outs:
      - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}/barycentre.parquet
      - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}/summary.json
      - ${shared}/barycentres/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/${key}/provenance.manifest.json

  ablation:
    desc: >-
      Self-contained ablation over (embedding model × Matryoshka dim). Computes
      exact typed W2 Mantel r_M per cell; skips
      cells whose embeddings are not yet on disk. Does NOT touch the canonical
      energy_tests / mantel_tests / dimensionality_analysis paths.
    cmd: >-
      ${py_pipeline} run-ablation
      --embeddings-root ${shared}/embeddings
      --covariance-matrix ${shared}/covariance_matrix.parquet
      --output-dir ${shared}/ablations
      --typed-distance-root ${shared}/typed_distances
      --params-file params.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/run-ablation.json
    - ${shared}/embeddings/qwen3-embedding-4b
    - ${shared}/embeddings/qwen3-embedding-8b
    - ${shared}/embeddings/bge-m3
    - ${shared}/embeddings/bge-large-en-v1.5
    - ${shared}/covariance_matrix.parquet
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-64-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-256-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-32-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-128-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-32-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-128-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-64-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-256-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2
    - ${shared}/typed_distances/bge-m3/bge-m3-64-unit/wasserstein_w2
    - ${shared}/typed_distances/bge-m3/bge-m3-256-unit/wasserstein_w2
    - ${shared}/typed_distances/bge-m3/bge-m3-unit/wasserstein_w2
    - ${shared}/typed_distances/bge-large-en-v1.5/bge-large-en-v1.5-unit/wasserstein_w2
    - data/universe.csv
    params:
    - ablation.grid
    - typed_analysis.representations
    - market_symbols
    outs:
    - ${shared}/ablations/summary.parquet
    - ${shared}/ablations/summary.yaml

  mantel_tests:
    matrix:
      window: ${return_panels}
      embedding_model: ${baseline_embedding_models}
    desc: >-
      Mantel association between the typed W2 distance matrix and the return chord
      distance sqrt(2(1-rho)) of one evaluation window. Cells are named by matrix
      axis index: window0 is the in-sample 2018-22 panel and window1 the
      out-of-sample 2023-26 panel (params.yaml:return_panels, whose order is
      load-bearing). The W2 matrix is held FIXED at its 2018-22 in-sample
      estimate in EVERY cell -- the news archive ends 2023-01-02, so every
      article predates the out-of-sample window by construction and nothing is
      re-embedded per window. Test convention is fixed in advance by the
      canonical in-sample spec (t14) and shared by both windows: Pearson Mantel
      statistic, 10,000 joint row/column permutations, seed 42, one-sided
      right-tail p-value with add-one smoothing. The out-of-sample lane is
      baseline-encoder only -- a multi-encoder sweep would open a
      model-selection channel on the only look-ahead-free evidence in the paper
      (t16). The baseline-only axis is explicit in
      params.yaml:baseline_embedding_models, while the all-model
      params.yaml:embedding_models axis remains available to frozen generation
      and in-sample robustness consumers.
    cmd: >-
      ${py_pipeline} compute-mantel-tests
      --distance-artifact-dir ${shared}/typed_distances/${item.embedding_model}/${item.embedding_model}-unit/wasserstein_w2
      --covariance-matrix ${item.window.root}/covariance_matrix.parquet
      --output-file ${item.window.root}/mantel_tests/${item.embedding_model}/mantel_tests.csv
      --seed 42
      --null-output-file ${item.window.root}/mantel_tests/${item.embedding_model}/null_distribution.parquet
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-mantel-tests.json
    - ${shared}/typed_distances/${item.embedding_model}/${item.embedding_model}-unit/wasserstein_w2
    - ${item.window.root}/covariance_matrix.parquet
    - data/universe.csv
    params:
    - market_symbols
    - typed_analysis.distances.wasserstein_w2
    outs:
    - ${item.window.root}/mantel_tests/${item.embedding_model}/mantel_tests.csv
    - ${item.window.root}/mantel_tests/${item.embedding_model}/null_distribution.parquet

  dimensionality_analysis:
    matrix:
      embedding_model: ${baseline_embedding_models}
    desc: >-
      Compute governed W2 metric-MDS projection fidelity and complete original/
      projected neighbour rankings on the priced common universe.
    cmd: >-
      ${py_pipeline} compute-dimensionality
      --distance-artifact-dir ${shared}/typed_distances/${item.embedding_model}/${item.embedding_model}-unit/wasserstein_w2
      --covariance-matrix ${shared}/covariance_matrix.parquet
      --universe-csv data/universe.csv
      --output-file ${shared}/dimensionality_analysis/${item.embedding_model}/dimensionality_analysis.csv
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-dimensionality.json
    - ${shared}/typed_distances/${item.embedding_model}/${item.embedding_model}-unit/wasserstein_w2
    - ${shared}/covariance_matrix.parquet
    - data/universe.csv
    params:
    - market_symbols
    - typed_analysis.distances.wasserstein_w2
    outs:
    - ${shared}/dimensionality_analysis/${item.embedding_model}/dimensionality_analysis.csv
    - ${shared}/dimensionality_analysis/${item.embedding_model}/coords_2d.parquet
    - ${shared}/dimensionality_analysis/${item.embedding_model}/neighbours.parquet

  ## market & returns

  market_data:
    matrix:
      window: ${return_panels}
      symbol: ${market_symbols}
    # FROZEN: external price-data fetch (yfinance et al.) — flaky/timeout-prone.
    # Kept out of the run plan like the paid embedding stages so a repro never
    # re-downloads prices. To deliberately refresh: `dvc unfreeze market_data`,
    # repro, then re-add the freeze marker below.
    frozen: true
    desc: >-
      Download total return data for one ticker and evaluation window. The
      window roster supplies raw fetch bounds while retaining a separate
      complete-case contract for downstream covariance validation.
    cmd: >-
      ${py_pipeline} download-market-data
      --start-date ${item.window.fetch_start_date}
      --end-date ${item.window.fetch_end_date}
      --ticker ${item.symbol}
      --output-dir ${item.window.root}/market_data
      --universe-csv data/universe.csv
    deps:
    - .semflow/hashes/entrypoints/pipeline/download-market-data.json
    - data/universe.csv
    outs:
    - ${item.window.root}/market_data/${item.symbol}.parquet

  compute_returns:
    matrix:
      window: ${return_panels}
      symbol: ${market_symbols}
    # FROZEN: its input `market_data` is a vendor price panel the public bucket
    # cannot carry, so no replicator can re-run this stage. It is also the only
    # place the cross-window seam return could be lost: this stage sees a single
    # window, and the OOS window's market_data excludes the last in-sample close,
    # so a re-run writes a null seam return where the published panel carries the
    # real one. To deliberately refresh: `dvc unfreeze compute_returns`, repro,
    # then re-backfill with `scripts/strip_close_price` and restore this marker.
    frozen: true
    desc: >-
      Compute daily returns from one ticker's market data for one evaluation
      window.
    cmd: >-
      ${py_pipeline} compute-returns
      --market-data ${item.window.root}/market_data/${item.symbol}.parquet
      --start-date ${item.window.fetch_start_date}
      --end-date ${item.window.fetch_end_date}
      --output-file ${item.window.root}/returns/${item.symbol}.parquet
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-returns.json
    - ${item.window.root}/market_data/${item.symbol}.parquet
    outs:
    - ${item.window.root}/returns/${item.symbol}.parquet

  compute_covariance:
    matrix:
      window: ${return_panels}
    desc: >-
      Variance-covariance matrix from every ticker return series of one
      evaluation window. Cells are named by matrix axis index: window0 is the
      in-sample 2018-22 panel and window1 the out-of-sample 2023-26 panel
      (params.yaml:return_panels, whose order is load-bearing). Both windows run
      on the same configured market-symbol panel, so there is no differential
      roster attrition between the windows and the out-of-sample Mantel run uses
      an identical firm set. The complete-case contract carried per window in
      the roster is a hard guard, not a nominal default.
    cmd: >-
      ${py_pipeline} compute-covariance
      --returns-dir ${item.window.root}/returns
      --output-file ${item.window.root}/covariance_matrix.parquet
      --expected-tickers ${item.window.expected_tickers}
      --expected-observations ${item.window.expected_observations}
      --expected-start-date ${item.window.expected_start_date}
      --expected-end-date ${item.window.expected_end_date}
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-covariance.json
    - ${item.window.root}/returns
    outs:
    - ${item.window.root}/covariance_matrix.parquet

  backtest_feasibility:
    # FROZEN: reads `data/shared/corpus/articles.parquet` (full article text),
    # which is not redistributable. Its outputs are published; see
    # `normalize_corpus` above for the unfreeze procedure.
    frozen: true
    # Single-pass light-compute analysis (counts/aggregations over the configured
    # return calendar and corpus). The (window_type x T) grid is swept
    # INTERNALLY from the params roster (t15 single-source-the-axis: the grid
    # lives only in params.yaml:backtest_feasibility); NOT matrix-ized here
    # because each cell is milliseconds and per-cell DVC caching buys nothing —
    # the heavy per-BacktestConfig-cell sweep is t17.4's matrix stage. Additive:
    # writes new data/shared/backtest_feasibility/* and changes no paper output.
    desc: >-
      Assess the minimal feasible backtest estimation window per channel
      (returns conditioning T>N/5N/10N; news article density >=30/>=100) at the
      actual rebalance dates for rolling + expanding windows; emits the
      constructibility cliff table + figure + minimal-T recommendation.
    cmd: >-
      ${py_pipeline} backtest-feasibility
      --returns-dir ${shared}/returns
      --corpus-path ${shared}/corpus/articles.parquet
      --params-file params.yaml
      --output-dir ${shared}/backtest_feasibility
    deps:
    - .semflow/hashes/entrypoints/pipeline/backtest-feasibility.json
    - ${shared}/returns
    - ${shared}/corpus/articles.parquet
    params:
    - backtest_feasibility.window_types
    - backtest_feasibility.windows
    - backtest_feasibility.n_assets_nominal
    - backtest_feasibility.returns_conditioning_multiples
    - backtest_feasibility.news_thresholds
    outs:
    - ${shared}/backtest_feasibility/constructibility.parquet
    - ${shared}/backtest_feasibility/binding_tickers.parquet
    - ${shared}/backtest_feasibility/summary.yaml
    - ${shared}/backtest_feasibility/constructibility_cliff.pgf

  # The out-of-sample market, returns, covariance, and Mantel artifacts are the
  # window1 cells of their respective matrix families. The window roots keep
  # artifacts path-disjoint while the command templates stay shared.

  # ====================================================================
  # PAPER 1 - representation geometry
  # ====================================================================

  p1_dyadic_confound:
    # FROZEN: reads `data/shared/market_data`, a vendor price panel the public
    # bucket cannot carry, so no replicator can re-run this stage.  Its outputs
    # are published instead; see `normalize_corpus` above for the unfreeze
    # procedure.
    frozen: true
    desc: >-
      Paper 1 fixed-W2 random-exposure envelope diagnostic, contiguous W2
      specification ladder, canonical symmetric-firm-effect slope, and one
      energy comparison row. All reported inference uses the common
      multinomial node-bootstrap schedule.
    cmd: >-
      ${py_pipeline} compute-dyadic-confound
      --distance-artifact-dir ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/wasserstein_w2
      --energy-comparator-artifact-dir ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/energy_v
      --covariance-matrix ${shared}/covariance_matrix.parquet
      --universe-csv data/universe.csv
      --market-data-dir ${shared}/market_data
      --returns-dir ${shared}/returns
      --embeddings-dir ${shared}/embeddings/${paper1_lead_model}
      --output-file ${p1}/dyadic_confound/summary.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-dyadic-confound.json
    - ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/wasserstein_w2
    - ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/energy_v
    - ${shared}/covariance_matrix.parquet
    - data/universe.csv
    - ${shared}/market_data
    - ${shared}/returns
    - ${shared}/embeddings/${paper1_lead_model}
    # CACHED, unlike the other Paper 1 diagnostics: every Paper 1 terminal
    # derives from these, and the stage itself cannot be re-run without the
    # withheld vendor panel, so they are the public snapshot's only route to
    # `p1_numbers` and `p1_tables`.  They carry coefficients, residuals, W2
    # distances and bootstrap draws -- no price levels.
    outs:
    - ${p1}/dyadic_confound/summary.yaml
    - ${p1}/dyadic_confound/node_bootstrap_counts.parquet
    - ${p1}/dyadic_confound/bootstrap_draws.parquet
    - ${p1}/dyadic_confound/design_diagnostics.parquet
    - ${p1}/dyadic_confound/w2_primary_fit.parquet
    - ${p1}/dyadic_confound/leave_one_firm_out.parquet
    - ${p1}/dyadic_confound/residual_scale_null.parquet
    - ${p1}/dyadic_confound/random_exposure_diagnostic.parquet

  p1_dyadic_oos:
    desc: >-
      Out-of-sample primary W2 dyadic association (t37). The text-side
      matrix is held FIXED at its 2018-22 in-sample estimate (the news archive
      ends 2023-01-02, so every article predates the evaluation window by
      construction) and only the return chord distance is recomputed, from the
      2023-2026 out-of-sample correlation matrix; intercept and symmetric
      additive firm effects are re-estimated on the surviving panel. This is the
      look-ahead-free counterpart to the manuscript's primary specification,
      under the same zero-coefficient estimand. The primary text metric is the frozen
      Qwen3-Embedding 8B W2 matrix. Lead encoder only, deliberately not matrixed
      over the embedding roster: a sweep would open a model-selection channel
      on the only look-ahead-free evidence in the paper. Inference convention is fixed in
      advance by the in-sample design (1,999 multinomial node-bootstrap draws,
      seed 42, 2.5/97.5 percentile interval); a null result ships unchanged.
    cmd: >-
      ${py_pipeline} compute-dyadic-oos
      --distance-artifact-dir ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/wasserstein_w2
      --covariance-matrix ${shared}/oos/covariance_matrix.parquet
      --output-file ${p1}/dyadic_oos/summary.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-dyadic-oos.json
    - ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/wasserstein_w2
    - ${shared}/oos/covariance_matrix.parquet
    outs:
    - ${p1}/dyadic_oos/summary.yaml:
        cache: false
    - ${p1}/dyadic_oos/bootstrap_draws.parquet:
        cache: false
    - ${p1}/dyadic_oos/node_bootstrap_counts.parquet:
        cache: false

  p1_sample_descriptives:
    desc: >-
      Sample descriptives for the Paper 1 estimation universe: per-sector firm
      counts, article counts (total and per year), daily simple-return volatility,
      and mean within- vs cross-sector rooted W2 distance.
    cmd: >-
      ${py_pipeline} compute-sample-descriptives
      --universe-csv data/universe.csv
      --embeddings-dir ${shared}/embeddings/${paper1_lead_model}
      --returns-dir ${shared}/returns
      --distance-artifact-dir ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/wasserstein_w2
      --output-file ${p1}/sample_descriptives/summary.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-sample-descriptives.json
    - data/universe.csv
    - ${shared}/embeddings/${paper1_lead_model}
    - ${shared}/returns
    - ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/wasserstein_w2
    outs:
    - ${p1}/sample_descriptives/summary.yaml:
        cache: false

  p1_tables:
    desc: >-
      Render Paper 1's sample-descriptives LaTeX table fragment from the
      p1_sample_descriptives summary. Split from p1_numbers so a table-layout
      edit does not invalidate the number bindings.
    cmd: >-
      ${py_pipeline} render-paper1-tables
      --summary-file ${p1}/sample_descriptives/summary.yaml
      --output-file
      src/latex/projects/01_continuous_bounds/src/generated/sample_descriptives.tex
      --dyadic-summary ${p1}/dyadic_confound/summary.yaml
      --disco-summary ${p1}/disco/summary.yaml
      --representation-summary ${p1}/representation_sensitivity/summary.yaml
      --oos-dyadic-summary ${p1}/dyadic_oos/summary.yaml
      --dyadic-design-diagnostics ${p1}/dyadic_confound/design_diagnostics.parquet
      --output-dir src/latex/projects/01_continuous_bounds/src/generated
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-tables.json
    - ${p1}/sample_descriptives/summary.yaml
    - ${p1}/dyadic_confound/summary.yaml
    - ${p1}/disco/summary.yaml
    - ${p1}/representation_sensitivity/summary.yaml
    - ${p1}/dyadic_oos/summary.yaml
    - ${p1}/dyadic_confound/design_diagnostics.parquet
    outs:
    - src/latex/projects/01_continuous_bounds/src/generated/sample_descriptives.tex:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/generated/w2_primary_results.tex:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/generated/dyadic_ladder.tex:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/generated/w2_representation_sensitivity.tex:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/generated/w2_sampling_diagnostics.tex:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/generated/dyadic_design_diagnostics.tex:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/generated/random_exposure_diagnostic.tex:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/generated/disco_decomposition.tex:
        cache: false

  p1_sample_universe_table:
    desc: >-
      Render Paper 1's canonical priced W2 ticker, name, and sector roster as
      a generated appendix longtable.
    cmd: >-
      ${py_pipeline} render-sample-universe-table
      --universe-csv data/universe.csv
      --returns-dir ${shared}/returns
      --distance-artifact-dir
      ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/wasserstein_w2
      --provider-id ${paper1_lead_model}
      --representation-id ${paper1_lead_model}-unit
      --distance-id wasserstein_w2
      --output-file
      src/latex/projects/01_continuous_bounds/src/generated/sample_universe.tex
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-sample-universe-table.json
    - data/universe.csv
    - ${shared}/returns
    - ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-unit/wasserstein_w2
    outs:
    - src/latex/projects/01_continuous_bounds/src/generated/sample_universe.tex:
        cache: false

  p1_diagnostics:
    desc: >-
      Render Paper 1's W2 Matryoshka preservation and primary W2
      residual/curvature/influence diagnostics.
    cmd: >-
      ${py_pipeline} render-paper1-diagnostics
      --full-distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
      --distance-artifact-64-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-64-unit/wasserstein_w2
      --distance-artifact-256-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-256-unit/wasserstein_w2
      --provider-id ${paper1_lead_model}
      --representation-id ${paper1_lead_model}-unit
      --representation-64-id ${scientific_selectors.baseline_model}-64-unit
      --representation-256-id ${scientific_selectors.baseline_model}-256-unit
      --distance-id wasserstein_w2
      --output-dir src/latex/projects/01_continuous_bounds/src/images
      --summary-file ${p1}/diagnostics/summary.yaml
      --dyadic-summary-file ${p1}/dyadic_confound/summary.yaml
      --w2-primary-fit-file ${p1}/dyadic_confound/w2_primary_fit.parquet
      --lofo-file ${p1}/dyadic_confound/leave_one_firm_out.parquet
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-diagnostics.json
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-64-unit/wasserstein_w2
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-256-unit/wasserstein_w2
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
    - ${p1}/dyadic_confound/summary.yaml
    - ${p1}/dyadic_confound/w2_primary_fit.parquet
    - ${p1}/dyadic_confound/leave_one_firm_out.parquet
    outs:
    - src/latex/projects/01_continuous_bounds/src/images/matryoshka_distance_preservation.pgf:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/images/dyadic_postfit_diagnostics.pgf:
        cache: false
    - ${p1}/diagnostics/summary.yaml:
        cache: false

  p1_disco:
    desc: >-
      t19 DISCO (energy-distance ANOVA, Rizzo-Szekely 2010) global
      sector-separation statistic, implemented in JAX on the canonical
      square-root energy metric: R^2_E, F-ratio, and an
      add-one label-permutation p, plus a PCoA distance-to-median dispersion
      companion (PERMDISP-style) with its own permutation p. Replaces the
      silhouette table as the reported global sector-separation statistic;
      p1_dyadic_confound (t13) remains the primary confound-aware result and
      p1_sector_alignment (t18) is retained as the local companion.
    cmd: >-
      ${py_pipeline} compute-disco
      --distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/energy_v
      --provider-id ${scientific_selectors.typed_distance_provider}
      --representation-id ${scientific_selectors.typed_distance_representation}
      --distance-id energy_v
      --universe-csv data/universe.csv
      --output-file ${p1}/disco/summary.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-disco.json
    - ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/energy_v
    - data/universe.csv
    outs:
    - ${p1}/disco/summary.yaml:
        cache: false

  p1_distributional_comparator:
    desc: >-
      Paper 1's cross-encoder distributional comparison and inference diagnostics.
      It consumes the shared, typed Wasserstein-W1 artifacts for the common
      m=128 panel, recomputes matched V-energy and signed-U diagnostics on
      deterministic url-hash prefixes, and writes the paired metric
      panel used by Paper 1 tables and headline numbers. It also evaluates the
      Qwen3-Embedding-8B m=32/64/128 sensitivity curve, same-firm split
      noise floors for m<=64, and paired node bootstraps excluding duplicate-
      original self-dyads. This stage compares validated distances; it is not
      the shared Wasserstein-distance producer.
    cmd: >-
      ${py_pipeline} compute-wasserstein-comparator
      --embeddings-root ${shared}/embeddings
      --typed-distance-root ${shared}/typed_distances
      --covariance-matrix ${shared}/covariance_matrix.parquet
      --output-summary ${p1}/wasserstein_comparator/summary.yaml
      --output-pairs ${p1}/wasserstein_comparator/pairs.parquet
      --bootstrap-iters 999
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-wasserstein-comparator.json
    - ${shared}/embeddings/qwen3-embedding-4b
    - ${shared}/embeddings/qwen3-embedding-8b
    - ${shared}/embeddings/bge-m3
    - ${shared}/embeddings/bge-large-en-v1.5
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-unit/wasserstein_w1
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w1
    - ${shared}/typed_distances/bge-m3/bge-m3-unit/wasserstein_w1
    - ${shared}/typed_distances/bge-large-en-v1.5/bge-large-en-v1.5-unit/wasserstein_w1
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2
    - ${shared}/typed_distances/bge-m3/bge-m3-unit/wasserstein_w2
    - ${shared}/typed_distances/bge-large-en-v1.5/bge-large-en-v1.5-unit/wasserstein_w2
    - ${shared}/covariance_matrix.parquet
    outs:
    - ${p1}/wasserstein_comparator/summary.yaml:
        cache: false
    - ${p1}/wasserstein_comparator/pairs.parquet:
        cache: false

  p1_representation_sensitivity:
    desc: >-
      Compare the seven governed encoder/dimension cells, article-count, and statistical-distance choices under
      Paper 1's canonical symmetric-firm-effect estimator. Every row reuses the
      same 1,999-draw node schedule and reports rank agreement with canonical
      W2, a standardized association interval, and partial R-squared.
    cmd: >-
      ${py_pipeline} compute-representation-sensitivity
      --pairs-file ${p1}/wasserstein_comparator/pairs.parquet
      --node-counts-file ${p1}/dyadic_confound/node_bootstrap_counts.parquet
      --representation-dir ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-1024-unit/wasserstein_w2
      --representation-dir ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-1024-unit/wasserstein_w2
