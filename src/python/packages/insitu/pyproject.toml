[project]
name = "insitu"
version = "0.1.1"
description = "Reactive, typed materializations for Markdown and YAML front matter."
readme = "README.md"
requires-python = "~=3.13.0"
license = "MIT"
dependencies = [
  "jinja2>=3.1.6",
  "packaging>=25.0",
  # dbt-common (harnessme's workspace member) currently caps pathspec below 1.1.
  # Insitu uses only GitIgnoreSpec.from_lines()/match_file(); that API and its
  # git-ignore semantics are unchanged across pathspec 0.12.1 -> 1.0.x.
  "pathspec>=0.12.1,<1.1",
  "pydantic>=2.13.4",
  "pygit2>=1.20.0,<2",
  "rich>=14.0.0",
  "ruamel-yaml>=0.18.17",
  "typer>=0.24.0",
  "watchfiles>=1.2.0",
]

[project.scripts]
insitu = "insitu.cli:app"

[dependency-groups]
dev = [
  "deptry",
  "pytest",
  "pytest-asyncio",
  "pytest-benchmark",
  "pytest-monitor",
  "pytest-testmon",
  "pytest-xdist",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry]
known_first_party = ["insitu"]

[tool.hatch.build.targets.wheel]
packages = ["src/insitu"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "-m", "not benchmark"]
asyncio_mode = "auto"
markers = [
  "unit: isolated behavior",
  "integration: filesystem, database, or subprocess boundary",
  "benchmark: opt-in performance budget",
  "protocol: polyglot JSON-RPC boundary",
]
testpaths = ["tests"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
ignore = [
  "COM812",
  "CPY001",
  "D203",
  "D213",
  "D107",
  "DOC201",
  "DOC402",
  "EM101",
  "EM102",
  "ISC001",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"src/insitu/__init__.py" = ["RUF067"]
"src/insitu/builtins/jinja.py" = ["S701"]
"src/insitu/builtins/sql.py" = ["S701"]
"src/insitu/builtins/tree.py" = ["PLR2004"]
"src/insitu/cli.py" = ["B008", "FBT"]
"src/insitu/documents.py" = ["ANN401", "PLR2004", "TRY004"]
"src/insitu/extensions.py" = [
  "ASYNC240",
  "C901",
  "FBT001",
  "PLR0911",
  "PLR0912",
  "PLW0717",
  "RUF029",
  "SIM105",
  "TRY004",
  "TRY301"
]
"src/insitu/graph.py" = ["UP046"]
"src/insitu/index.py" = ["C901", "PLR0912", "S608"]
"src/insitu/installer.py" = ["C901", "PLR0912", "S404", "S607"]
"src/insitu/protocol.py" = ["ASYNC109", "PLW0717"]
"src/insitu/reconcile.py" = [
  "C416",
  "C901",
  "E501",
  "PLR0912",
  "PLR0915",
  "RUF029",
  "SIM102"
]
"src/insitu/sdk.py" = ["ANN401", "ASYNC240", "RUF029"]
"src/insitu/types.py" = ["A005"]
"src/insitu/watcher.py" = ["ASYNC240"]
"tests/**/*.py" = [
  "ANN",
  "D",
  "INP001",
  "PLR2004",
  "PT018",
  "S101",
  "S108",
  "S404",
  "S603",
  "S607"
]

[tool.uv]
package = true
