      ${paper5.universe_horizon_bridge.expanded_n_firms} --n-bootstrap ${paper5.qmle.n_bootstrap} --block-length
      ${paper5.qmle.block_length} --seed ${paper5.qmle.seed} --shared-return-tolerance ${paper5.universe_horizon_bridge.shared_return_tolerance}
      --result-tolerance ${paper5.universe_horizon_bridge.result_tolerance} --reference-revision ${paper5.universe_horizon_bridge.reference_revision}
      --provider-id ${paper5.provider_id} --representation-id ${paper5.representation_id} --barycentre-arm-id
      ${paper5.barycentre_arm_id} --geometry-id ${paper5.distance_id}
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper5-universe-horizon-bridge.json
    - ${shared}/returns
    - ${shared}/oos/returns
    - ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
    - ${p5}/post_corpus_qmle/results.json
