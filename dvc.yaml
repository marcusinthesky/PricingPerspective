  p1_neighbour_outcome_split_render:
    desc: >-
      Render the selected-sector 2021-2022 cumulative-log-return exhibit and its
      canonical registered semantic interpretation contract, which now also
      registers that the evaluation window is reused in-sample data. The figure
      stem and the neighbour-holdout-* number bindings deliberately keep their
      published names -- they are spelled in appendix_robustness.tex -- so only
      the contract ID moved (t80).
    cmd: >-
      ${py_pipeline} render-paper1-neighbour-outcome-split
      --summary-file ${p1}/neighbour_outcome_split/summary.json
      --provenance-file ${p1}/neighbour_outcome_split/provenance.json
      --selection-file ${p1}/neighbour_outcome_split/selection.json
      --pair-paths-file ${p1}/neighbour_outcome_split/pair_paths.parquet
