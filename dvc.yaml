    - ${p1}/pcoa/results.json
    - ${p1}/pcoa/coords_2d.parquet
    - ${p1}/pcoa/spectrum.parquet
    - ${p1}/pcoa/neighbours.parquet
    - ${p1}/pcoa/metric_mds_coords_2d.parquet
    - ${p1}/pcoa/metric_mds_neighbours.parquet
    outs:
    - ${p1_tex}/images/metric_mds_sector_plot.pgf:
        cache: false
    - ${p1_tex}/images/metric_mds_shepard_diagnostic.pgf:
        cache: false
    - ${p1_tex}/images/pcoa_scree.pgf:
        cache: false
    - ${p1_tex}/images/pcoa_vintage_scree.pgf:
        cache: false
    - ${p1_tex}/generated/pcoa_spectrum.tex:
        cache: false
  p1_numbers:
    desc: Generate only the LaTeX scalar bindings consumed by Paper 1 from the W2 dyadic, W2-PERMANOVA,
      sample, projection, and exploratory summaries. Split from p1_figures for cache isolation.
    cmd: ${py_pipeline} render-paper1-numbers --universe-csv data/universe.csv --source-articles-dir ${shared}/article_metadata
      --numbers-path ${p1_tex}/generated/numbers.tex --dyadic-confound-summary ${p1}/dyadic_confound/results.json
      --w2-permanova-summary ${p1}/w2_permanova/results.json --sample-descriptives-summary ${shared}/sample_descriptives/results.json
      --diagnostics-summary ${p1}/diagnostics/results.json --pcoa-summary ${p1}/pcoa/results.json --neighbour-outcome-split-summary
      ${p1}/neighbour_outcome_split/results.json --covariance-matrix ${shared}/covariance_matrix.parquet
      --oos-covariance-matrix ${shared}/oos/covariance_matrix.parquet --oos-dyadic-summary ${p1}/dyadic_oos/results.json
      --text-controls-summary ${p1}/text_controls/results.json --params-file params.yaml --corpus-summary
      ${shared}/corpus/summary.yaml
    deps:
    - data/universe.csv
    - ${shared}/article_metadata
    - .semflow/hashes/entrypoints/pipeline/render-paper1-numbers.json
    - ${shared}/corpus/summary.yaml
    - ${p1}/dyadic_confound/results.json
    - ${p1}/w2_permanova/results.json
    - ${p1}/w2_permanova/permutation_audit.npz
    - ${shared}/sample_descriptives/results.json
    - ${p1}/diagnostics/results.json
    - ${p1}/neighbour_outcome_split/results.json
    - ${p1}/pcoa/results.json
    - ${shared}/covariance_matrix.parquet
    - ${shared}/oos/covariance_matrix.parquet
    - ${p1}/dyadic_oos/results.json
    - ${p1}/text_controls/results.json
