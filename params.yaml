# Paper 5 bootstrap/Monte-Carlo replication scale (t16 B=2000 rerun): the
# pre-registered anti-snooping scale (R14 lesson, also applied in Paper 3).
paper5:
  provider_id: *baseline_embedding_model
  representation_id: &qwen3-embedding-8b-unit qwen3-embedding-8b-unit
  distance_id: wasserstein_w2
  barycentre_arm_id: wasserstein_w2_loo
  wasserstein_w1_arm_id: wasserstein_w1_loo
  factor_data:
    primary_model: ff5_mom
    # Nested controls follow Ge--Li--Linton's factor-set comparison; FF3+MOM
    # is the additional bridge requested for Paper 5.
    diagnostic_models: [ff3, ff3_mom, ff5]
    sources: *fama_french_sources
  # One stationary-bootstrap design shared by every Paper 5 inference block.
  qmle: &p5_bootstrap
    n_bootstrap: 2000  # joint-date bootstrap draws per pooled/annual cell
    block_length: 21   # expected stationary-bootstrap block length
    seed: 0            # common resampling seed schedule
  # Registered after the feasibility audit but before the governed production
  # run. W1/W2 changes transport geometry, not investment-cost curvature;
  # FF5+MOM remains primary beside the nested factor-set diagnostics above.
  transport_order:
    factor_model: ff5_mom
    calibration_start: *in_sample_start_date
    calibration_end: *in_sample_end_date
    evaluation_start: *oos_start_date
    evaluation_end: *oos_last_date
    confidence_level: 0.95
    equivalence_alpha: 0.05
    # Equivalence is relative to an economic scale fixed on calibration data:
    # 1% of W2's factor-QMLE score gain over the rho=0 factor model.
    predictive_equivalence_gain_share: 0.01
    # Both conditions flag weak operator separation. The follow-up nested model
    # enters both admissible matrices unchanged; it never residualizes either.
    minimum_signal_correlation: 0.98
    maximum_relative_signal_difference_sd: 0.10
    active_weight_tolerance: 1.0e-8
    incremental_qlr_alpha: 0.05
    joint_theta_points: 401  # W1 mixture-share profile on [0, 1]
    joint_rho_points: 1000   # total-feedback profile on [0, 0.999]
  # Prespecified model-value audit. The spherical FF5+MOM model remains
  # primary; diagonal firm variances are a matched robustness specification.
  spatial_value_comparison:
    factor_model: ff5_mom
    calibration_start: *in_sample_start_date
    calibration_end: *in_sample_end_date
    evaluation_start: *oos_start_date
    evaluation_end: *oos_last_date
    confidence_level: 0.95
    qlr_alpha: 0.05
    <<: *p5_bootstrap
  # Economic interpretation diagnostics. Operators are compared under the
  # primary factor-conditioned likelihood; no portfolio weights or covariance-
  # based allocation are estimated here. RBF tuning uses only the inner
  # calibration split and refits the selected bandwidth through 2022.
  economic_value:
    factor_model: ff5_mom
    calibration_start: *in_sample_start_date
    calibration_end: *in_sample_end_date
    inner_training_end: "2020-12-31"
    inner_validation_start: "2021-01-01"
    evaluation_start: *oos_start_date
    evaluation_end: *oos_last_date
    confidence_level: 0.95
    <<: *p5_bootstrap
    rbf_multipliers: "0.25,0.5,1.0,2.0,4.0"
    active_weight_tolerance: 1.0e-8
  # Published 2017 training-information cutoff precedes article construction
  # and calibration; this is not a claim of historical deployment availability.
  point_in_time_encoder:
    provider_id: chronobert-2017
    representation_id: chronobert-2017-unit
    w2_barycentre_arm_id: wasserstein_w2_loo
    w2_geometry_id: wasserstein_w2
    factor_model: ff5_mom
    calibration_start: *in_sample_start_date
    calibration_end: *in_sample_end_date
    evaluation_start: *oos_start_date
    evaluation_end: *oos_last_date
    confidence_level: 0.95
    <<: *p5_bootstrap
  # Named peer baskets for the economic-interpretation exhibits. Rows are the
  # row-normalized W2 barycentric, median-bandwidth W2 RBF, and persistent
  # co-mention operators scored in the field comparison. featured_target is the
  # firm drawn in peer_basket; figure_target is drawn in peer_definitions.
  peer_definitions:
    targets: "AMD,HON,JBHT,XEL"
    top_k: 5
    featured_target: AMD
    figure_target: HON
  # Mechanism diagnostic: leading-coordinate prefixes are truncated and then
  # row-normalized by the typed representation boundary. Chord distances and
  # their first-/second-order assignment costs remain on their native scale.
  transport_dimension_ladder:
    cell_ids: [qwen8b_full, qwen8b_1024, qwen8b_256, qwen8b_64]
    expected_dimensions: [4096, 1024, 256, 64]
    factor_model: ff5_mom
    calibration_start: *in_sample_start_date
    calibration_end: *in_sample_end_date
    evaluation_start: *oos_start_date
    evaluation_end: *oos_last_date
    ground_metric: euclidean_chord
    distance_rescaling: none
  # The referenced DVC inputs retain the original 52-firm operator and the OOS
  # histories through the governed 2026-07-15 comparison endpoint.
  universe_horizon_bridge:
    reference_revision: "7381033e76244c68835bc232a593f9086384f339"
    reference_n_firms: 52
    expanded_n_firms: 100
    evaluation_start: *oos_start_date
    short_end: *oos_last_date
    long_end: "2026-07-15"
    shared_return_tolerance: 0.0
    result_tolerance: 1.0e-6
  # Joint two-field estimation (t33). The barycentric operator and the persistent
  # news co-mention graph are admitted as two priced channels in one exposure
  # equilibrium; the separate single-field fits are the theta=1 and theta=0
  # boundaries of the same nested family. Bootstrap controls deliberately mirror
  # `qmle` above so the joint and single-field intervals are comparable.
  two_field:
    <<: *p5_bootstrap
    n_random: 1000     # matched-sparsity draws calibrating support agreement
    theta_points: 401  # mixture-weight profile resolution on [0, 1]
    rho_points: 1000   # total-feedback profile resolution on [0, 0.999]
  network_certificate:
    tolerance: 1.0e-12  # float64 structural and contraction witness tolerance



