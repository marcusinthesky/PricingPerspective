    - src/lean/blueprint/src/macros/common.tex
    - src/lean/blueprint/src/macros/print.tex
    - src/lean/blueprint/src/macros/web.tex
    - src/lean/blueprint/check.py
    - src/lean/tools/claim-manifest/render.py
    - src/lean/tools/claim-manifest/mapping.toml
    - src/lean/tools/claim-manifest/paper6-publication.toml
    - src/lean/tools/claim-manifest/generated/manifest.json
    - src/lean/tools/claim-manifest/generated/paper6-publication.json
    - ${p1_tex}/chapters
    - ${p3_tex}/chapters
    - ${p5_tex}/chapters
    - ${p6_tex}/chapters
    - ${p1_tex}/generated/lean_status.tex
    - ${p3_tex}/generated/lean_status.tex
    - ${p5_tex}/generated/lean_status.tex
    - ${p6_tex}/generated/lean_status.tex
