  render:
    foreach:
      01_continuous_bounds-arxiv:
        paper: 01_continuous_bounds
        target: arxiv
        archive: tar.gz
      03_distance_implied_mpt-arxiv:
        paper: 03_distance_implied_mpt
        target: arxiv
        archive: tar.gz
      05_spatial_pricing-arxiv:
        paper: 05_spatial_pricing
        target: arxiv
        archive: tar.gz
      06_information_motion-arxiv:
        paper: 06_information_motion
        target: arxiv
        archive: tar.gz
    do:
      desc: Compile one arXiv manuscript with Tectonic (check-log gated), then stage, audit and deterministically
        archive its source bundle. The bundle step recompiles twice (clean room, then from the archive),
        so a PDF is never published from sources that would not survive upload. Outputs are git (LFS)
        tracked, not pushed to the DVC remote.
      cmd: just latex::build ${item.paper} ${item.target} && just latex::_bundle ${item.paper} ${item.target}
      deps:
      - src/latex/justfile
      - src/latex/templates/pp-manuscript.sty
      - src/latex/bundle/tlextras-2022.0r0-pricing-perspective.zip
      - src/latex/tools/check-log
