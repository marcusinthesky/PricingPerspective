name: Lean publication checks
on:
  pull_request:
    paths: ['src/lean/**', 'src/latex/**', 'infra/nix/**', 'devenv.*', '.github/workflows/lean.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Certify the complete publication closure
        run: nix develop ./infra/nix#lean --command bash -euc 'just nix::parity; just lean::cache; just lean::publication-check'
