[model]
vocab_size = 32768
width = 320
layers = 12
heads = 5
ff_width = 576
local_window = 128
global_every = 3
rope_theta = 160000.0
pad_id = 0
doc_id = 1
eos_id = 2
unk_id = 3
delete_rate = 0.60
decoder_mask_rate = 0.0
bow_weight = 0.0
decoder_layers = 1
