  p5_post_corpus_qmle:
    desc: >-
      Paper 5 pooled 2023--2026 SAR QMLE with non-overlapping annual stability
      estimates. The 2018--2022 W2 and co-mention operators remain frozen;
      uncertainty uses joint-date stationary bootstrap.
    cmd: >-
      ${py_pipeline} paper5-post-corpus-qmle
      --returns-dir ${shared}/returns
      --oos-returns-dir ${shared}/oos/returns
      --shared-barycentre-dir
      ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
