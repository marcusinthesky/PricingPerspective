    ample: 10                                # T >= 10N (ample)
  news_thresholds: [30, 100]                 # per-ticker in-window article counts (usable/stability)

# Monte-Carlo validation of Lean theorem portfolio_variance_lower_bound
monte_carlo:
  # n=250 DISPOSITION (t22 diagnosis, applied here): KEPT, not removed. The
  # w1-t22 probe (src/python/scripts/paper3_n250_probe.py) root-caused the T=10 regret
  # reversal at n=250 to catastrophic ridge-repair ill-conditioning
  # (60.8% negative Sigma_dist eigenvalues pre-repair -> condition number
  # 1e9-1e302 post-repair) specifically inside
  # `simulation.validation.pricefree.pf_dist_mvo_portfolio`'s inline ridge
  # repair -- a bug in that one call site, not in this shared n_assets grid
  # (also consumed by hedging_error_bound and other MC stages where n=250
  # is not known to be broken). Removing 250 here would silently shrink
  # those unrelated grids too, which is out of this wave's file scope to
  # verify safe. The recommended fix (swap in `higham_nearest_psd` for
  # `pf_dist_mvo_portfolio`'s repair) is deferred; the regret table caption
  # stays pinned to n<=100 per t22 until that fix or an explicit grid split
  # lands.
  n_assets: [10, 20, 50, 100, 250]
  embedding_dim: [8, 64]
  n_points_per_asset: 128
  n_clusters: 4
  n_weight_draws: 5
  lipschitz_scale_factors: [1.0, 1.5]
  # Deliberately sub-tight Lipschitz constants for `mc_variance_floor`'s
  # tightness probe. `lipschitz_scale_factors` are all >= 1, where the theorem's
  # hypothesis holds and the floor is decreasing in `l`, so zero violations
  # there is a statement about monotonicity, not about the bound. These factors
  # break the hypothesis on purpose: violations are the EXPECTED outcome and
  # their absence would mean the floor is too slack to be informative. Reported
  # and logged, never gated — see `simulation.validation.variance_floor`.
  #
  # The grid brackets the measured knee rather than sampling arbitrarily. On a
  # {10,20,53} x {8,64} pilot the floor first binds between 0.20 and 0.15:
  #     0.50 0.40 0.30 0.25 0.20 -> 0/190 violations
  #     0.15 -> 20/190,  0.10 -> 24/190,  0.05..0.0 -> 24/190 (saturated)
  # i.e. the certified floor carries roughly a 5x Lipschitz margin, which is the
  # quantity `probe_binding_scale` reports and the number "zero violations"
  # alone was concealing.
  lipschitz_tightness_probe_factors: [0.5, 0.2, 0.15, 0.1]
  tolerance: 1.0e-9
  seed: 42
  # Simulation package precision/batching (apps/simulation T4)
  precision: float64    # Certificate stages require float64; float32 eligible for statistical stages
  replication_batch_size: 64  # result-invariant vmap/lax.map replication chunk
  # Hedging-error bound pilot (validate_hedging_error_bound stage)
  hedging_error_solver: qp        # exact energy-barycentre solver (deterministic interior-point QP on the tangent-reduced program; qpax)
  hedging_error_tol: 1.0e-8       # Interior-point optimality-gap tolerance. The convex reduced QP reaches Frank-Wolfe gaps ~1e-11 in float64, so this strict gate passes deterministically (the retired PGD path plateaued non-reproducibly at ~1e-7..1e-5). Loosen only when run in float32 (GPU), where the gap floors near ~1e-6.
  hedging_error_maxiter: 10000    # Caller iteration budget; the interior-point iteration cap is min(this, 100).
  hedging_error_vmap_batch: true  # activate the batched vmap barycentre solver (removes per-target
                                  # Python-loop serialization; ~1.5-2.5x). NOT bit-identical vs serial
                                  # (qpax lax.while_loop runs to batch-max iters); drift ~1e-15 in
                                  # float64 << 1e-8 gate. Re-certify outputs before commit.
  # PUNCHLINE experiment: price-free vs sample-MVO (compare_pricefree_portfolios stage)
  pricefree_T_values: [10, 20, 60, 250]   # Return sample sizes to compare (T=10,20 for high-dim n>=T regime)
  pricefree_sigma_eps: 0.1            # Idiosyncratic noise std (σ_ε)
  pricefree_n_sims: 30                # Return simulations per (config, T)
  pricefree_pgd_steps: 5000           # Projected gradient descent iterations
  # Type I/II validation of energy permutation test (simulate_test_size_power stage)
  test_size_power:
    n_sims: 200                         # Simulations per (dist, n, d, alpha) cell
    num_permutations: 199               # Permutations per single test
    n_values: [32, 64, 128, 256]        # Sample sizes
    d_values: [2, 8]                    # Dimensions
    alpha_levels: [0.01, 0.05, 0.10]   # Nominal significance levels
    mean_shifts: [0.25, 0.5, 1.0]      # Mean-shift deltas (multiples of sigma)
    scale_factors: [1.25, 1.5, 2.0]    # Scale-shift factors
    contamination_fracs: [0.10, 0.25]  # Mixture contamination fractions
    seed: 42
  # t17 backtest overlay D6: SIZE/POWER of the overlap-robust Sharpe-superiority
  # test as a function of the evaluation-window length T. Validates that the
  # inference controls size (~alpha) and gains power with T, empirically
  # justifying a minimal T (simulate-window-size-power stage). HEAVY at
  # n_sims=1000 (D6 protocol) x len(t_values) x bootstrap — for the main
  # session / author to `dvc repro`; tests + the overnight smoke override with
  # tiny budgets. Additive: validates the NEW simulation.sharpe_tests layer.
  window_size_power:
    t_values: [63, 126, 252, 504, 756]  # evaluation-window lengths (trading days)
    phi: 0.2                            # AR(1) serial dependence (exercises block bootstrap)
    deltas: [0.1, 0.2, 0.3, 0.5]        # true per-period Sharpe gaps (power sweep)
    alpha_levels: [0.01, 0.05, 0.10]    # nominal significance levels (alpha_levels[0] primary)
    n_sims: 1000                        # MC replications per cell (D6: >= 1000)
    n_boot: 999                         # bootstrap resamples per Sharpe test
    k_strategies: 5                     # null strategies in the FWER family
    seed: 42
  # Paper 2 P0-2: simplified equivalence-boundary rejection/power diagnostic.
  # The full profile is intentionally heavy; tests override it with tiny budgets.
  equivalence_calibration:
    n_sims: 2000               # Monte-Carlo families per design cell
    n_resamples: 2000          # Joint multiplier draws per family
    n_target: 64               # Observations in the shared target sample
    n_candidate: 64            # Observations in each candidate sample
    m_values: [10, 50]         # Number of correlated equivalence claims
    target_correlation: 0.30   # Common candidate-innovation share
    delta: 0.50                # Population energy-distance equivalence margin
    alpha: 0.05
    null_fractions: [1.0, 0.5]  # All-boundary and mixed null/alternative families
    power_energy_ratio: 0.50   # Alternative energy as a fraction of delta
    variance_cells:
      - {name: equal, target_sd: 1.0, candidate_sd: 1.0}
      - {name: unequal, target_sd: 1.0, candidate_sd: 1.5}
    seed: 4202
  # Paper 3: GMM Wald + Wolak inequality size/power (gates Wave-2 empirics).
  # Data-free: synthetic AR(1) moment panels with a KNOWN null; calibrates the
  # chi-bar-squared weights by Monte Carlo and confirms test size.
  gmm_wolak_size_power:
    n_sims: 300              # Replications per size/power cell
    T: 500                   # Synthetic moment-panel length
    m: 12                    # Moment dimension after clustering (10-20 portfolios)
    phi: 0.3                 # AR(1) serial dependence (exercises the HAC)
    innov_scale: 1.0         # Innovation std of the moment panel
    alpha_levels: [0.01, 0.05, 0.10]
    power_deltas: [0.05, 0.1, 0.2, 0.4]   # Mean-deviation grid for the power map
    power_alpha: 0.05
    n_mc: 2000               # Monte-Carlo draws for the chi-bar-squared weights
    seed: 42
  # Paper 3: kappa identity-form audit (D^2 vs 1/2 kappa^2 D^2 vs 1/2 kappa_i kappa_j D^2).
  kappa_audit:
    n_assets: 30
    resolution: 12           # grid = resolution^d cells on [0,1]^d
    d: 2
    n_clusters: 4
    lengthscale: 0.2         # coloured-kernel length-scale
    kappa_base: 1.0
    kappa_spread: 0.3        # heterogeneous-kappa dispersion
    kernels: [white, exponential, matern32]
    seed: 42

