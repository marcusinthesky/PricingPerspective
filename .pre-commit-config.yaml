default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: environment-pins
        name: Shared environment pins
        language: system
        entry: just nix::parity
        pass_filenames: false
        files: ^(devenv\.|infra/nix/|src/lean/lean-toolchain|src/python/pyproject\.toml)
      - id: python-lint
        name: Python lint
        language: system
        entry: just python::lint
        pass_filenames: false
        files: ^src/python/.*\.py$
      - id: python-format
        name: Python formatting
        language: system
        entry: just python::fmt-check
        pass_filenames: false
        files: ^src/python/.*\.py$
      - id: python-types
        name: Python types
        language: system
        entry: just python::typecheck
        pass_filenames: false
        files: ^src/python/.*\.(py|toml)$
      - id: semantic-identities
        name: Semantic stage identities
        language: system
        entry: just semflow-check
        pass_filenames: false
        files: ^(dvc\.yaml|semflow\.toml|src/python/.*\.py|\.semflow/hashes/.*\.json)$
