claim_id = "thm:random-exposure-envelope"
assumptions = [
  "loading laws in P_2 of a separable real Hilbert space",
  "couplings carrying integrability of both second moments and the cross term",
  "a certified optimal transport plan, supplied rather than proved to exist"
]
disclosure = "Machine-checked for probability laws on a separable real Hilbert space under the stated integrability hypotheses and a supplied optimal-plan certificate. The certified plan attains the covariance ceiling."

