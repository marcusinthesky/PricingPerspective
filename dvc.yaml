      co-mention, industry/sector, and direct Ledoit-Wolf residual-covariance specifications under the
      primary factor-conditioned held-out score. Also emit a deterministic descriptive W2 peer-interpretation
      panel. This stage does not perform portfolio optimisation or risk forecasting.
    cmd: ${py_pipeline} paper5-economic-value --returns-dir ${shared}/returns --oos-returns-dir ${shared}/oos/returns
      --w1-barycentre-dir ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.wasserstein_w1_arm_id}
      --w2-barycentre-dir ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
      --distance-artifact-dir ${shared}/typed_distances/${paper5.provider_id}/${paper5.representation_id}/${paper5.distance_id}
      --embeddings-dir ${shared}/embeddings/${paper5.provider_id} --co-mentions-adjacency ${shared}/co_mentions/adjacency.parquet
      --universe-csv data/universe.csv --params-file params.yaml --output-dir ${p5}/economic_value --n-bootstrap
      ${paper5.economic_value.n_bootstrap} --block-length ${paper5.economic_value.block_length} --seed
      ${paper5.economic_value.seed} --calibration-start ${paper5.economic_value.calibration_start} --calibration-end
      ${paper5.economic_value.calibration_end} --inner-training-end ${paper5.economic_value.inner_training_end}
      --inner-validation-start ${paper5.economic_value.inner_validation_start} --evaluation-start ${paper5.economic_value.evaluation_start}
      --evaluation-end ${paper5.economic_value.evaluation_end} --confidence-level ${paper5.economic_value.confidence_level}
      --factor-model ${paper5.economic_value.factor_model} --provider-id ${paper5.provider_id} --representation-id
      ${paper5.representation_id} --w1-barycentre-arm-id ${paper5.wasserstein_w1_arm_id} --w2-barycentre-arm-id
      ${paper5.barycentre_arm_id} --w1-geometry-id wasserstein_w1 --w2-geometry-id ${paper5.distance_id}
      --rbf-multipliers ${paper5.economic_value.rbf_multipliers} --active-weight-tolerance ${paper5.economic_value.active_weight_tolerance}
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper5-economic-value.json
    - ${shared}/returns
    - ${shared}/oos/returns
    - ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.wasserstein_w1_arm_id}
    - ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
    - ${shared}/typed_distances/${paper5.provider_id}/${paper5.representation_id}/${paper5.distance_id}
    - ${shared}/embeddings/${paper5.provider_id}
    - ${shared}/co_mentions/adjacency.parquet
    - data/universe.csv
    - data/raw/fama_french/2026-09-02/F-F_Research_Data_5_Factors_2x3_daily_CSV.zip
    - data/raw/fama_french/2026-09-02/F-F_Momentum_Factor_daily_CSV.zip
    params:
    - paper5.factor_data
    - paper5.provider_id
    - paper5.representation_id
    - paper5.distance_id
    - paper5.barycentre_arm_id
    - paper5.wasserstein_w1_arm_id
    - paper5.economic_value
    outs:
    - ${p5}/economic_value/results.json
    - ${p5}/economic_value/model_rows.parquet
    - ${p5}/economic_value/peer_rows.parquet
    - ${p5}/economic_value/bootstrap_draws.parquet
