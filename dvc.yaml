      --output-dir ${p5}/peer_definitions --targets ${paper5.peer_definitions.targets} --top-k ${paper5.peer_definitions.top_k}
      --provider-id ${paper5.provider_id} --representation-id ${paper5.representation_id} --w1-barycentre-arm-id
