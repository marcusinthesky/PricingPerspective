# NEW 2026-08-23 (t13). The four bridges that give the paper its spatial spine:
# adjustment-cost closure, two-marginal nesting, aggregate carrier transfer, and
# dispersion attenuation under the normalized spatial multiplier.
[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:adjustment-equilibrium"
assumptions = [
  "nonnegative adjustment intensity",
  "row-stochastic interaction matrix"
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace by a completing-square identity rather than a differentiability argument, so the equivalence holds in any real inner-product exposure space."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:spatial-closure"
assumptions = [
  "nonnegative adjustment intensity",
  "row-stochastic interaction matrix"
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace. The spatial equation is derived from the stated adjustment problem; it is not imposed as a reduced form, and the interaction weights themselves are a maintained input."

# NEW 2026-08-23 (t33). The two-field extension: a convex mixture of admissible
