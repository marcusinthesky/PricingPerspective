typed_barycentre_specs:
  energy_simplex: {arm_id: energy_simplex, geometry_id: energy_v}
  linear_mmd_simplex: {arm_id: linear_mmd_simplex, geometry_id: linear_mmd}
  rbf_mmd_simplex: {arm_id: rbf_mmd_simplex, geometry_id: rbf_mmd}

# Paper 5's W1/W2 cells are target projections rather than the separate
# source-measure cells below: each output has one leave-one-out weight row per
# governed firm and is consumed by the Paper 5 spatial-weight stage.
typed_wasserstein_barycentre_specs:
  wasserstein_w1_loo: {arm_id: wasserstein_w1_loo, geometry_id: wasserstein_w1}
  wasserstein_w2_loo: {arm_id: wasserstein_w2_loo, geometry_id: wasserstein_w2}

# A separate family from `typed_barycentre_specs` because the two DVC stages
# differ in their dependency set, not merely in their arms: a target projection
# reads a cached mean-ground-distance or kernel-mean component, while a source
# measure barycentre reads the clouds directly. Wasserstein geometries have no
# component artifact at all, so reusing the projection stage would declare a
# dependency on a path nothing produces.
typed_measure_barycentre_specs:
  wasserstein_w1_measure: {arm_id: wasserstein_w1_measure, geometry_id: wasserstein_w1}
  wasserstein_w2_measure: {arm_id: wasserstein_w2_measure, geometry_id: wasserstein_w2}
  wasserstein_w2_free_support: {arm_id: wasserstein_w2_free_support, geometry_id: wasserstein_w2}

# These fields intentionally document a future Paper 3 CLI cutover and are not
# runtime sources of truth until that task wires them into the stage.
parameter_classification:
  paper3.estimators: planned
  paper3.sub_periods: planned
