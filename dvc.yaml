    - paper5.qmle.block_length
    - paper5.qmle.seed
    - paper5.provider_id
    - paper5.representation_id
    - paper5.distance_id
    - paper5.barycentre_arm_id
    outs:
    - ${p5}/post_corpus_qmle/results.json
    - ${p5}/post_corpus_qmle/results.parquet

  p5_universe_horizon_bridge:
    desc: >-
      Reconcile the historical 52-firm long-window result with the governed
      6 April 2026 endpoint, then expand to the current 100-firm operator at
      that same endpoint. The sequential bridge estimates only observed
      specifications and treats both step contrasts as descriptive.
    cmd: >-
      ${py_pipeline} paper5-universe-horizon-bridge
      --returns-dir ${shared}/returns
      --current-oos-returns-dir ${shared}/oos/returns
      --current-barycentre-dir
