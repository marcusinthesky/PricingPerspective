  p5_universe_horizon_bridge:
    desc: Reconcile the historical 52-firm long-window result with the governed 6 April 2026 endpoint,
      then expand to the current 100-firm operator at that same endpoint. The sequential bridge estimates
      only observed specifications and treats both step contrasts as descriptive.
    cmd: ${py_pipeline} paper5-universe-horizon-bridge --returns-dir ${shared}/returns --current-oos-returns-dir
      ${shared}/oos/returns --current-barycentre-dir ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
      --current-results-json ${p5}/post_corpus_qmle/results.json --reference-oos-returns-dir ${p5}/inputs/reference_52/oos_returns
      --reference-barycentre-dir ${p5}/inputs/reference_52/w_flat --reference-results-json ${p5}/inputs/reference_52/qmle_results.json
      --output-dir ${p5}/universe_horizon_bridge --start ${paper5.universe_horizon_bridge.evaluation_start}
      --short-end ${paper5.universe_horizon_bridge.short_end} --long-end ${paper5.universe_horizon_bridge.long_end}
