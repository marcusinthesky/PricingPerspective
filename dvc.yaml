      - ablation_cells.${key}
      - paper5.qmle.n_bootstrap
      - paper5.qmle.block_length
      - paper5.qmle.seed
      outs:
      - ${p5}/representation_ablation/cells/${key}/results.json
      - ${p5}/representation_ablation/cells/${key}/results.parquet
      - ${p5}/representation_ablation/cells/${key}/bootstrap_draws.parquet
