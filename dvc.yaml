    - ${p5}/universe_horizon_bridge/results.json
    - ${p5}/universe_horizon_bridge/bootstrap_draws.parquet
  p5_representation_ablation_cells:
    foreach: ${ablation_cells}
    do:
      desc: Estimate pooled single-field QMLE for the barycentric interaction field and its RBF-Wasserstein
        comparator under one governed representation, with annual and fixed-network work omitted.
      cmd: ${py_pipeline} paper5-post-corpus-qmle --returns-dir ${shared}/returns --oos-returns-dir ${shared}/oos/returns
        --shared-barycentre-dir ${shared}/barycentres/${item.provider_id}/${item.representation_id}/wasserstein_w2_loo
        --distance-artifact ${shared}/typed_distances/${item.provider_id}/${item.representation_id}/wasserstein_w2
        --output-dir ${p5}/representation_ablation/cells/${key} --n-bootstrap ${paper5.qmle.n_bootstrap}
        --block-length ${paper5.qmle.block_length} --seed ${paper5.qmle.seed} --provider-id ${item.provider_id}
        --representation-id ${item.representation_id} --barycentre-arm-id wasserstein_w2_loo --geometry-id
        wasserstein_w2 --pooled-only --focal-matrices-only --output-bootstrap ${p5}/representation_ablation/cells/${key}/bootstrap_draws.parquet
