# Encoder-vintage staircase, deliberately NOT part of the locked seven-cell
# `representation_ablation_specs` base roster. Paper 1 appends these as a paired
# negative-control panel; Papers 3 and 5 append them as ordinary sensitivity
# rows. These three hold architecture,
# parameter count, optimizer, token budget, tokenizer, corpus sampler and seed
# fixed and vary only the Wikipedia snapshot date the encoder saw, so the
# informative quantity is the paired contrast BETWEEN them, not any single
# row's distance from canonical. V0 predates the sample, V1 closes before the
# evaluation window opens, V3 postdates the sample and the OOS period.
