    - data/universe.csv
    outs:
    - src/latex/projects/01_continuous_bounds/src/images/mds_sector_plot.pgf:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/images/mds_shepard_diagnostic.pgf:
        cache: false
  p1_numbers:
    desc: >-
      Generate only the LaTeX scalar bindings consumed by Paper 1 from the
      W2 dyadic, DISCO, sample, projection, and exploratory summaries.
      Split from p1_figures for cache isolation.
    cmd: >-
      ${py_pipeline} render-paper1-numbers
      --numbers-path src/latex/projects/01_continuous_bounds/src/generated/numbers.tex
      --dyadic-confound-summary ${p1}/dyadic_confound/summary.yaml
      --disco-summary ${p1}/disco/summary.yaml
      --sample-descriptives-summary ${p1}/sample_descriptives/summary.yaml
      --diagnostics-summary ${p1}/diagnostics/summary.yaml
      --dimensionality-csv ${shared}/dimensionality_analysis/${scientific_selectors.baseline_model}/dimensionality_analysis.csv
      --neighbour-outcome-split-summary ${p1}/neighbour_outcome_split/summary.json
      --covariance-matrix ${shared}/covariance_matrix.parquet
      --oos-covariance-matrix ${shared}/oos/covariance_matrix.parquet
