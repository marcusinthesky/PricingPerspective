params:
- params.yaml
metrics:
- data/papers/paper1/dyadic_confound/results.json
- data/papers/paper3/certificate_validation/results.json
- data/papers/paper5/post_corpus_qmle/results.json
vars:
- py_pipeline: uv run --locked --project src/python pipeline
- py_semflow: uv run --locked --project src/python semflow
- shared: data/shared
- p1: data/papers/paper1
- p3: data/papers/paper3
- p5: data/papers/paper5
- p6: data/papers/paper6
- p1_tex: src/latex/projects/01_continuous_bounds/src
- p3_tex: src/latex/projects/03_distance_implied_mpt/src
- p5_tex: src/latex/projects/05_spatial_pricing/src
- p6_tex: src/latex/projects/06_information_motion/src
stages:
  fixed_inputs:
    desc: Fixed, checksummed text-free numerical inputs. Restore with dvc pull; the frozen command fails
      closed if unfrozen.
    cmd: 'false'
    frozen: true
    outs:
    - data/papers/paper1/pretraining_embeddings
    - data/papers/paper1/tfidf_inputs
    - data/papers/paper5/inputs
    - data/papers/paper6/article_redraw_design.json
    - data/papers/paper6/corporate_inputs
    - data/papers/paper6/directional_design.json
    - data/papers/paper6/historical-evidence/t79
    - data/papers/paper6/inference_audit_design.json
    - data/papers/paper6/information_recovery
    - data/papers/paper6/review-artifacts
    - data/raw/fama_french
    - data/raw/hoberg_phillips
    - data/reference/published_values.json
    - data/shared/article_metadata
    - data/shared/co_mention_inputs
    - data/shared/corpus/summary.yaml
    - data/shared/embeddings
    - data/shared/input_manifest.json
    - data/shared/liquidity_proxy.json
    - data/shared/oos/returns
    - data/shared/returns
    - data/universe.csv
    - data/reference/published_results.json
  semflow_refresh:
    desc: Refresh semantic entrypoint fingerprints after source changes. This control-plane stage owns
      JSON only; semflow instrumentation of dvc.yaml remains an explicit human-reviewed patch.
    cmd: ${py_semflow} refresh --apply
    deps:
    - semflow.toml
    - src/python/pyproject.toml
    - src/python/uv.lock
    - src/python/apps/pipeline/src
    - src/python/apps/hotelling/src
    outs:
    - .semflow/hashes:
        cache: false
  co_mentions:
    desc: Aggregate the published exact-two-firm event metadata into the news comparator.
    cmd: ${py_pipeline} compute-co-mentions --events-file ${shared}/co_mention_inputs/events.parquet --universe-csv
      data/universe.csv --output-dir ${shared}/co_mentions --start-date ${start_date} --end-date ${end_date}
      --min-persistence-years ${co_mentions.min_persistence_years}
    deps:
    - src/python/apps/pipeline/src
    - src/python/apps/hotelling/src
    - src/python/packages/dotell/src
    - src/python/pyproject.toml
    - src/python/apps/pipeline/pyproject.toml
    - src/python/apps/hotelling/pyproject.toml
    - src/python/packages/dotell/pyproject.toml
    - src/python/uv.lock
    - ${shared}/co_mention_inputs/events.parquet
    - data/universe.csv
    params:
    - start_date
    - end_date
    - co_mentions.min_persistence_years
    outs:
    - ${shared}/co_mentions/events.parquet
    - ${shared}/co_mentions/pair_year.parquet
    - ${shared}/co_mentions/adjacency.parquet
    - ${shared}/co_mentions/summary.json
  embedding_coverage:
    matrix:
      embedding_model: ${baseline_embedding_models}
    desc: Validate one embedding file per configured ticker (currently 100/100), the model's configured
      row range, uniform dimensions, no NaN/zero vectors, and split-half energy-distance sanity check.
      Qwen3-Embedding-8B is frozen at its preregistered m=128 panel, while the shared source subsample
      remains n_samples=445.
    cmd: ${py_pipeline} validate-coverage --model-key ${item.embedding_model} --embeddings-dir ${shared}/embeddings/${item.embedding_model}
      --output-dir ${shared}/validation/${item.embedding_model} --params-file params.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/validate-coverage.json
    - ${shared}/embeddings/${item.embedding_model}
    - data/publication/certification/public_inputs.stamp
    params:
    - embedding.models
    - n_samples
    - symbols
    outs:
    - ${shared}/validation/${item.embedding_model}/summary.yaml
    - ${shared}/validation/${item.embedding_model}/coverage.csv
  typed_geometry_components:
    foreach: ${typed_geometry_component_specs}
    do:
      desc: Materialize one reusable raw mean-ground-distance component for an explicit provider/representation/geometry
        identity.
      cmd: ${py_pipeline} typed-geometry-component --provider-id ${item.provider_id} --representation-id
        ${item.representation_id} --geometry-id ${item.geometry_id} --output-dir ${shared}/typed_geometry_components/${item.provider_id}/${item.representation_id}/${item.geometry_id}
        --params-file params.yaml --embeddings-dir ${shared}/embeddings/${item.provider_id}
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-geometry-component.json
      - ${shared}/embeddings/${item.provider_id}
      - data/publication/certification/public_inputs.stamp
      params:
      - typed_geometry_component_specs.${key}
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.geometry_id}
      - market_symbols
      outs:
      - ${shared}/typed_geometry_components/${item.provider_id}/${item.representation_id}/${item.geometry_id}
  typed_distances_energy:
    desc: Derive the canonical energy-distance matrix from its cached mean-ground-distance component.
    cmd: ${py_pipeline} typed-distance --provider-id ${scientific_selectors.baseline_model} --representation-id
      ${scientific_selectors.typed_distance_representation} --distance-id energy_v --geometry-component-dir
      ${shared}/typed_geometry_components/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/energy_v
      --output-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/energy_v
      --params-file params.yaml
    deps:
    - .semflow/hashes/entrypoints/pipeline/typed-distance.json
    - ${shared}/typed_geometry_components/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/energy_v
    params:
    - typed_analysis.providers.${scientific_selectors.typed_distance_provider_key}
    - typed_analysis.representations.${scientific_selectors.typed_distance_representation_key}
    - typed_analysis.distances.euclidean_chord
    - typed_analysis.distances.energy_v
    - market_symbols
    outs:
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.typed_distance_representation}/energy_v
  typed_distances:
    foreach: ${typed_distance_specs}
    do:
      desc: Materialize one rooted Wasserstein distance matrix for a declared provider/representation/distance
        cell.
      cmd: ${py_pipeline} typed-distance --provider-id ${item.provider_id} --representation-id ${item.representation_id}
        --distance-id ${item.distance_id} --output-dir ${shared}/typed_distances/${item.provider_id}/${item.representation_id}/${item.distance_id}
        --params-file params.yaml --embeddings-dir ${shared}/embeddings/${item.provider_id}
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-distance.json
      - ${shared}/embeddings/${item.provider_id}
      - data/publication/certification/public_inputs.stamp
      params:
      - typed_distance_specs.${key}
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.distance_id}
      - market_symbols
      outs:
      - ${shared}/typed_distances/${item.provider_id}/${item.representation_id}/${item.distance_id}
  typed_distances_windowed:
    foreach: ${typed_distance_windowed_specs}
    do:
      desc: Materialize one window-scoped rooted W2 distance matrix; W2 has no reusable mean-ground-distance
        component.
      cmd: ${py_pipeline} typed-distance --provider-id ${item.provider_id} --representation-id ${item.representation_id}
        --distance-id ${item.distance_id} --output-dir ${shared}/typed_distances_windowed/${item.provider_id}/${item.representation_id}/${item.distance_id}
        --params-file params.yaml --embeddings-dir ${shared}/embeddings/${item.provider_id}
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-distance.json
      - ${shared}/embeddings/${item.provider_id}
      - data/publication/certification/public_inputs.stamp
      params:
      - typed_distance_windowed_specs.${key}
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.distance_id}
      - typed_analysis.windows.${item.window_key}
      - market_symbols
      outs:
      - ${shared}/typed_distances_windowed/${item.provider_id}/${item.representation_id}/${item.distance_id}
  barycentres:
    foreach: ${barycentre_specs}
    do:
      desc: 'Materialize one leave-one-out target projection: optimal target-to-candidate couplings are
        fixed first, then the candidate simplex is solved within that restriction.'
      cmd: ${py_pipeline} typed-barycentre --provider-id ${item.provider_id} --representation-id ${item.representation_id}
        --arm-id ${item.arm_id} --output-dir ${shared}/barycentres/${item.provider_id}/${item.representation_id}/${item.arm_id}
        --params-file params.yaml --embeddings-dir ${shared}/embeddings/${item.provider_id}
      deps:
      - .semflow/hashes/entrypoints/pipeline/typed-barycentre.json
      - ${shared}/embeddings/${item.provider_id}
      params:
      - barycentre_specs.${key}
      - typed_analysis.providers.${item.provider_key}
      - typed_analysis.representations.${item.representation_key}
      - typed_analysis.distances.euclidean_chord
      - typed_analysis.distances.${item.geometry_id}
      - typed_analysis.feasible_sets.simplex_nonnegative
      - typed_analysis.barycentres.${item.arm_id}
      - market_symbols
      outs:
      - ${shared}/barycentres/${item.provider_id}/${item.representation_id}/${item.arm_id}
  p1_pcoa:
    desc: Compute canonical metric MDS plus PCoA coordinates, complete signed spectra and projection fidelity
      for every published model/width and annual-vintage tuple, with in-sample return-covariance PCA on
      the identical priced firm roster.
    cmd: ${py_pipeline} paper1-pcoa --distance-root ${shared}/typed_distances --covariance-matrix ${shared}/covariance_matrix.parquet
      --universe-csv data/universe.csv --params-file params.yaml --output-dir ${p1}/pcoa
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-pcoa.json
    - ${shared}/typed_distances/${ablation_cells.qwen8b_full.provider_id}/${ablation_cells.qwen8b_full.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.qwen4b_full.provider_id}/${ablation_cells.qwen4b_full.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.qwen8b_1024.provider_id}/${ablation_cells.qwen8b_1024.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.qwen4b_1024.provider_id}/${ablation_cells.qwen4b_1024.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.bge_large_full.provider_id}/${ablation_cells.bge_large_full.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.qwen8b_256.provider_id}/${ablation_cells.qwen8b_256.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.qwen8b_64.provider_id}/${ablation_cells.qwen8b_64.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.chronobert_2017.provider_id}/${ablation_cells.chronobert_2017.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.chronobert_2018.provider_id}/${ablation_cells.chronobert_2018.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.chronobert_2019.provider_id}/${ablation_cells.chronobert_2019.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.chronobert_2020.provider_id}/${ablation_cells.chronobert_2020.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.chronobert_2021.provider_id}/${ablation_cells.chronobert_2021.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.chronobert_2022.provider_id}/${ablation_cells.chronobert_2022.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.chronobert_2023.provider_id}/${ablation_cells.chronobert_2023.representation_id}/wasserstein_w2
    - ${shared}/typed_distances/${ablation_cells.chronobert_2024.provider_id}/${ablation_cells.chronobert_2024.representation_id}/wasserstein_w2
    - ${shared}/covariance_matrix.parquet
    - data/universe.csv
    params:
    - representation_ablation_specs
    - encoder_vintage_ablation_specs
    - paper1.mds
    outs:
    - ${p1}/pcoa/results.json
    - ${p1}/pcoa/coords_2d.parquet
    - ${p1}/pcoa/spectrum.parquet
    - ${p1}/pcoa/neighbours.parquet
    - ${p1}/pcoa/metric_mds_coords_2d.parquet
    - ${p1}/pcoa/metric_mds_neighbours.parquet
  compute_covariance:
    matrix:
      window: ${return_panels}
    desc: 'Variance-covariance matrix from every ticker return series of one evaluation window. Cells
      are named by matrix axis index: window0 is the in-sample 2018-22 panel and window1 the out-of-sample
      2023-26 panel (params.yaml:return_panels, whose order is load-bearing). Both windows run on the
      same configured market-symbol panel, so there is no differential roster attrition between the windows
      and the out-of-sample Mantel run uses an identical firm set. The complete-case contract carried
      per window in the roster is a hard guard, not a nominal default.'
    cmd: ${py_pipeline} compute-covariance --returns-dir ${item.window.root}/returns --output-file ${item.window.root}/covariance_matrix.parquet
      --min-observations ${item.window.min_observations} --expected-tickers ${item.window.expected_tickers}
      --expected-observations ${item.window.expected_observations} --expected-start-date ${item.window.expected_start_date}
      --expected-end-date ${item.window.expected_end_date}
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-covariance.json
    - ${item.window.root}/returns
    outs:
    - ${item.window.root}/covariance_matrix.parquet
  sample_descriptives:
    desc: 'Sample descriptives for the Paper 5 estimation panel: per-sector firm counts, article counts,
      daily simple-return volatility, and mean within- vs cross-sector rooted W2 distance under Paper
      5''s frozen encoder. Shares Paper 1''s tabulation; the encoder identity is asserted, not assumed.'
    cmd: ${py_pipeline} compute-sample-descriptives --universe-csv data/universe.csv --embeddings-dir
      ${shared}/embeddings/${scientific_selectors.baseline_model} --returns-dir ${shared}/returns --distance-artifact-dir
      ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${scientific_selectors.typed_distance_id}
      --provider-id ${scientific_selectors.typed_distance_provider} --representation-id ${scientific_selectors.typed_distance_representation}
      --distance-id ${scientific_selectors.typed_distance_id} --output-file ${shared}/sample_descriptives/results.json
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-sample-descriptives.json
    - data/universe.csv
    - ${shared}/embeddings/${scientific_selectors.baseline_model}
    - ${shared}/returns
    - ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${scientific_selectors.typed_distance_id}
    - ${shared}/validation/${scientific_selectors.baseline_model}/summary.yaml
    outs:
    - ${shared}/sample_descriptives/results.json
  p1_sample_descriptives_render:
    desc: Render the shared canonical sample descriptives for Paper 1.
    cmd: ${py_pipeline} render-paper1-sample-descriptives --results-file ${shared}/sample_descriptives/results.json
      --output-file ${p1_tex}/generated/sample_descriptives.tex
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-sample-descriptives.json
    - ${shared}/sample_descriptives/results.json
    outs:
    - ${p1_tex}/generated/sample_descriptives.tex:
        cache: false
  p1_etnic_alignment:
    desc: 'External validation and ETNIC control input: permutation-tested correlations between the canonical
      W2 distance matrix and ETNIC-All doc2vec distance (Pearson, Spearman, per year), descriptive sector-partial
      correlation, and firm-bootstrap ETNIC-3 link classification by W2. Restricted to W2: Paper 1''s
      retired comparator geometries stay off its publication DAG.'
    cmd: ${py_pipeline} paper1-etnic-alignment --extract data/raw/hoberg_phillips/etnic_extract.parquet
      --crosswalk data/raw/hoberg_phillips/gvkey_crosswalk.csv --universe-csv data/universe.csv --distance-root
      ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit
      --geometry ${paper1.etnic_alignment.primary_geometry} --primary-geometry ${paper1.etnic_alignment.primary_geometry}
      --permutations ${paper1.etnic_alignment.permutations} --bootstrap-draws ${paper1.etnic_alignment.bootstrap_draws}
      --seed ${paper1.etnic_alignment.seed} --output-summary ${p1}/etnic_alignment/results.json --output-pairs
      ${p1}/etnic_alignment/pairs.parquet
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-etnic-alignment.json
    - data/raw/hoberg_phillips/etnic_extract.parquet
    - data/raw/hoberg_phillips/gvkey_crosswalk.csv
    - data/universe.csv
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
    params:
    - paper1.etnic_alignment
    outs:
    - ${p1}/etnic_alignment/results.json
    - ${p1}/etnic_alignment/pairs.parquet
  p1_dyadic_confound:
    desc: Paper 1 fixed-W2 random-exposure envelope diagnostic, contiguous W2 specification ladder, canonical
      symmetric-firm-effect slope, and one energy comparison row, plus sector, industry, and Hoberg-Phillips
      ETNIC-roster classification controls in the firm-effects design. Full-panel inference uses the common
      multinomial node-bootstrap schedule; restricted-roster rows resample their own incident firms.
    cmd: ${py_pipeline} paper1-dyadic-confound --distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
      --energy-comparator-artifact-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/energy_v
      --covariance-matrix ${shared}/covariance_matrix.parquet --universe-csv data/universe.csv --liquidity-proxy-file
      ${shared}/liquidity_proxy.json --returns-dir ${shared}/returns --embeddings-dir ${shared}/embeddings/${scientific_selectors.baseline_model}
      --etnic-alignment-dir ${p1}/etnic_alignment --output-file ${p1}/dyadic_confound/results.json
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-dyadic-confound.json
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/energy_v
    - ${shared}/covariance_matrix.parquet
    - data/universe.csv
    - ${shared}/liquidity_proxy.json
    - ${shared}/returns
    - ${shared}/embeddings/${scientific_selectors.baseline_model}
    - ${p1}/etnic_alignment/pairs.parquet
    - ${p1}/etnic_alignment/results.json
    outs:
    - ${p1}/dyadic_confound/results.json
    - ${p1}/dyadic_confound/node_bootstrap_counts.parquet
    - ${p1}/dyadic_confound/bootstrap_draws.parquet
    - ${p1}/dyadic_confound/design_diagnostics.parquet
    - ${p1}/dyadic_confound/w2_primary_fit.parquet
    - ${p1}/dyadic_confound/leave_one_firm_out.parquet
    - ${p1}/dyadic_confound/residual_scale_null.parquet
    - ${p1}/dyadic_confound/random_exposure_diagnostic.parquet
  p1_dyadic_oos:
    desc: 'Out-of-sample primary W2 dyadic association (t37). The text-side matrix is held FIXED at its
      2018-22 in-sample estimate (the news archive ends 2023-01-02, so every article predates the evaluation
      window by construction) and only the return chord distance is recomputed, from the 2023-2026 out-of-sample
      correlation matrix; intercept and symmetric additive firm effects are re-estimated on the surviving
      panel. This is the look-ahead-free counterpart to the manuscript''s primary specification, under
      the same zero-coefficient estimand. The primary text metric is the frozen Qwen3-Embedding 8B W2
      matrix. Lead encoder only, deliberately not matrixed over the embedding roster: a sweep would open
      a model-selection channel on the only look-ahead-free evidence in the paper. Inference convention
      is fixed in advance by the in-sample design (1,999 multinomial node-bootstrap draws, seed 42, 2.5/97.5
      percentile interval); a null result ships unchanged.'
    cmd: ${py_pipeline} paper1-dyadic-oos --distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
      --covariance-matrix ${shared}/oos/covariance_matrix.parquet --output-file ${p1}/dyadic_oos/results.json
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-dyadic-oos.json
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
    - ${shared}/oos/covariance_matrix.parquet
    outs:
    - ${p1}/dyadic_oos/results.json
    - ${p1}/dyadic_oos/bootstrap_draws.parquet
    - ${p1}/dyadic_oos/node_bootstrap_counts.parquet
  p1_dyadic_confound_render:
    desc: Render saved dyadic estimates and their diagnostics.
    cmd: ${py_pipeline} render-paper1-dyadic-confound --dyadic-results-file ${p1}/dyadic_confound/results.json
      --oos-dyadic-results-file ${p1}/dyadic_oos/results.json --design-diagnostics-file ${p1}/dyadic_confound/design_diagnostics.parquet
      --output-dir ${p1_tex}/generated
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-dyadic-confound.json
    - ${p1}/dyadic_confound/results.json
    - ${p1}/dyadic_oos/results.json
    - ${p1}/dyadic_confound/design_diagnostics.parquet
    outs:
    - ${p1_tex}/generated/w2_primary_results.tex:
        cache: false
    - ${p1_tex}/generated/dyadic_ladder.tex:
        cache: false
    - ${p1_tex}/generated/classification_controls.tex:
        cache: false
    - ${p1_tex}/generated/dyadic_design_diagnostics.tex:
        cache: false
    - ${p1_tex}/generated/random_exposure_diagnostic.tex:
        cache: false
  p1_sample_universe_render:
    desc: Render Paper 1's canonical priced W2 ticker, name, and sector roster as a generated appendix
      longtable.
    cmd: ${py_pipeline} render-sample-universe-table --universe-csv data/universe.csv --returns-dir ${shared}/returns
      --distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
      --provider-id ${scientific_selectors.baseline_model} --representation-id ${scientific_selectors.baseline_model}-unit
      --distance-id wasserstein_w2 --output-file ${p1_tex}/generated/sample_universe.tex
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-sample-universe-table.json
    - data/universe.csv
    - ${shared}/returns
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
    outs:
    - ${p1_tex}/generated/sample_universe.tex:
        cache: false
  p1_diagnostics:
    desc: Compute Matryoshka distance preservation for the registered W2 matrices.
    cmd: ${py_pipeline} paper1-diagnostics --full-distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
      --distance-artifact-64-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-64-unit/wasserstein_w2
      --distance-artifact-256-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-256-unit/wasserstein_w2
      --provider-id ${scientific_selectors.baseline_model} --representation-id ${scientific_selectors.baseline_model}-unit
      --representation-64-id ${scientific_selectors.baseline_model}-64-unit --representation-256-id ${scientific_selectors.baseline_model}-256-unit
      --distance-id wasserstein_w2 --output-file ${p1}/diagnostics/results.json --output-preservation-file
      ${p1}/diagnostics/preservation.parquet
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-diagnostics.json
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-64-unit/wasserstein_w2
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-256-unit/wasserstein_w2
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-unit/wasserstein_w2
    outs:
    - ${p1}/diagnostics/results.json
    - ${p1}/diagnostics/preservation.parquet
  p1_diagnostics_render:
    desc: Render saved W2 preservation and post-fit diagnostics.
    cmd: ${py_pipeline} render-paper1-diagnostics --results-file ${p1}/diagnostics/results.json --preservation-file
      ${p1}/diagnostics/preservation.parquet --dyadic-summary-file ${p1}/dyadic_confound/results.json
      --w2-primary-fit-file ${p1}/dyadic_confound/w2_primary_fit.parquet --lofo-file ${p1}/dyadic_confound/leave_one_firm_out.parquet
      --output-dir ${p1_tex}/images
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-diagnostics.json
    - ${p1}/diagnostics/results.json
    - ${p1}/diagnostics/preservation.parquet
    - ${p1}/dyadic_confound/results.json
    - ${p1}/dyadic_confound/w2_primary_fit.parquet
    - ${p1}/dyadic_confound/leave_one_firm_out.parquet
    outs:
    - ${p1_tex}/images/matryoshka_distance_preservation.pgf:
        cache: false
    - ${p1_tex}/images/dyadic_postfit_diagnostics.pgf:
        cache: false
  p1_w2_permanova:
    desc: One-way sector PERMANOVA on the original rooted-W2 matrix for the full priced cohort, with squared-distance
      dispersion, whole-firm permutations, the fixed-size null R-squared reference and a separate residual-permutation
      spread diagnostic excluding singleton sectors. This post-hoc diagnostic does not replace the sector-adjusted
      dyadic return-distance analysis.
    cmd: ${py_pipeline} paper1-w2-permanova --distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/wasserstein_w2
      --provider-id ${scientific_selectors.typed_distance_provider} --representation-id ${scientific_selectors.typed_distance_representation}
      --covariance-matrix ${shared}/covariance_matrix.parquet --universe-csv data/universe.csv --output-dir
      ${p1}/w2_permanova --sample-size ${typed_analysis.distances.wasserstein_w2.sample_size} --n-permutations
      ${paper1.w2_permanova.n_permutations} --random-state ${paper1.w2_permanova.random_state}
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-w2-permanova.json
    - ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/wasserstein_w2
    - ${shared}/covariance_matrix.parquet
    - data/universe.csv
    outs:
    - ${p1}/w2_permanova/results.json
    - ${p1}/w2_permanova/permutation_audit.npz
  p1_w2_permanova_render:
    desc: Render saved sector-dispersion results.
    cmd: ${py_pipeline} render-paper1-w2-permanova --results-file ${p1}/w2_permanova/results.json --output-dir
      ${p1_tex}/generated
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-w2-permanova.json
    - ${p1}/w2_permanova/results.json
    - ${p1}/w2_permanova/permutation_audit.npz
    outs:
    - ${p1_tex}/generated/w2_permanova.tex:
        cache: false
  p1_wasserstein_comparator:
    desc: Paper 1's cross-encoder distributional comparison and inference diagnostics. It consumes the
      shared, typed Wasserstein-W1 artifacts for the common m=128 panel, recomputes matched V-energy and
      signed-U diagnostics on deterministic url-hash prefixes, and writes the paired metric panel used
      by Paper 1 tables and headline numbers. It also evaluates the Qwen3-Embedding-8B m=32/64/128 sensitivity
      curve. Unused summary-only bootstrap and same-firm noise-floor calculations are retired. This stage
      compares validated distances; it is not the shared Wasserstein-distance producer.
    cmd: ${py_pipeline} paper1-wasserstein-comparator --embeddings-root ${shared}/embeddings --typed-distance-root
      ${shared}/typed_distances --covariance-matrix ${shared}/covariance_matrix.parquet --output-pairs
      ${p1}/wasserstein_comparator/pairs.parquet
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-wasserstein-comparator.json
    - ${shared}/embeddings/qwen3-embedding-4b
    - ${shared}/embeddings/qwen3-embedding-8b
    - ${shared}/embeddings/bge-m3
    - ${shared}/embeddings/bge-large-en-v1.5
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-unit/wasserstein_w1
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w1
    - ${shared}/typed_distances/bge-m3/bge-m3-unit/wasserstein_w1
    - ${shared}/typed_distances/bge-large-en-v1.5/bge-large-en-v1.5-unit/wasserstein_w1
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2
    - ${shared}/typed_distances/bge-m3/bge-m3-unit/wasserstein_w2
    - ${shared}/typed_distances/bge-large-en-v1.5/bge-large-en-v1.5-unit/wasserstein_w2
    - ${shared}/covariance_matrix.parquet
    outs:
    - ${p1}/wasserstein_comparator/pairs.parquet
  p1_representation_sensitivity:
    desc: Compare the seven governed encoder/dimension cells, article-count, and statistical-distance
      choices under Paper 1's canonical symmetric-firm-effect estimator. Every row reuses the same 1,999-draw
      node schedule and reports rank agreement with canonical W2, a standardized association interval,
      and partial R-squared.
    cmd: ${py_pipeline} paper1-representation-sensitivity --pairs-file ${p1}/wasserstein_comparator/pairs.parquet
      --node-counts-file ${p1}/dyadic_confound/node_bootstrap_counts.parquet --representation-dir ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-1024-unit/wasserstein_w2
      --representation-dir ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-1024-unit/wasserstein_w2
      --representation-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-256-unit/wasserstein_w2
      --representation-dir ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-64-unit/wasserstein_w2
      --vintage-dir ${shared}/typed_distances/chronobert-2017/chronobert-2017-unit/wasserstein_w2 --vintage-dir
      ${shared}/typed_distances/chronobert-2018/chronobert-2018-unit/wasserstein_w2 --vintage-dir ${shared}/typed_distances/chronobert-2019/chronobert-2019-unit/wasserstein_w2
      --vintage-dir ${shared}/typed_distances/chronobert-2020/chronobert-2020-unit/wasserstein_w2 --vintage-dir
      ${shared}/typed_distances/chronobert-2021/chronobert-2021-unit/wasserstein_w2 --vintage-dir ${shared}/typed_distances/chronobert-2022/chronobert-2022-unit/wasserstein_w2
      --vintage-dir ${shared}/typed_distances/chronobert-2023/chronobert-2023-unit/wasserstein_w2 --vintage-dir
      ${shared}/typed_distances/chronobert-2024/chronobert-2024-unit/wasserstein_w2 --vintage-equivalence-bound
      ${encoder_vintage_analysis.effect_one_sd_equivalence_bound} --vintage-confidence-level ${encoder_vintage_analysis.confidence_level}
      --params-file params.yaml --output-summary ${p1}/representation_sensitivity/results.json --output-draws
      ${p1}/representation_sensitivity/bootstrap_draws.parquet
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-representation-sensitivity.json
    - ${p1}/wasserstein_comparator/pairs.parquet
    - ${p1}/dyadic_confound/node_bootstrap_counts.parquet
    - ${shared}/typed_distances/qwen3-embedding-8b/qwen3-embedding-8b-1024-unit/wasserstein_w2
    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-1024-unit/wasserstein_w2
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-256-unit/wasserstein_w2
    - ${shared}/typed_distances/${scientific_selectors.baseline_model}/${scientific_selectors.baseline_model}-64-unit/wasserstein_w2
    - ${shared}/typed_distances/chronobert-2017/chronobert-2017-unit/wasserstein_w2
    - ${shared}/typed_distances/chronobert-2018/chronobert-2018-unit/wasserstein_w2
    - ${shared}/typed_distances/chronobert-2019/chronobert-2019-unit/wasserstein_w2
    - ${shared}/typed_distances/chronobert-2020/chronobert-2020-unit/wasserstein_w2
    - ${shared}/typed_distances/chronobert-2021/chronobert-2021-unit/wasserstein_w2
    - ${shared}/typed_distances/chronobert-2022/chronobert-2022-unit/wasserstein_w2
    - ${shared}/typed_distances/chronobert-2023/chronobert-2023-unit/wasserstein_w2
    - ${shared}/typed_distances/chronobert-2024/chronobert-2024-unit/wasserstein_w2
    params:
    - representation_ablation_specs
    - encoder_vintage_ablation_specs
    - encoder_vintage_analysis
    - representation_contrast_specs
    outs:
    - ${p1}/representation_sensitivity/results.json
    - ${p1}/representation_sensitivity/bootstrap_draws.parquet
  p1_tfidf_controls:
    desc: Separate sklearn TF-IDF fits capped at Qwen8B width; author review only.
    cmd: ${py_pipeline} paper1-tfidf-controls --numeric-inputs ${p1}/tfidf_inputs --params-file params.yaml
