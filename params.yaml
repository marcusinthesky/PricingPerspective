    representation_key: ettax-v3-unit
    representation_id: ettax-v3-unit
    label: EttaX V3
    effective_dimension: 320
    native_dimension: 320
    display_order: 3
    contrast_role: encoder_vintage
    canonical: false

# Paper 1 negative-control decision rule. The 0.012 bound is calibrated to the
# already-computed Qwen3-8B-vs-BGE-large paired interval (approximately
# [-0.012, 0.008]), before reading the EttaX W2 effects. It is about 17% of the
# canonical 0.070 standardized effect. Equivalence is declared only when the
# entire paired interval is inside this symmetric bound; a non-significant
# contrast alone is insufficient.
encoder_vintage_analysis:
  effect_one_sd_equivalence_bound: 0.012
  confidence_level: 0.95
