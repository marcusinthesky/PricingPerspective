# Lean claim manifest — human-authored mapping input.
#
# POPULATED 2026-07-23 after explicit author review/approval of the candidate
# claim<->declaration semantic matches (see the session review sheet). extract.py
# re-verifies each declaration builds sorry-free with only the allowlisted axioms
# {propext, Classical.choice, Quot.sound}; build_result/axioms are NOT authored here.
#
# `disclosure` is the ONLY field surfaced in a manuscript (via \ppvalue) and MUST
# stay free of Lean identifiers. Declaration names live in `declaration` and reach
# only the blueprint. To add a claim, copy an entry, keep the disclosure identifier-free,
# and re-run extract.py (a nonzero exit means it did not validate).

