# windows at the actual rebalance dates, and adds the shrinkage-adjusted
# returns view. Consumed by the `backtest_feasibility` DVC stage
# (pipeline backtest-feasibility). Single source of truth for the T-grid,
# window-types and thresholds; see
# .context/plan/infra-tooling/tasks/t17-canonical-backtest-overlay/ and the
# 2026-07-18 decision brief (D2 returns floor 252/504, D3 news ~756/pooling).
backtest_feasibility:
  window_types: [rolling, expanding]        # trailing fixed-width + anchored-expanding
  windows: [63, 126, 252, 504, 756, 1260]   # estimation-window lengths T (trading days)
  n_assets_nominal: 100                      # brief N; the return panel realizes all 100 (no exclusions)
  returns_conditioning_multiples:            # covariance-conditioning thresholds on T
    singularity: 1                           # T > N (rank sufficiency)
