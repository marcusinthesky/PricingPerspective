      kind: statistical
      family: wasserstein
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: balanced_wasserstein_2
      normalization: rooted
      sample_design: full_sample
      sample_size: 128
    # Point-in-time energy geometries. Identical functional to energy_v above --
    # same ground distance, exponent, and V-estimator -- differing only in which
    # observations are averaged. They are separate distance IDs because the
    # component artifact path is keyed by geometry ID, and an energy component
    # is NOT reducible across date subsets: A_ij is a mean over the cross
    # product of two clouds, so restricting dates changes both the row set and
    # the normalizer. Each window therefore earns its own cached cell.
    #
    # Retained for Paper 1; p1_neighbour_outcome_split consumes the 2020 cell,
    # which is its preregistered
    # 2018-2020 selection window -- the same window object, not a copy of it).
    energy_v_pit_2018:
      distance_id: energy_v_pit_2018
      kind: statistical
      family: energy
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      sample_design: point_in_time
      sample_window: pit-2018-12-31
    energy_v_pit_2019:
      distance_id: energy_v_pit_2019
      kind: statistical
      family: energy
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      sample_design: point_in_time
      sample_window: pit-2019-12-31
    energy_v_pit_2020:
      distance_id: energy_v_pit_2020
      kind: statistical
      family: energy
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      sample_design: point_in_time
      sample_window: pit-2020-12-31
    energy_v_pit_2021:
      distance_id: energy_v_pit_2021
      kind: statistical
      family: energy
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      sample_design: point_in_time
      sample_window: pit-2021-12-31
    energy_v_pit_2022:
      distance_id: energy_v_pit_2022
      kind: statistical
      family: energy
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      sample_design: point_in_time
      sample_window: pit-2022-12-31
    # Rooted quadratic Wasserstein distances for Paper 3. These are distinct
    # typed artifacts from the energy components above: balanced W2 cannot be
    # reconstructed from a reusable mean-ground-distance component.
    #
    # `sample_size` is not a free tuning knob. `balanced_wasserstein_2` requires
    # equal-size point clouds, so each value is the largest draw EVERY firm can
    # supply inside that cutoff -- i.e. the roster minimum, rounded down. The
    # retired 6/19/32/64/128 were exactly the 52-firm minima (6 and 19 matched
    # the binding firm outright; 32 and 64 were rounded down from 37 and 75).
    #
    # The 100-firm roster lowers three of them. The m=128 md5 sample allocates
    # rows in proportion to a firm's per-year article volume, so a firm whose
    # coverage is back-loaded cannot fill an early window: NCLH (1,639 pooled
    # articles, concentrated in the 2020+ cruise-line news cycle) supplies only
    # 4 rows by 2018-12-31 and 10 by 2019-12-31, and JBHT/ADI supply 56 by
    # 2021-12-31. 2020 is unchanged because the new minimum, 37, still clears
    # the existing 32; 2022 is the full panel.
    #
    # COST, RECORDED DELIBERATELY: the 2018 vintage now rests on 4 points per
    # firm in 4096 dimensions and 2019 on 10, down from 6 and 19, for all 100
    # firms rather than only the binding one. This weakens Paper 3's earliest
    # point-in-time vintages and is the accepted price of keeping every firm in
    # the PIT lanes.
    wasserstein_w2_pit_2018:
      distance_id: wasserstein_w2_pit_2018
      kind: statistical
      family: wasserstein
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: balanced_wasserstein_2
      normalization: rooted
      sample_design: point_in_time
      sample_window: pit-2018-12-31
      sample_size: 4    # 100-firm minimum; binding firm NCLH
    wasserstein_w2_pit_2019:
      distance_id: wasserstein_w2_pit_2019
      kind: statistical
      family: wasserstein
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: balanced_wasserstein_2
      normalization: rooted
      sample_design: point_in_time
      sample_window: pit-2019-12-31
      sample_size: 10   # 100-firm minimum; binding firm NCLH
    wasserstein_w2_pit_2020:
      distance_id: wasserstein_w2_pit_2020
      kind: statistical
      family: wasserstein
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: balanced_wasserstein_2
      normalization: rooted
      sample_design: point_in_time
      sample_window: pit-2020-12-31
      sample_size: 32   # unchanged: 100-firm minimum is 37, which still clears 32
    wasserstein_w2_pit_2021:
      distance_id: wasserstein_w2_pit_2021
      kind: statistical
      family: wasserstein
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: balanced_wasserstein_2
      normalization: rooted
      sample_design: point_in_time
      sample_window: pit-2021-12-31
      sample_size: 56   # 100-firm minimum; binding firms JBHT and ADI
    wasserstein_w2_pit_2022:
      distance_id: wasserstein_w2_pit_2022
      kind: statistical
      family: wasserstein
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: balanced_wasserstein_2
      normalization: rooted
      sample_design: point_in_time
      sample_window: pit-2022-12-31
      sample_size: 128
  # Inclusive observation-date windows. `start` is the corpus start date
  # (`start_date` above), so on the frozen 2018-2022 corpus it is numerically a
  # no-op and an as-of cutoff and a bounded range coincide -- which is why
  # Paper 1's preregistered 2018-2020 selection window and Paper 3's 2020
  # point-in-time vintage are one window here rather than two cells computing
  # the same matrix. It is declared rather than left open so the artifact states
  # its coverage instead of inheriting whatever the corpus happens to begin
  # with, and so extending the corpus backwards cannot silently move a vintage.
  #
  # Likewise pit-2022-12-31 is NOT folded into the full-sample energy_v even
  # though the two agree on today's corpus: a PIT vintage that drifts when the
  # corpus is extended forwards would not be a vintage.
  windows:
    pit-2018-12-31:
      window_id: pit-2018-12-31
      start: "2018-01-01"
      end: "2018-12-31"
    pit-2019-12-31:
      window_id: pit-2019-12-31
      start: "2018-01-01"
      end: "2019-12-31"
    pit-2020-12-31:
      window_id: pit-2020-12-31
      start: "2018-01-01"
      end: "2020-12-31"
    pit-2021-12-31:
      window_id: pit-2021-12-31
      start: "2018-01-01"
      end: "2021-12-31"
    pit-2022-12-31:
      window_id: pit-2022-12-31
      start: "2018-01-01"
      end: "2022-12-31"
  feasible_sets:
    simplex_nonnegative:
      feasible_set_id: simplex_nonnegative
      kind: simplex_nonnegative
    affine_signed:
      feasible_set_id: affine_signed
      kind: affine_signed
    free_signed:
      feasible_set_id: free_signed
      kind: free_signed
    prescribed_source_weights:
      feasible_set_id: prescribed_source_weights
      kind: prescribed_source_weights
      source_weights: [0.5, 0.5]
    # Three prescribed sources, for the free-support arm. A separate feasible
    # set rather than a longer weight vector on the one above: the registry
    # refuses more than two weights on an exact `wasserstein_ot` arm, so the
    # arity distinction has to be visible in the declaration.
    prescribed_source_weights_k3:
      feasible_set_id: prescribed_source_weights_k3
      kind: prescribed_source_weights
      source_weights: [0.3333333333333333, 0.3333333333333333, 0.3333333333333334]
  barycentres:
    energy_simplex:
      arm_id: &energy-simplex-arm energy_simplex
      problem: target_projection
      geometry: energy_v
      feasible_set: simplex_nonnegative
      solver: energy_qp
      target_policy: leave_one_out
      tol: 1.0e-8
      maxiter: 10000
    energy_affine_signed:
      arm_id: energy_affine_signed
      problem: target_projection
      geometry: energy_v
      feasible_set: affine_signed
      solver: energy_qp
      target_policy: leave_one_out
      tol: 1.0e-8
      maxiter: 10000
    energy_free_signed:
      arm_id: energy_free_signed
      problem: target_projection
      geometry: energy_v
      feasible_set: free_signed
      solver: energy_qp
      target_policy: leave_one_out
      tol: 1.0e-8
      maxiter: 10000
    linear_mmd_simplex:
      arm_id: &linear-mmd-simplex-arm linear_mmd_simplex
      problem: target_projection
      geometry: linear_mmd
      feasible_set: simplex_nonnegative
      solver: mmd_qp
      target_policy: leave_one_out
      tol: 1.0e-8
      maxiter: 10000
    rbf_mmd_simplex:
      arm_id: &rbf-mmd-simplex-arm rbf_mmd_simplex
      problem: target_projection
      geometry: rbf_mmd
      feasible_set: simplex_nonnegative
      solver: mmd_qp
      target_policy: leave_one_out
      tol: 1.0e-8
      maxiter: 10000
    # Paper 5's Wasserstein rows use a target-anchored empirical barycentre:
    # optimal target-to-candidate couplings are fixed first, then the
    # candidate simplex is solved exactly within that declared restriction.
    wasserstein_w1_loo:
      arm_id: wasserstein_w1_loo
      problem: target_projection
      geometry: wasserstein_w1
      feasible_set: simplex_nonnegative
      solver: wasserstein_w1_target
      target_policy: leave_one_out
      tol: 1.0e-8
      maxiter: 1000
    wasserstein_w2_loo:
      arm_id: wasserstein_w2_loo
      problem: target_projection
      geometry: wasserstein_w2
      feasible_set: simplex_nonnegative
      solver: wasserstein_w2_target
      target_policy: leave_one_out
      tol: 1.0e-8
      maxiter: 1000
    wasserstein_w1_measure:
      arm_id: wasserstein_w1_measure
      problem: source_barycentre
      geometry: wasserstein_w1
      feasible_set: prescribed_source_weights
      solver: wasserstein_ot
      target_policy: explicit
    wasserstein_w2_measure:
      arm_id: wasserstein_w2_measure
      problem: source_barycentre
      geometry: wasserstein_w2
      feasible_set: prescribed_source_weights
      solver: wasserstein_ot
      target_policy: explicit
    # K-source free-support W2 barycentre. Unlike the two arms above this one
    # is iterative and lands on a LOCAL optimum -- the free-support objective is
    # non-convex in the support -- so it declares a solver budget and its
    # `converged` flag certifies a fixed point, not global optimality.
    wasserstein_w2_free_support:
      arm_id: wasserstein_w2_free_support
      problem: source_barycentre
      geometry: wasserstein_w2
      feasible_set: prescribed_source_weights_k3
      solver: wasserstein_free_support
      target_policy: explicit
      tol: 1.0e-12
      maxiter: 128


