name: Lean (lake build)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lean/**'
      # The Lean toolchain is pinned by the flake (infra/nix/pkgs/lean-toolchain.nix),
      # so a flake bump can move the compiler without touching src/lean.
      - 'infra/nix/**'
      - '.github/workflows/lean.yml'

permissions:
  contents: read
  # The scope behind DELETE /repos/{o}/{r}/actions/caches, which the Save step's
  # `purge` calls. Without it the purge 403s, and cache-nix-action swallows purge
  # errors into a log line — the only symptom is superseded ~1 GB entries piling
  # up against the 10 GB per-repo budget.
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Stock ubuntu-latest ships ~14 GB free on /, which the Nix dev-env closure
      # (Lean toolchain + substituted deps) can crowd. Reclaim ~20 GB up front by
      # dropping preinstalled toolchains this job never uses. tool-cache stays so
      # actions/checkout & friends keep their cache; large-packages skips the slow
      # apt purge (android/dotnet/ghc/codeql/docker removal alone is plenty).
      - name: Free up runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: DeterminateSystems/nix-installer-action@main

      # Persist the built Nix store across runs. Replaces the sunset Determinate
      # magic-nix-cache (its GitHub Actions Cache backend was retired). Keyed on the
      # flake lock + every Nix file (the Lean toolchain manifest lives among them);
      # the store is GC'd under 2 GB before save so the tiny Lean closure stays well
      # inside GitHub's 10 GB per-repo cache budget.
      # `infra/nix/**/*.nix` rather than `infra/nix/flake.nix`: the flake is split
      # into one file per vendored derivation, so the Lean manifest lives outside
      # flake.nix and a file-scoped key would stop moving with it. `**` matches zero
      # or more segments, so infra/nix/flake.nix is still covered.
      #
      # SPLIT restore/save, not the combined `cache-nix-action@v7`: the combined
      # action saves from a post step declared `post-if: success()`, so the store
      # is discarded whenever this job goes red — which is precisely when a
      # `sorry` is being chased and the gate is being re-run. Harmless while the
      # job is green, load-bearing the moment it is not. Same split, same reason,
      # as ci-pipeline.yml.
      - name: Restore Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-lean-${{ runner.os }}-${{ hashFiles('infra/nix/flake.lock', 'infra/nix/**/*.nix') }}
          restore-prefixes-first-match: nix-lean-${{ runner.os }}-

      # `#lean` is the minimal Lean-only dev shell (infra/nix/shells/ci/lean.nix) — it
      # avoids realizing texlive/dbt/gcloud/py-spy, which would otherwise fill the disk.
      - run: nix develop ./infra/nix#lean --command bash -lc 'cd src/lean && lake exe cache get && lake build'

      # Straight after the step that realizes the shell — the two gates below add
      # no store paths, so this is as early as the store is complete, and saving
      # here means a red sorry/manifest gate no longer throws the closure away.
      # `!cancelled()` rather than `always()`: this job is `cancel-in-progress`,
      # so a superseded run should die at once instead of uploading a store its
      # replacement is already rebuilding.
      #
      # The 2 GB GC ceiling is the Lean closure's share of GitHub's 10 GB
      # per-repo budget, which this job shares with ci-pipeline.yml's `nix-prek-*`
      # entry; the purge then drops this ref's superseded `nix-lean-*` caches,
      # which otherwise accumulate one ~1 GB entry per flake bump. `purge` only
      # ever touches caches scoped to the current ref, and
      # `purge-primary-key: never` protects the entry being written.
      - name: Save Nix store
        if: ${{ !cancelled() }}
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.nix-cache.outputs.primary-key }}
          gc-max-store-size-linux: 2G
          purge: true
          purge-prefixes: nix-lean-${{ runner.os }}-
          purge-created: "0"
          purge-primary-key: never

      - name: Sorry/axiom inventory gate (vs sorry-allowlist.txt)
        run: bash src/lean/scripts/sorry_gate.sh

      # The semantic half of the gate above. sorry_gate.sh is textual, so it cannot see a
      # macro-expanded `sorry`, an axiom inherited through an import, or a weakened
      # statement. extract.py re-derives every manifest claim against the workspace just
      # built by the step above — `#check` for the statement, `#print axioms` for the trust
      # base — and exits nonzero on sorryAx or any axiom outside {propext, Classical.choice,
      # Quot.sound}. Without this it runs only through the DVC `lean_claims` stage on a
      # developer's machine, so a PR touching src/lean could land without it ever running.
      # Cheap here because the workspace is already warm: one `lake env lean` per claim.
      #
      # One pass, two verdicts. extract.py's exit code covers "a proof broke"; overwriting
      # the committed manifest and diffing covers "a statement moved without the manifest
      # being re-rendered" — a stale disclosure now shows up as a diff in statement_type,
      # which is the whole point of recording it. Fix for the second is
      # `just lean::claims-render` plus a re-read of the affected disclosures, not a retry.
      - name: Claim manifest axiom + statement gate (extract.py)
        run: |
          nix develop ./infra/nix#lean --command bash -lc '
            cd src/lean &&
            uv run tools/claim-manifest/extract.py -v \
              --out tools/claim-manifest/generated/manifest.json'
          git diff --exit-code -- src/lean/tools/claim-manifest/generated/manifest.json \
            || { echo "::error::committed manifest.json is stale — run 'just lean::claims-render' and re-review the affected disclosures"; exit 1; }
