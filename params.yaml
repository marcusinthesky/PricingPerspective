start_date: &in_sample_start_date "2018-01-01"
end_date: &in_sample_end_date "2022-12-31"
oos_start_date: &oos_start_date "2023-01-01"
# HOLX completed its take-private on 2026-04-07 and is the binding
# right-truncation for the complete-case 100-firm panel. The market download's
# end bound is exclusive, so this yields a last included trading day of
# 2026-04-06 and makes the cutoff declared rather than emergent.
oos_end_date: &oos_end_date "2026-04-07"
oos_last_date: &oos_last_date "2026-04-06"

# The two return-panel evaluation windows, single-sourced for every stage family
# that is parameterised by window (market_data, compute_returns,
# compute_covariance, mantel_tests).
#
# ORDER IS LOAD-BEARING. DVC names a matrix cell after the axis *index* when the
# axis value is a mapping, so entry 0 resolves to `@window0` (in-sample) and
# entry 1 to `@window1` (out-of-sample). Reordering this list silently reassigns
# every locked cell; `test_oos_mantel_dvc.py` pins the order.
#
# `root` mirrors the `shared` var in dvc.yaml, which params interpolation cannot
# reach; the same test pins the prefix.
#
# `expected_*` is a hard complete-case guard, not a nominal default:
# compute-covariance fails the stage when the realised panel disagrees.
return_panels:
- id: in_sample
  # ZS listed 2018-03-16 and remains the binding left-truncation for the
  # complete-case panel; every 2026 addition was already listed before 2018.
  root: data/shared
  fetch_start_date: *in_sample_start_date
  fetch_end_date: *in_sample_end_date
  expected_tickers: 100
  expected_observations: 1207
  expected_start_date: "2018-03-19"
  expected_end_date: "2022-12-30"
- id: oos
  # Panel composition: the full 100-firm universe (`symbols`); the projection to
  # `market_symbols` is the identity, so both windows run on an identical firm
  # set and there is no differential attrition between them. HOLX completed its
  # take-private on 2026-04-07 and is the binding right-truncation for the
  # complete-case panel; `oos_end_date` is set to that date (the market
  # download's end bound is exclusive) so the cutoff is declared rather than
  # emergent. The first raw bar of the window carries a null return by
  # construction.
  root: data/shared/oos
  fetch_start_date: *oos_start_date
  fetch_end_date: *oos_end_date
  expected_tickers: 100
  # Measured on the realised 100-firm panel. HOLX is served from a recorded LSEG
  # total-return archive covering the full window to its 2026-04-07 take-private,
  # so the delisting -- not the export -- is the binding right-truncation and the
  # complete-case intersection ends on the last trading day before it.
  expected_observations: 814
  expected_start_date: "2023-01-04"
  expected_end_date: *oos_last_date

n_samples: 445
# Minimum annual raw-archive count used to freeze the 100-firm news frame.
# This is the pre-deduplication admission rule recorded by the t92 preflight;
# the balanced empirical measures below still use their separate 128-article cap.
annual_raw_article_floor: 47
min_body_chars: 200
reader_model: beautifulsoup # or reader-lm:0.5b
co_mentions:
  # Retain a pair only when its exact-two co-mention appears in at least this
  # many calendar years. The Ge--Linton--Li m=1 convention corresponds to 2.
  min_persistence_years: 2
baseline_embedding_models:
- &baseline_embedding_model qwen3-embedding-8b
# Paper 1's lead encoder and the repository baseline use the same canonical
# Qwen3-Embedding-8B geometry. Qwen4B remains in the all-model roster as an
# explicit alternative rather than an implicit baseline.
paper1_lead_model: qwen3-embedding-8b
# Single source of truth for the frozen generated-embedding roster. The
# baseline-only analyses use baseline_embedding_models below; adding a model
# therefore cannot silently open an out-of-sample Mantel lane.
embedding_models:
- *baseline_embedding_model
- &qwen4_embedding_model qwen3-embedding-4b
- &bge_m3_embedding_model bge-m3
- &bge_large_embedding_model bge-large-en-v1.5
# Non-baseline embedding models used by the ablation-model-roster stage
# families (energy_tests_ablation_models, p3_model_robustness_model).
ablation_models:
- *qwen4_embedding_model
- *bge_m3_embedding_model
- *bge_large_embedding_model
matryoshka_range:
- 64
- 256
- null

