[project]
name = "pipeline"
version = "0.2.1"
description = "Reproduction of four papers from published numeric inputs."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
  "duckdb>=1.0.0",
  "jax[cpu]>=0.11.0",
  "matplotlib",
  "numpy>=2.0.0, <3.0.0",
  "pandas>=3.0.0, <4.0.0",
  "POT==0.9.7.post1",
  "pyarrow>=15.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "pyyaml>=6.0",
  "scikit-learn",
  "scipy>=1.14.0",
  "statsmodels>=0.14.0",
  "threadpoolctl>=3.6.0",
  "typer>=0.12.0",
  "statadic==0.5.0a2",
  "hotelling",
  "dotell",
  "semflow",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[dependency-groups]
dev = [
  # Independent spatial-estimator test oracles and their thread scope.
  "threadpoolctl>=3.6.0",
  { include-group = "reference" },
  "linearmodels>=7.0",
  "cvxpy>=1.5.0",  # Independent QP/SOCP test oracle, not a production solver.
  "pytest",
  "pytest-cov",
  "pytest-testmon",
  "pytest-xdist",
  "ruff",
  "deptry",
  "types-PyYAML",
]
# Independent numerical-oracle dependencies. POT is also a runtime dependency
# for the retained unequal-support corporate transport. CVXPY supplies the
# Clarabel and SCS solvers for the conditional W1 SOCP and W2 QP checks.
reference = [
  "libpysal>=4.15.0",
  "spreg>=1.9.0",
  "POT>=0.9.5",
]

[tool.uv]
package = true

[tool.uv.sources]
hotelling = { workspace = true }
dotell = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Default gate excludes slow; run the full suite with `pytest -m slow` or
# `pytest -m ""`.
addopts = "-m 'not slow'"
markers = [
  "slow: Statistical/backtest tests that take >2s (full CI only)",
  "integration: interaction between package subsystems or a real dependency/backend",
  "reference: compares results with independent software, published values, or trusted fixtures",
  "requires_optional(name): requires the named optional Python dependency",
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["TID251"]
"src/pipeline/cli/commands/**/*.py" = ["B008", "PLC0415"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Use pipeline.io.settings for environment values."
"os.getenv".msg = "Use pipeline.io.settings for environment values."
"dotenv".msg = "Use pipeline.io.settings for environment values."

# deptry: per-project dependency hygiene (unused / missing / transitive / misplaced).
# deptry has no config inheritance, so every workspace member carries its own
# block; the runner cd's into each member (`just python::deptry`). PEP 735
# [dependency-groups] are auto-treated as dev deps (exempt from DEP002); PEP-723
# notebooks/scripts carry their own inline deps and are excluded.
[tool.deptry]
extend_exclude = ["notebooks", "scripts"]
# pipeline imports its own package absolutely (`from pipeline.x import y`); the
# workspace installs pipeline into the shared venv, so without this deptry reports
# every self-import as a transitive dependency (DEP003).
known_first_party = ["pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
