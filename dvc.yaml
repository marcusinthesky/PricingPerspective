    - ${p3_tex}/generated/lean_status.tex:
        cache: false
    - ${p5_tex}/generated/lean_status.tex:
        cache: false
    - ${p6_tex}/generated/lean_status.tex:
        cache: false
  lean_bindings_check:
    desc: "Verify-only companion to lean_claims (same pattern as refs_bib_freshness): assert native Blueprint\
      \ node references and publication boundaries hold against the committed manifests \u2014 unique\
      \ labels, no hand-authored verification markers, exact generated disclosure projections, and no\
      \ Lean declaration name, source path, or Blueprint macro leaked into a publication chapter. Pure\
      \ text validation: no Lake, no network, seconds not minutes. Kept separate from lean_claims precisely\
      \ so an ordinary prose edit re-runs this and never the per-claim Lean invocations. Repair with `just\
      \ lean::claims-check` for the diagnosis and `just lean::claims-render` when the manifest is genuinely\
      \ stale. A cache-disabled certification stamp makes this check a real ancestor of every publication\
      \ render without caching the verification result."
    cmd: just lean::claims-publication-check && mkdir -p data/publication/certification && touch data/publication/certification/lean_bindings_check.stamp
    deps:
    - ${p6_tex}/metadata.tex
