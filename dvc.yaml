    - ${shared}/typed_distances/qwen3-embedding-4b/qwen3-embedding-4b-1024-unit/wasserstein_w2
    - ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-256-unit/wasserstein_w2
    - ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-64-unit/wasserstein_w2
    - ${shared}/typed_distances/ettax-v0/ettax-v0-unit/wasserstein_w2
    - ${shared}/typed_distances/ettax-v1/ettax-v1-unit/wasserstein_w2
    - ${shared}/typed_distances/ettax-v3/ettax-v3-unit/wasserstein_w2
