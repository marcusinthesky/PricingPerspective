  p1_representation_sensitivity_render:
    desc: Render the registered representation comparisons.
    cmd: ${py_pipeline} render-paper1-representation-sensitivity --results-file ${p1}/representation_sensitivity/results.json
      --output-dir ${p1_tex}/generated
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-representation-sensitivity.json
    - ${p1}/representation_sensitivity/results.json
    outs:
    - ${p1_tex}/generated/w2_representation_sensitivity.tex:
        cache: false
    - ${p1_tex}/generated/w2_sampling_diagnostics.tex:
        cache: false
  p1_neighbour_outcome_split:
    desc: 'Preregistered Paper 1 original-space neighbour outcome split. Select one nearest pair per non-singleton
      sector on the shared 2018-2020 Qwen3- Embedding-8B windowed rooted W2 distance, then evaluate common-date
      2021-2022 log1p return paths. NOT a holdout: the 2021-2022 outcome panel is a strict subset of the
      in-sample panel that also feeds compute_covariance@window0 and p1_dyadic_confound, so only the SELECTION
      input is date-restricted. The out-of-sample lane is the 2023-2026 panel. Named p1_neighbour_holdout
      until t80. The selection distance is READ, not recomputed: wasserstein_w2_pit_2020 is the governed
      Paper 1 distance for that declared window.'
    cmd: ${py_pipeline} paper1-neighbour-outcome-split --distance-artifact-dir ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2020
      --returns-dir ${shared}/returns --universe-csv data/universe.csv --params-file params.yaml --output-dir
      ${p1}/neighbour_outcome_split
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper1-neighbour-outcome-split.json
    - ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2020
    - ${shared}/returns
    - data/universe.csv
    params:
    - typed_analysis.distances.euclidean_chord
    - typed_analysis.distances.wasserstein_w2_pit_2020
    - typed_analysis.windows.pit-2020-12-31
    outs:
    - ${p1}/neighbour_outcome_split/pair_paths.parquet
    - ${p1}/neighbour_outcome_split/selection.json
    - ${p1}/neighbour_outcome_split/results.json
    - ${p1}/neighbour_outcome_split/provenance.json
  p1_illustrations:
    desc: Render Paper 1's analytic bound-construction schematic via the pipeline typer CLI. This is a
      closed-form illustration with no data inputs, so the dependency closure is just the figure module.
    cmd: ${py_pipeline} render-paper1-illustrations --output-dir ${p1_tex}/images
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-illustrations.json
    outs:
    - ${p1_tex}/images/continuous_bound_construction.pgf:
        cache: false
  p1_pcoa_render:
    desc: Publish the saved metric-MDS map and Shepard diagnostics alongside superimposed
      model/width and annual-vintage scree curves, with return PCA and signed inertia disclosure. Scalar
      bindings remain in the separate p1_numbers stage.
    cmd: ${py_pipeline} render-paper1-pcoa --analysis-dir ${p1}/pcoa --output-dir ${p1_tex}/images --spectrum-table
