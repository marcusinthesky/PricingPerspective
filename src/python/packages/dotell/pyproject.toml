[project]
name = "dotell"
version = "0.1.1"
description = "Shared Loguru/OpenTelemetry entrypoint observability, process telemetry, and JAX runtime policy for the pricing-perspective applications."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
  "filelock>=3.13",
  "loguru>=0.7.2",
  "opentelemetry-api>=1.40.0",
  "opentelemetry-exporter-otlp>=1.40.0",
  "opentelemetry-exporter-otlp-json-file>=0.65b0",
  "opentelemetry-sdk>=1.40.0",
  "psutil>=6.0.0",
]

[project.optional-dependencies]
jax = ["jax>=0.11.0"]

[dependency-groups]
dev = [
  "deptry",
  "jax[cpu]>=0.11.0",
  "pytest",
  "pytest-monitor",
  "pytest-testmon",
  "pytest-xdist",
  "ruff",
  "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# deptry: per-project dependency hygiene (unused / missing / transitive / misplaced).
# Each workspace member carries its own block (deptry has no config inheritance);
# PEP 735 dev-groups are auto-exempt from DEP002.
[tool.deptry]
extend_exclude = ["notebooks", "scripts"]

[tool.deptry.per_rule_ignores]
# filelock is a runtime-only requirement of JAX's compilation-cache eviction
# path; nothing here imports it, so deptry sees it as unused.
DEP002 = ["filelock"]

[tool.hatch.build.targets.wheel]
packages = ["src/dotell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.uv]
package = true
