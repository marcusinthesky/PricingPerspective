warmup_fraction = 0.02
weight_decay = 0.01
max_grad_norm = 1.0
seed = 42
log_every = 20
checkpoint_every = 6000
checkpoint_dir = "data/.encoder_vintage/ettax/checkpoints/V0"
live_dir = "data/.encoder_vintage/ettax/dvclive/V0"
metrics_path = "data/.encoder_vintage/ettax/metrics/V0.json"
