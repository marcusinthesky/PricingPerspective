    - paper1_text_controls.max_features
    - start_date
    - end_date
    - n_samples
    - annual_raw_article_floor
    outs:
    - ${p1_tex}/generated/numbers.tex:
        cache: false
  p1_neighbour_outcome_split_render:
    desc: Render the selected-sector 2021-2022 cumulative-log-return exhibit and its canonical registered
      semantic interpretation contract, which now also registers that the evaluation window is reused
      in-sample data. The figure stem and the neighbour-holdout-* number bindings deliberately keep their
      published names -- they are spelled in appendix_robustness.tex -- so only the contract ID moved
      (t80).
    cmd: ${py_pipeline} render-paper1-neighbour-outcome-split --results-file ${p1}/neighbour_outcome_split/results.json
      --provenance-file ${p1}/neighbour_outcome_split/provenance.json --selection-file ${p1}/neighbour_outcome_split/selection.json
      --pair-paths-file ${p1}/neighbour_outcome_split/pair_paths.parquet --numbers-path ${p1_tex}/generated/numbers.tex
      --figure-path ${p1_tex}/images/neighbour_holdout_paths.pgf --contract-path ${p1_tex}/generated/paper1_neighbour_outcome_split.interpretation.json
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper1-neighbour-outcome-split.json
    - ${p1}/neighbour_outcome_split/results.json
    - ${p1}/neighbour_outcome_split/provenance.json
    - ${p1}/neighbour_outcome_split/selection.json
    - ${p1}/neighbour_outcome_split/pair_paths.parquet
    - ${p1_tex}/generated/numbers.tex
    outs:
    - ${p1_tex}/images/neighbour_holdout_paths.pgf:
        cache: false
    - ${p1_tex}/generated/paper1_neighbour_outcome_split.interpretation.json:
        cache: false
  p3_pit_w2:
    desc: Assemble annual point-in-time squared-W2 matrices from the rooted typed artifacts named by `paper3.pit_vintage_grid`.
