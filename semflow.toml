project-root = "."
pipeline-file = "dvc.yaml"
hash-dir = ".semflow/hashes"
# Statadic is a pinned PyPI dependency; source roots cover repository code only.
source-roots = [
  "src/python/apps/pipeline/src",
  "src/python/apps/hotelling/src",
]

[hashing]
ignore-docstrings = true
ignore-annotations = true
ignore-type-checking-blocks = true

[tracking]
auto-typer = true
# The fingerprint generator retains its tool-environment byte dependencies.
control-stages = ["semflow_refresh"]
