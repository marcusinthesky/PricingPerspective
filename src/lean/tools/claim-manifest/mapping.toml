assumptions = [
  "both interaction matrices are row-stochastic",
  "the mixture weight lies in the unit interval"
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace. The selected declaration proves nonnegativity and unit row sums under convex mixing. The zero-diagonal clause follows analytically from zero-diagonal endpoints and is not part of this selected formal statement. No economic validity of either field is certified."

[[claims]]
