[project]
name = "semflow"
version = "0.1.1"
description = "Semantic Python fingerprints and review-first DVC dependency patches."
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
  "pyyaml>=6.0",
  "typer>=0.12.0",
]

[project.scripts]
semflow = "semflow.cli:app"

[dependency-groups]
dev = [
  "deptry",
  "pytest",
  "pytest-monitor",
  "pytest-testmon",
  "pytest-xdist",
  "ruff",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.deptry]
known_first_party = ["semflow"]

[tool.hatch.build.targets.wheel]
packages = ["src/semflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.uv]
package = true
