# uv workspace root. This package is not published; it only ties the
# workspace members together and holds shared tool configuration.
[project]
name = "pricing-perspective-workspace"
version = "0.0.0"
description = "Shared tooling for the four paper reproductions."
requires-python = "~=3.13.0"
dependencies = ["insitu-cli==0.2.0rc2"]

[tool.uv.workspace]
members = [
  "apps/pipeline",
  "apps/hotelling",
  "packages/dotell",
]

[tool.uv.sources]
semflow = { git = "https://github.com/marcusinthesky/semflow", rev = "480f5932ff868783fe06a9c42cca6a37c37e086f" }

# --- ruff (lint + format) ------------------------------------------------
[tool.ruff]
required-version = ">=0.16.0,<0.17"
target-version = "py313"
line-length = 88
src = ["."]
force-exclude = true
unsafe-fixes = false
show-fixes = true

[tool.ruff.lint]
# Stable maximal policy plus the exact preview rules accepted for this campaign.
# `explicit-preview-rules` prevents future preview additions from entering via a
# family prefix or `ALL` without an explicit policy decision.
select = ["ALL"]
extend-select = [
  "PLW0717",  # too-many-statements-in-try-clause
  "PLW1514",  # unspecified-encoding
  "RUF067",  # non-empty-init-module
  "RUF069",  # float-equality-comparison
]
preview = true
explicit-preview-rules = true
fixable = ["ALL"]
ignore = [
  # Ruff formatter incompatibilities.
  "COM812",
  "COM819",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "ISC001",
  "ISC002",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
  # Mutually exclusive pydocstyle conventions: retain D211 and D212.
  "D203",
  "D213",
  # No repository copyright-holder/header convention exists. A generic
  # placeholder would satisfy the syntax without creating a valid notice.
  "CPY001",
  # Scientific kernels and CLI callbacks can have several independent inputs;
  # group parameters only when the domain provides a coherent configuration.
  "PLR0913",
  "PLR0917",
]
allowed-confusables = [
  "\u03c3",
  "\u00d7",
  "\u03b1",
  "\u2139",
  "\u211d",
  "\u00b5"
]  # σ, ×, α, ℹ, ℝ, µ (intentional scientific notation)
# \u00b5 is MICRO SIGN, not \u03bc GREEK SMALL LETTER MU: it is the SI
# prefix in timing units. Keep it distinct from the Greek letter.

[tool.ruff.lint.flake8-type-checking]
strict = true
quote-annotations = true
runtime-evaluated-decorators = ["typer.Typer.callback", "typer.Typer.command"]

[tool.ruff.lint.per-file-ignores]
# Test directories use pytest's importlib discovery without package scaffolding.
"**/tests/**" = ["S101", "INP001"]

# These settings are also passed explicitly by the dependency/cycle recipes;
# keeping them here makes a bare `ruff analyze` use the same import graph.
[tool.ruff.analyze]
preview = true
detect-string-imports = true
string-imports-min-dots = 1
type-checking-imports = true
direction = "dependencies"

[tool.ruff.format]
preview = false
docstring-code-format = true

# --- pyrefly (type checking) ---------------------------------------------
# Type-check the three workspace members with the shared locked interpreter.
# Standalone PEP 723 scripts declare their own execution environments.
[tool.pyrefly]
preset = "strict"
# Editors and command-line checks resolve the same installed dependencies.
python-interpreter = ".venv/bin/python"
python-version = "3.13"
# Recipes pass each member's source and tests explicitly; these globs also
# cover editor checks and a bare `pyrefly check`.
project-includes = ["apps/**/*.py", "packages/**/*.py"]
project-excludes = [
  "**/.venv/**",
  "**/.lake/**",
  "**/node_modules/**",
  "**/__pycache__/**",
]

# Reject materialized Any in dotell. Apps retain the strict preset's default
# severity because NumPy's array shape stubs themselves materialize Any; Ruff
# ANN401 still rejects explicit top-level Any annotations throughout this workspace.
# Sub-configs merge into the shared interpreter and severity settings; nested
# project configurations would replace that inheritance.
[[tool.pyrefly.sub-config]]
matches = "packages/dotell/**"

[tool.pyrefly.sub-config.errors]
explicit-any = "error"

[dependency-groups]
dev = [
  "ruff>=0.16",
  "pyrefly>=1.1.1",
  "tach==0.35.0",
  "deptry",
]
