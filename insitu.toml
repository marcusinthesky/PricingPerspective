version = 1

[sources]
include = ["README.md", "infra/**/README.md", "src/**/README.md", ".context/reference/*/README.md"]
respect_gitignore = true
exclude = [".git/**", ".insitu/**", "**/.venv/**", "**/.lake/**", "**/node_modules/**", "**/build/**", "**/out/**", "**/__pycache__/**"]

[paths]
state = ".insitu/index.db"

[watch]
debounce_ms = 100
step_ms = 25
