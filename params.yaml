      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      sample_design: full_sample
    linear_mmd:
      distance_id: linear_mmd
      kind: statistical
      family: mmd
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      kernel: linear
      sample_design: full_sample
    rbf_mmd:
      distance_id: rbf_mmd
      kind: statistical
      family: mmd
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      kernel: rbf
      bandwidth_rule: median_positive_pairwise
      sample_design: full_sample
    # `exponent` is the ENERGY ground exponent alpha in (0, 2); it is not the
    # transport order. Both Wasserstein geometries use the chord ground
    # distance to the first power and raise the *transport* cost to their
    # order, which is carried by `estimator`. Do not "fix" the 1.0 below to a
    # 2.0 for wasserstein_w2 -- the schema rejects it, and it would mean a
    # different ground geometry rather than a different transport order.
    wasserstein_w1:
      distance_id: wasserstein_w1
      kind: statistical
      family: wasserstein
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: balanced_wasserstein_1
      normalization: rooted
      sample_design: full_sample
      sample_size: 128
    # Separate distance ID, not a variant of the one above: the artifact path is
    # keyed by distance ID, and W2 solves a different assignment problem, so its
    # matrix is not recoverable from the W1 one.
    wasserstein_w2:
      distance_id: wasserstein_w2
      kind: statistical
      family: wasserstein
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: balanced_wasserstein_2
      normalization: rooted
      sample_design: full_sample
      sample_size: 128
    # Point-in-time energy geometries. Identical functional to energy_v above --
    # same ground distance, exponent, and V-estimator -- differing only in which
    # observations are averaged. They are separate distance IDs because the
    # component artifact path is keyed by geometry ID, and an energy component
    # is NOT reducible across date subsets: A_ij is a mean over the cross
    # product of two clouds, so restricting dates changes both the row set and
    # the normalizer. Each window therefore earns its own cached cell.
    #
    # Retained for Paper 1; p1_neighbour_outcome_split consumes the 2020 cell,
    # which is its preregistered
    # 2018-2020 selection window -- the same window object, not a copy of it).
    energy_v_pit_2018:
      distance_id: energy_v_pit_2018
      kind: statistical
      family: energy
      ground_distance: euclidean_chord
      exponent: 1.0
      estimator: v_statistic
      normalization: unhalved
      sample_design: point_in_time
      sample_window: pit-2018-12-31
    energy_v_pit_2019:
      distance_id: energy_v_pit_2019
      kind: statistical
