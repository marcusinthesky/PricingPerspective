# OpenRouter embedding configuration (T-D4)
# NOTE: qwen/qwen3-embedding-4b, perplexity/pplx-embed-v1-0.6b, and baai/bge-large-en-v1.5
# do NOT appear in the /api/v1/models listing (which only covers chat/completion models).
# They may still be routed by OpenRouter's embeddings endpoint — verify with a live call.
# pplx-embed-v1-0.6b dims (768) and hf id are inferred from model naming; unverified via API.
embedding:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  batch_size: 32
  concurrency: 4
  max_chars: 8000
  models:
    qwen3-embedding-4b:
      id: &qwen3-embedding-4b-model-id qwen/qwen3-embedding-4b
      dims: &qwen3-embedding-4b-dimensions 2560
      hf: Qwen/Qwen3-Embedding-4B
    qwen3-embedding-8b:
      id: &qwen3-embedding-8b-model-id qwen/qwen3-embedding-8b
      dims: &qwen3-embedding-8b-dimensions 4096
      hf: Qwen/Qwen3-Embedding-8B
      # The frozen canonical embedding artifacts are the preregistered m=128
      # panel, even though the shared source subsample has n_samples=445.
      coverage:
        target_rows: 128
        minimum_rows: 128
    bge-m3:
      id: &bge-m3-model-id baai/bge-m3
      dims: &bge-m3-dimensions 1024
      hf: BAAI/bge-m3
      # Declares the width the frozen artifacts already hold. Previously implicit
      # in the n_samples value at first-embed time; stated so a roster addition
      # lands on the same panel geometry.
      coverage:
        target_rows: 128
        minimum_rows: 128
    pplx-embed-v1-0.6b:
      id: perplexity/pplx-embed-v1-0.6b
      dims: 768  # unverified — inferred from 0.6B naming; confirm from live API or HF card
      hf: perplexity-ai/pplx-embed-v1-0.6b  # unverified — not in OpenRouter /models listing
    bge-large-en-v1.5:
      id: &bge-large-en-v1_5-model-id baai/bge-large-en-v1.5
      dims: &bge-large-en-v1_5-dimensions 1024
      hf: BAAI/bge-large-en-v1.5
      max_chars: 1200  # 512-token context window; 1200 chars clears all tickers, overrides global 8000
      # As for bge-m3: pins the realised m=128 width of the frozen artifacts.
      coverage:
        target_rows: 128
        minimum_rows: 128

# Ablation grid: (embedding model × Matryoshka dim). Self-contained — does NOT
# touch the canonical embedding_models DAG. matryoshka dims: null = full width.
# bge-large-en-v1.5 is NOT Matryoshka-trained, so only full width is meaningful.
ablation:
  grid:
    qwen3-embedding-4b:
    - 32
    - 64
    - 128
    - 256
    - null
    qwen3-embedding-8b:
    - 32
    - 64
    - 128
    - 256
    - null
    bge-m3:
    - 64
    - 256
    - null
    bge-large-en-v1.5:
    - null

# Permutation test parameters
permutation_tests:
  num_permutations: 10000  # Number of permutation resamples
  exponent: 1.0            # Distance exponent α in (0, 2); 1.0 = standard energy distance
  seed: 42                 # Random seed for reproducibility
  max_resamples: 2000      # publication rerun; finest resolvable p-value 1/2001 = 0.0004998 < 0.05/52 = 0.000962 (Bonferroni over 52 targets) -- 1000 was NOT adequate: min p=1/1001=0.000999 > 0.000962 forces 0/53 significant under Bonferroni regardless of the true effect
  # The permutation stage reproduces the retired diagnosis.  The exact
  # barycentre is validated separately by validate_hedging_error_bound.
  weight_method: kernel_balance
  solver: pgd
  solver_tol: 1.0e-8
  solver_maxiter: 10000
  # Per-target tests fan out across processes (each target is independent).
  # null/0 ⇒ auto (cpu_count − 2, leaving headroom on the 8-core host); the
  # result is independent of n_jobs (per-target seeds are position-based).
  n_jobs: 6

# Shared W2-to-return-exposure frontier consumed by downstream papers.
w2_exposure_frontier:
  train_start: "2018-01-01"  # train window: PCA loading coordinates + ell_lo/L_hat calibration
  train_end: "2021-12-31"
  test_start: "2022-01-01"   # H2 OOS coverage test window
  test_end: "2022-12-31"
  ks: [3, 5, 10]              # K sweep for PCA loading coordinates (plan Author decision #3)
  k_target_explained_variance: 0.80  # pick smallest swept K reaching this trace share
  tau_lo: 0.05
  tau_hi: 0.95
  n_boot: 2000        # certified H1 frontier rerun (2026-07-11): block-bootstrap replicates
                      # for ell_lo/L_hat + coverage CIs. Cheap (configured
                      # N-by-N eigendecomp per replicate), ~minutes; NOT the heavy
                      # energy-permutation cost (that is permutation_tests).
  n_clusters: 15
  n_mc: 500
  n_dirichlet: 8
  cap_kill_threshold: 0.05
  cap_marginal_threshold: 0.10
  wolak_alpha: 0.05
  wolak_ell0: 0.0     # TODO(author): external Wolak anchor + target MDE (plan Author decision
                      # #6, PENDING). 0.0 is the weakest economically-motivated placeholder
                      # (m_p = y_p >= 0 trivially) -- wolak_stat will read ~0 until a genuine
                      # nonzero anchor is supplied; see run_h1_pilot docstring / DEFAULT_WOLAK_ELL0.
  coverage_target: 0.90  # H2 pre-registered coverage floor
  seed: 42
  pseudo_ipo_k: 5              # PCA loading dimension for the leave-one-out pseudo-IPO bracket
  tightest_cap_tol: 1.0e-8     # qpax exact IP-QP tolerance for tightest-cap max-Q portfolio
  tightest_cap_maxiter: 10000  # qpax exact IP-QP max iterations
# Paper 3: W2 exposure-envelope estimator roster, sub-period slicing, and the
# point-in-time (PIT) Wasserstein vintage grid.
# NOTE: `backtest()`/`_cov_estimators()` in paper3_empirical.py do not yet
# read this section (their estimator roster/sub-period bounds are still
# hardcoded — `methods` at paper3_empirical.py:698, `SUB_PERIODS` at :617);
# wiring `pipeline/cli/commands/p3/estimate.py: cli_paper3_empirical` to plumb
# these values through is out of this wave's file scope and is left as a
# follow-up. This section is the source-of-truth
# config for that follow-up and documents the decisions already applied in
# code.
paper3:
  primary_distance_id: wasserstein_w2
  certificate_feasibility:
    # Full-sample non-vacuity/sensitivity grid only. These values are not
    # calibrated transmission parameters and carry no ex-ante validity claim.
    L: [1.0, 1.1, 1.25, 1.5]
    tau: [0.0, 0.025, 0.05, 0.10]
    portfolios: [equal_weight, inverse_volatility]
    # Reference population for the Appendix D.1 percentile. A single sampling
    # law would make the rank an artifact of that law, so the rank is reported
    # under several. The legacy `effective_n_matched` key is retained for
    # artifact compatibility, but its concentration-0.8 law is now interpreted
    # as a fixed, moderately concentrated comparator rather than as matched to
    # the current news allocation. Descriptive and in-sample.
    news_reference:
      draws: 20000
      seed: 42
      designs:
      - {label: uniform_cap_12p5, concentration: 1.0, maximum_weight: 0.125}
      - {label: uniform_cap_15, concentration: 1.0, maximum_weight: 0.15}
      - {label: effective_n_matched, concentration: 0.8, maximum_weight: 0.15}
      - {label: concentrated_cap_15, concentration: 0.5, maximum_weight: 0.15}
  certificate_validation:
    formation_frequency: monthly
    volatility_lookback_days: 252
    evaluation_horizon_days: 63
    calibration_start: "2019-01-01"
    calibration_end: "2022-12-31"
    evaluation_start: "2023-01-04"
    evaluation_end: *oos_last_date
    frozen_vintage: "2022-12-31"
    L: [1.0, 1.1, 1.25, 1.5]
    tau: [0.0, 0.025, 0.05, 0.10]
    coverage_target: 0.90
    confidence_level: 0.95
    article_block_replications: 499
    return_block_replications: 2000
    seed: 42
    maximum_weight: 0.10
    random_portfolios: 500
    label_permutations: 1000
    residual_budgets: [0.0, 0.025, 0.05]
  estimators: [sample, ledoit_wolf, sigma_dist, sigma_shrink, nonlinear_lw, one_over_n, ff5]
  # `ff5` is a RECORDED BLOCKER: no FF5 factor-return panel is on-graph in this
  # repo and paper3_empirical.py does not fetch network data, so `_ff5_cov`
  # returns None and the `ff5` column is omitted from the backtest output
  # until factor data is staged. See t15 README.
  sub_periods:
    - {label: "2018-2019", start: "2018-01-01", end: "2019-12-31"}
    - {label: "2020", start: "2020-01-01", end: "2020-12-31"}
    - {label: "2021-2022", start: "2021-01-01", end: "2022-12-31"}
  # Point-in-time W2 vintage grid for the random-functional-exposure pivot.
  # Annual vintages retain the t20 one-ticker feasibility decision:
  # probe (src/python/scripts/paper3_pit_probe.py): early-year per-ticker article
  # counts are too thin for per-rebalance recomputation (AAL: 49/2018 ->
  # 445/2022 cumulative). The full configured-panel probe (dc-p3-pit-probe) may
  # refine this grid before the vintage repro runs.
  #
  # Each entry names the `matrices.npz` key and the typed rooted-W2 artifact
  # that supplies it. The cutoff lives in `typed_analysis.windows`; the
  # assembler validates the window and squares W2 exactly once because the
  # covariance envelope consumes quadratic transport cost.
  pit_vintage_grid:
    - {vintage: "2018-12-31", distance_id: wasserstein_w2_pit_2018}
