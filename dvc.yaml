      --representation-dir ${shared}/typed_distances/${paper1_lead_model}/${paper1_lead_model}-64-unit/wasserstein_w2
      --vintage-dir ${shared}/typed_distances/ettax-v0/ettax-v0-unit/wasserstein_w2
