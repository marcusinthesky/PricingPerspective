# Authored publication metadata. Native Publication.Claims annotations own the exact
# claim_id → declaration association and plain-language statement summary.
# Only paper ownership, assumptions and identifier-free disclosure belong here.
# extract.py joins the complete registry bijectively to freshly exported native
# metadata, then independently checks statements, axioms and True contracts.

[[claims]]
paper = "01_continuous_bounds"
claim_id = "lem:polarization"
assumptions = ["x, y in a real inner product space"]
disclosure = "The polarization identity is provided by mathlib."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:wflat-sar-gate"
assumptions = [
  "each row is a leave-one-out simplex vector",
  "absolute rho below one"
]
disclosure = "Machine-checked for the exact finite operator contract in the pinned Lean 4 / mathlib v4.35.0 workspace. This verifies SAR compatibility, not the economic validity of the text-derived weights."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "def:perron-limit"
assumptions = []
disclosure = "Formalized as the exact quantitative premise consumed by the convergence bridge. The declaration does not claim that a parquet operator satisfies the premise and does not formalize general Perron--Frobenius theory."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:perron-from-geometric"
assumptions = [
  "0 <= q < 1",
  "the stated geometric matrix-norm bound holds for every natural k"
]
disclosure = "Machine-checked under standard axioms only. This verifies that a quantitative contraction certificate is sufficient for the Perron limit; the empirical float64 certificate remains a separate numerical witness."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "prop:finite-rho-bound"
assumptions = [
  "absorbing idempotent projection",
  "rho != 1",
  "the complementary Neumann norm is below one",
  "the index set is nonempty"
]
disclosure = "Machine-checked under standard axioms only in the maximum absolute row-sum matrix norm. It is a finite-rho algebraic bound, not a statistical confidence interval."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:replication-centrality"
assumptions = ["IsPerronLimit W pi"]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace, conditional on the assumed Perron--Frobenius limit hypothesis."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:stationarity"
assumptions = ["IsPerronLimit W pi", "ι nonempty"]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace, conditional on the assumed Perron--Frobenius limit hypothesis."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:rankone-collapse"
assumptions = ["IsPerronLimit W pi", "W row-stochastic", "ι nonempty"]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace, conditional on the single assumed Perron--Frobenius power-limit hypothesis. The resolvent limit it previously also assumed is now derived from that hypothesis rather than assumed alongside it. The limiting common-mode variance may vanish, so the formal conclusion permits rank zero as well as rank one."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:resolvent-from-perron"
assumptions = ["IsPerronLimit W pi", "W row-stochastic", "ι nonempty"]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace under standard axioms only. The derivation is elementary linear algebra via an absorbing-idempotent resolvent split; it introduces no Perron--Frobenius content of its own, no Abel/Tauberian summation, and no spectral theory."

