    - .semflow/hashes/entrypoints/pipeline/paper5-post-corpus-qmle.json
    - ${shared}/returns
    - ${shared}/oos/returns
    - ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
