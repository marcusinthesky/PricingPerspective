        cache: false

  # ------------------------------------------------------------------
  # CANONICAL MANUSCRIPT RENDER (t24.12 LaTeX cutover)
  # ------------------------------------------------------------------
  lean_claims:
    desc: >-
      Proof-to-prose coupling: re-derive each paper's Lean verification status
      from the proofs themselves. extract.py runs one `lake env lean`
      #check/#print-axioms per mapping.toml entry against the built workspace and
      records build_result="checked" only when the declaration compiles and its
      axiom set stays inside the mathlib base {propext, Classical.choice,
      Quot.sound} — a `sorryAx` or a stray axiom demotes the claim. render.py
      projects that verdict into the \ppvalue bindings each target \input{}s via
      generated/lean_status.tex. Placing it in the DAG upstream of `render` is the
      point of adopting LeanBlueprint: a manuscript can no longer assert
      "machine-checked" from a stale committed projection, because touching
      src/lean/packages invalidates every paper's status file and every PDF that
      inputs it. HEAVY — ~3 min of `lake build` on a warm checkout plus one
      `lake env lean` invocation per claim (38 today) — but only on a Lean or
      mapping edit. Run
      `just lean::warm` once per checkout first; from cold this also pays the
      mathlib cache fetch. The `outs` paper list is manual: render.py enumerates
      papers from the manifest, so a sixth paper needs a line added here.
    cmd: >-
      just lean::check && just lean::claims-render
    deps:
    - src/lean/packages
    - src/lean/tools/claim-manifest/mapping.toml
    - src/lean/tools/claim-manifest/extract.py
    - src/lean/tools/claim-manifest/render.py
    outs:
    - src/lean/tools/claim-manifest/generated/manifest.json:
        cache: false
    - src/lean/tools/claim-manifest/generated/claim_manifest.tex:
        cache: false
    - src/lean/blueprint/src/generated/claim_bindings.tex:
        cache: false
    - src/latex/projects/01_continuous_bounds/src/generated/lean_status.tex:
        cache: false
    - src/latex/projects/03_distance_implied_mpt/src/generated/lean_status.tex:
        cache: false
    # The retired energy-robustness manuscript holds no manifest claims, so the renderer
    # emits no status projection for it and this stage declares no out for it.
    - src/latex/projects/05_spatial_pricing/src/generated/lean_status.tex:
        cache: false

  lean_bindings_check:
    desc: >-
      Verify-only companion to lean_claims (same pattern as refs_bib_freshness):
      assert the authored/generated Blueprint boundary still holds against the
      committed manifest — unique labels, no hand-authored \lean/\leanok
      (a verified marker may only ever be generated from a passing Lean check),
      bindings equal to the manifest projection, and no Lean declaration name,
      source path, or Blueprint macro leaked into a publication chapter. Pure
      text validation: no Lake, no network, seconds not minutes. Kept separate
      from lean_claims precisely so an ordinary prose edit re-runs this and never
      the per-claim Lean invocations. Repair with `just lean::claims-check` for the
      diagnosis and `just lean::claims-render` when the manifest is genuinely stale.
      A cache-disabled certification stamp makes this check a real ancestor of
      every publication render without caching the verification result.
    cmd: >-
      just lean::claims-check &&
      mkdir -p data/publication/certification &&
      touch data/publication/certification/lean_bindings_check.stamp
    deps:
    # The authored blueprint .tex that check.py scans (`authored_tex_files` =
    # src/**/*.tex minus generated/). Listed file-by-file rather than as the
    # parent dir: `src/lean/blueprint/src` contains lean_claims' own out
    # claim_bindings.tex, and a dep enclosing another stage's out is an overlap
    # DVC only resolves at repro time.
    - src/lean/blueprint/src/content.tex
    - src/lean/blueprint/src/chapters
    - src/lean/blueprint/src/print.tex
    - src/lean/blueprint/src/web.tex
    - src/lean/blueprint/src/macros/common.tex
    - src/lean/blueprint/src/macros/print.tex
    - src/lean/blueprint/src/macros/web.tex
    - src/lean/blueprint/src/generated/claim_bindings.tex
    - src/lean/blueprint/check.py
    - src/lean/tools/claim-manifest/generated/manifest.json
    - src/latex/projects/01_continuous_bounds/src/chapters
    - src/latex/projects/03_distance_implied_mpt/src/chapters
    - src/latex/projects/05_spatial_pricing/src/chapters
    outs:
    - data/publication/certification/lean_bindings_check.stamp:
        cache: false

  refs_bib_freshness:
    desc: >-
      Freshness gate (t24.16.2/F4): assert each paper's committed generated
      refs.bib still equals the citation-selected projection of canonical CSL
      reference README frontmatter. This verify-only stage makes drift visible
      to `dvc status`/`dvc repro`; run `just references::export-bib` to refresh.
    cmd: >-
      just references::bibliography-check &&
      mkdir -p data/publication/certification &&
      touch data/publication/certification/refs_bib_freshness.stamp
    deps:
    - .context/reference
    - src/python/scripts/references/justfile
    - src/latex/projects/01_continuous_bounds/src/refs.bib
    - src/latex/projects/03_distance_implied_mpt/src/refs.bib
    - src/latex/projects/05_spatial_pricing/src/refs.bib
    outs:
    - data/publication/certification/refs_bib_freshness.stamp:
        cache: false

  render:
    foreach:
      01_continuous_bounds-arxiv:
        paper: 01_continuous_bounds
        target: arxiv
        archive: tar.gz
      03_distance_implied_mpt-arxiv:
        paper: 03_distance_implied_mpt
        target: arxiv
        archive: tar.gz
      05_spatial_pricing-arxiv:
        paper: 05_spatial_pricing
        target: arxiv
        archive: tar.gz
    do:
      desc: >-
        Canonical manuscript render: compile each paper's LaTeX source to the arXiv
        target with Tectonic (check-log gated), then
        stage, hostile-audit, and deterministically archive that venue's submission
        bundle. Tectonic is the sole renderer; TeX Live and the second build path
        it served were removed, so `just latex::build` is the only way a PDF is
        produced here or interactively.

        Both artifacts are published in-tree beside the compile log and .blg, under
        src/latex/projects/<paper>/build/<target>/, and are `cache: false` — they
        are tracked in git (LFS) rather than pushed to the DVC remote, so anyone
        with repository access can read the paper and reproduce an upload without
        object-store credentials.

        `just latex::bundle` re-compiles the staged sources twice more (clean-room,
        then unpack-and-recompile from the archive), so a render costs three
        compiles per target. That is deliberate: the audit is the submission gate,
        and keeping it on the critical path means a PDF cannot be published from
        sources that would not survive upload to arXiv or the journal portal.
      cmd: >-
        just latex::build ${item.paper} ${item.target} &&
        just latex::bundle ${item.paper} ${item.target}
      deps:
      - src/latex/justfile
      - src/latex/templates/pp-manuscript.sty
      # The audit gate is a dependency of the archive, not merely of the decision
      # to publish it: bundle-audit writes MANIFEST.json, which ships *inside* the
      # submission archive, so a schema change there alters an out while every source input is
      # byte-identical. Without this edge `dvc repro` reports "up to date" and the
      # committed archives keep the old manifest until someone remembers `-f` —
      # which is exactly what happened when `bundle_digest` was added. The
      # Semflow covers Python entrypoint closures only, so this LaTeX-side operator
      # remains an explicit dependency.
      - src/latex/tools/bundle-audit
      - src/latex/projects/${item.paper}/src/chapters
      - src/latex/projects/${item.paper}/src/body.tex
      - src/latex/projects/${item.paper}/src/appendix.tex
      - src/latex/projects/${item.paper}/src/targets/${item.target}.tex
      - src/latex/projects/${item.paper}/src/metadata.tex
      # The whole generated/ tree, not numbers.tex + lean_status.tex alone:
      # chapters also \input pipeline-rendered tables (nine in paper 1,
      # paper-specific tables), which a shared matrix cannot name per paper.
      # A directory dep closes that staleness gap — previously regenerating a
      # table left every PDF "up to date" — and covers tables added later. It
      # carries the lean_claims edge too: every target \input{generated/lean_status},
      # and without that edge a PDF could ship a "machine-checked" claim from a
      # projection the proofs no longer support.
      - src/latex/projects/${item.paper}/src/generated
      - src/latex/projects/${item.paper}/src/images
      - src/latex/projects/${item.paper}/src/refs.bib
      - data/publication/certification/lean_bindings_check.stamp
      - data/publication/certification/refs_bib_freshness.stamp
      outs:
      - src/latex/projects/${item.paper}/build/${item.target}/${item.target}.pdf:
          cache: false
      - src/latex/projects/${item.paper}/build/${item.target}/${item.target}.${item.archive}:
          cache: false

  # ====================================================================
  # SHARED W2 EXPOSURE FRONTIER
  # ====================================================================

  ## H1 identification frontier

  w2_exposure_frontier:
    desc: >-
      Shared W2 exposure frontier: numerator from returns-based
      whitened-PCA loadings (independent of the text embeddings, fixes the F1
      shared-input tautology), denominator the typed text W2 distance. Single
      ell_lo drives both the degeneracy kill and the
      certified cap-reduction (F3); block-bootstrap over return time blocks
      (F6); externally-anchored Wolak test (F4, anchor is a TODO(author)
      placeholder -- see params.yaml w2_exposure_frontier.wolak_ell0).
    cmd: >-
      ${py_pipeline} w2-exposure-frontier
      --distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${scientific_selectors.typed_distance_id}
    deps:
    - .semflow/hashes/entrypoints/pipeline/w2-exposure-frontier.json
    - ${shared}/returns
    - ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${scientific_selectors.typed_distance_id}
    params:
    - w2_exposure_frontier.train_start
    - w2_exposure_frontier.train_end
    - w2_exposure_frontier.ks
    - w2_exposure_frontier.k_target_explained_variance
    - w2_exposure_frontier.tau_lo
    - w2_exposure_frontier.tau_hi
    - w2_exposure_frontier.n_boot
    - w2_exposure_frontier.n_clusters
    - w2_exposure_frontier.n_mc
    - w2_exposure_frontier.n_dirichlet
    - w2_exposure_frontier.cap_kill_threshold
    - w2_exposure_frontier.cap_marginal_threshold
    - w2_exposure_frontier.wolak_alpha
    - w2_exposure_frontier.wolak_ell0
    - w2_exposure_frontier.seed
    outs:
    - ${shared}/w2_exposure_frontier

  p3_pit_w2:
    desc: >-
      Assemble annual point-in-time squared-W2 matrices from the rooted typed
      artifacts named by `paper3.pit_vintage_grid`. The typed artifacts measure
      observable characteristic laws C_i; the Paper 3 transmission restriction
      connects those distances to latent exposure laws P_i. Squaring occurs
      only in this archive boundary because polarization consumes quadratic
      transport cost.
    cmd: >-
      ${py_pipeline} paper3-pit-w2
      --params-file params.yaml
      --out-path ${p3}/pit_w2/matrices.npz
      --distance-root ${shared}/typed_distances_windowed
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper3-pit-w2.json
    - ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2018
    - ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2019
    - ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2020
    - ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2021
