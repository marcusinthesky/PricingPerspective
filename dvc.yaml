    - ${p1}/representation_sensitivity/bootstrap_draws.parquet:
        cache: false

  p1_neighbour_outcome_split:
    desc: >-
      Preregistered Paper 1 original-space neighbour outcome split. Select one
      nearest pair per non-singleton sector on the shared 2018-2020 Qwen3-
      Embedding-8B windowed rooted W2 distance, then evaluate common-date
      2021-2022 log1p return paths.
      NOT a holdout: the 2021-2022 outcome panel is a strict subset of the
      in-sample panel that also feeds compute_covariance@window0 and
      p1_dyadic_confound, so only the SELECTION input
      is date-restricted. The out-of-sample lane is the 2023-2026 panel. Named
      p1_neighbour_holdout until t80.
      The selection distance is READ, not recomputed: wasserstein_w2_pit_2020 is
      the governed Paper 1 distance for that declared window.
    cmd: >-
      ${py_pipeline} compute-neighbour-outcome-split
      --distance-artifact-dir
      ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2020
      --returns-dir ${shared}/returns
      --universe-csv data/universe.csv
      --params-file params.yaml
      --output-dir ${p1}/neighbour_outcome_split
    deps:
    - .semflow/hashes/entrypoints/pipeline/compute-neighbour-outcome-split.json
    - ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2020
    - ${shared}/returns
    - data/universe.csv
    params:
    - typed_analysis.distances.euclidean_chord
    - typed_analysis.distances.wasserstein_w2_pit_2020
    - typed_analysis.windows.pit-2020-12-31
    outs:
    # pair_metrics.parquet and returns.parquet were dropped in t80: no stage
    # declared either as a dependency, and the returns table was a re-slice of
    # ${shared}/returns over dates every other Paper 1 stage already reads.
    # Their logical SHA-256s remain in provenance.json.
    - ${p1}/neighbour_outcome_split/pair_paths.parquet:
        cache: false
    - ${p1}/neighbour_outcome_split/selection.json:
        cache: false
    - ${p1}/neighbour_outcome_split/summary.json:
        cache: false
    - ${p1}/neighbour_outcome_split/provenance.json:
        cache: false

  p1_illustrations:
    desc: >-
      Render Paper 1's analytic bound-construction schematic via the pipeline
