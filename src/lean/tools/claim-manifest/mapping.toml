# NEW 2026-08-23 (t13). The four bridges that give the paper its spatial spine:
# adjustment-cost closure, two-marginal nesting, aggregate carrier transfer, and
# dispersion attenuation under the normalized spatial multiplier.
[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:adjustment-equilibrium"
statement_summary = "For nonnegative adjustment intensity and a row-stochastic interaction matrix, a profile minimizes every firm's quadratic adjustment objective coordinatewise if and only if it satisfies the exact vanishing-gradient equation."
declaration = "PricingPerspective.Connections.SpatialTransmission.quadraticAdjustmentEquilibrium_iff_stationary"
package = "PricingPerspective"
file = "packages/PricingPerspective/PricingPerspective/Connections/SpatialTransmission.lean"
assumptions = [
  "nonnegative adjustment intensity",
  "row-stochastic interaction matrix"
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.31.0 workspace by a completing-square identity rather than a differentiability argument, so the equivalence holds in any real inner-product exposure space."

[[claims]]
paper = "05_spatial_pricing"
claim_id = "thm:spatial-closure"
statement_summary = "The first-order condition of the coordinatewise quadratic adjustment problem is exactly a Hilbert-valued spatial autoregression whose feedback parameter is the adjustment intensity divided by one plus that intensity."
declaration = "PricingPerspective.Connections.SpatialTransmission.sar_of_quadraticAdjustmentEquilibrium"
package = "PricingPerspective"
file = "packages/PricingPerspective/PricingPerspective/Connections/SpatialTransmission.lean"
assumptions = [
  "nonnegative adjustment intensity",
  "row-stochastic interaction matrix"
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.31.0 workspace. The spatial equation is derived from the stated adjustment problem; it is not imposed as a reduced form, and the interaction weights themselves are a maintained input."

