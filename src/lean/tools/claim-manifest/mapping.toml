claim_id = "thm:pairwise-nesting"
assumptions = ["two probability laws on a second-countable pseudometric space"]
disclosure = "Machine-checked as an exact equality in the pinned Lean 4 / mathlib v4.35.0 workspace, with no optimal-coupling existence theorem required. It identifies the pairwise quadratic Wasserstein term as the two-firm case of the multi-firm dispersion functional."

[[claims]]
