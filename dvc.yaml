    - ${shared}/typed_distances_windowed/qwen3-embedding-8b/qwen3-embedding-8b-unit/wasserstein_w2_pit_2022
    params:
    - paper3.pit_vintage_grid
    - typed_analysis.distances.euclidean_chord
    - typed_analysis.distances.wasserstein_w2_pit_2018
    - typed_analysis.distances.wasserstein_w2_pit_2019
    - typed_analysis.distances.wasserstein_w2_pit_2020
    - typed_analysis.distances.wasserstein_w2_pit_2021
    - typed_analysis.distances.wasserstein_w2_pit_2022
    - typed_analysis.windows.pit-2018-12-31
    - typed_analysis.windows.pit-2019-12-31
    - typed_analysis.windows.pit-2020-12-31
    - typed_analysis.windows.pit-2021-12-31
    - typed_analysis.windows.pit-2022-12-31
    - typed_analysis.providers.qwen3-embedding-8b
    - typed_analysis.representations.qwen3-embedding-8b-unit
    outs:
    - ${p3}/pit_w2/matrices.npz
    - ${p3}/pit_w2/provenance.manifest.json
  p3_certificate:
    desc: Governed full-sample non-vacuity and transmission-sensitivity surface for Paper 3's information-certified
      diversification bound. This stage is descriptive and independent of the expensive covariance/backtest
      stage.
    cmd: ${py_pipeline} paper3-certificate --params-file params.yaml --returns-dir ${shared}/returns --distance-artifact
      ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${paper3.primary_distance_id}
      --output-dir ${p3}/certificate
