      ${p5}/universe_horizon_bridge/reference_52_oos_returns
      --reference-barycentre-dir
      ${p5}/universe_horizon_bridge/reference_52_w_flat
      --reference-results-json
      ${p5}/universe_horizon_bridge/reference_52_qmle_results.json
      --output-dir ${p5}/universe_horizon_bridge
      --start ${paper5.universe_horizon_bridge.evaluation_start}
      --short-end ${paper5.universe_horizon_bridge.short_end}
      --long-end ${paper5.universe_horizon_bridge.long_end}
      --expected-reference-universe
      ${paper5.universe_horizon_bridge.reference_n_firms}
      --expected-current-universe
      ${paper5.universe_horizon_bridge.expanded_n_firms}
      --n-bootstrap ${paper5.qmle.n_bootstrap}
      --block-length ${paper5.qmle.block_length}
      --seed ${paper5.qmle.seed}
      --shared-return-tolerance
      ${paper5.universe_horizon_bridge.shared_return_tolerance}
      --result-tolerance ${paper5.universe_horizon_bridge.result_tolerance}
      --reference-revision
      ${paper5.universe_horizon_bridge.reference_revision}
      --provider-id ${paper5.provider_id}
      --representation-id ${paper5.representation_id}
      --barycentre-arm-id ${paper5.barycentre_arm_id}
      --geometry-id ${paper5.distance_id}
    deps:
