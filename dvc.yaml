    - paper5.two_field.seed
    - paper5.two_field.n_random
    - paper5.two_field.theta_points
    - paper5.two_field.rho_points
    - paper5.provider_id
    - paper5.representation_id
    - paper5.distance_id
    - paper5.barycentre_arm_id
    outs:
    - ${p5}/two_field_qmle/results.json
    - ${p5}/two_field_qmle/results.parquet
    - ${p5}/two_field_qmle/surface.parquet
    - ${p5}/two_field_qmle/bootstrap.parquet
