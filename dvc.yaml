        cache: false

  # ====================================================================
  # PAPER 5 - energy-robustness H3 prerequisite
  # ====================================================================

  p5_energy_robustness:
    desc: >-
      Paper 5's energy-bracket H3 prerequisite: calibrate the covariance
      ambiguity radii on 2018--2022 and evaluate the frozen-design holdout on
      the governed post-2022 return panel. Its materiality and bracket-coverage
      records are consumed by p5_empirical; the stage is owned by Paper 5 even
      though the numerical components are shared with Paper 3.

      The bracket family is named for the *energy* ambiguity set, but the radii
      are calibrated on the typed rooted-W2 matrix selected by
      scientific_selectors — NOT on energy_v. The mismatch between that name and
      the selector is deliberate and load-bearing: reading the name as the
      selector once silently repointed this stage at energy_v, which moves every
      H3 coverage and materiality number. Change the selector only as a declared
      scientific decision, and keep the CLI/contract defaults in step.
    cmd: >-
      ${py_pipeline} paper5-energy-robustness
      --returns-dir ${shared}/returns
      --eval-returns-dir ${shared}/oos/returns
      --calib-start ${start_date}
      --calib-end ${end_date}
      --eval-start ${oos_start_date}
      --eval-end ${oos_end_date}
      --distance-artifact ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${scientific_selectors.typed_distance_id}
      --provider-id ${scientific_selectors.typed_distance_provider}
      --representation-id ${scientific_selectors.typed_distance_representation}
      --distance-id ${scientific_selectors.typed_distance_id}
      --embeddings-dir ${shared}/embeddings/${scientific_selectors.baseline_model}
      --frontier-metrics ${shared}/w2_exposure_frontier/frontier_metrics.json
      --output-dir ${p5}/energy_robustness
      --n-boot-stat ${paper5.energy_robustness.n_boot_stat}
      --n-boot-ridge ${paper5.energy_robustness.n_boot_ridge}
      --n-boot-sharpe ${paper5.energy_robustness.n_boot_sharpe}
      --seed ${paper5.energy_robustness.seed}
      --run-folds
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper5-energy-robustness.json
    - ${shared}/returns
    - ${shared}/oos/returns
    - ${shared}/embeddings/${scientific_selectors.baseline_model}
    - ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${scientific_selectors.typed_distance_id}
    - ${shared}/w2_exposure_frontier/frontier_metrics.json
    params:
    - start_date
    - end_date
    - oos_start_date
    - oos_end_date
    - paper5.energy_robustness.n_boot_stat
    - paper5.energy_robustness.n_boot_ridge
    - paper5.energy_robustness.n_boot_sharpe
    - paper5.energy_robustness.seed
    outs:
    - ${p5}/energy_robustness/results.json
    - ${p5}/energy_robustness/results.parquet
    - ${p5}/energy_robustness/folds/eval2020/results.json
    - ${p5}/energy_robustness/folds/eval2020/results.parquet
    - ${p5}/energy_robustness/folds/eval2021/results.json
    - ${p5}/energy_robustness/folds/eval2021/results.parquet

  p5_wflat_gate:
    desc: >-
      Pre-registered economic-validation gate for the frozen 2018--2022
      target-anchored W2 operator on 2023--2026 returns. Compares W-flat with
      equal-support, industry, training-window correlation-kNN, and 1,000
      matched-sparsity random baskets using joint-date stationary bootstrap.
    cmd: >-
      ${py_pipeline} paper5-economic-gate
      --returns-dir ${shared}/returns
      --oos-returns-dir ${shared}/oos/returns
      --shared-barycentre-dir
      ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
      --universe-csv data/universe.csv
      --output-dir ${p5}/wflat_gate
      --n-bootstrap ${paper5.gate.n_bootstrap}
      --n-random ${paper5.gate.n_random}
      --block-length ${paper5.gate.block_length}
      --knn-k ${paper5.gate.knn_k}
      --seed ${paper5.gate.seed}
      --provider-id ${paper5.provider_id}
      --representation-id ${paper5.representation_id}
      --barycentre-arm-id ${paper5.barycentre_arm_id}
      --geometry-id ${paper5.distance_id}
    deps:
    - .semflow/hashes/entrypoints/pipeline/paper5-economic-gate.json
    - ${shared}/returns
    - ${shared}/oos/returns
    - ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
    - data/universe.csv
    params:
    - paper5.gate.n_bootstrap
    - paper5.gate.n_random
    - paper5.gate.block_length
    - paper5.gate.knn_k
    - paper5.gate.seed
    - paper5.provider_id
    - paper5.representation_id
    - paper5.distance_id
    - paper5.barycentre_arm_id
    outs:
    - ${p5}/wflat_gate/results.json
    - ${p5}/wflat_gate/results.parquet

  p5_empirical:
    desc: >-
      Paper 5 Hilbert/W2 spatial empirics: kNN embedding-graph spatial weights,
      primary target-anchored Wasserstein-barycentric reconstruction and W2
      diffusion operator, covariance estimation, the persistent news co-mention
      comparator, and spatial-dependence hypothesis tests on the configured
      priced panel.
      With --oos-returns-dir, every W is frozen at its 2018-22
      construction and returns roll forward through the per-year OOS folds
      eval2023..eval2026 (t19 persistence arm); rho is re-estimated per fold.
    cmd: >-
      ${py_pipeline} paper5-empirical
      --returns-dir ${shared}/returns
      --distance-artifact-dir
      ${shared}/typed_distances/${paper5.provider_id}/${paper5.representation_id}/${paper5.distance_id}
      --embeddings-dir ${shared}/embeddings/${paper5.provider_id}
      --shared-barycentre-dir
      ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
      --wasserstein-w1-barycentre-dir
      ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.wasserstein_w1_arm_id}
      --co-mentions-adjacency ${shared}/co_mentions/adjacency.parquet
      --provider-id ${paper5.provider_id}
      --representation-id ${paper5.representation_id}
      --distance-id ${paper5.distance_id}
      --barycentre-arm-id ${paper5.barycentre_arm_id}
