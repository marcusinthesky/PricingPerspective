      - paper5.qmle.block_length
      - paper5.qmle.seed
      outs:
      - ${p5}/representation_ablation/${key}/results.json
      - ${p5}/representation_ablation/${key}/results.parquet
      - ${p5}/representation_ablation/${key}/bootstrap_draws.parquet

