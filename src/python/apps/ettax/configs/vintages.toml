tokenizer_arm = "V0"
tokenizer_documents = 2000000
prepared_documents = 2000000
sample_seed = "t69-ettax-vintage-staircase"
work_root = "data/.encoder_vintage/ettax"
run_id = "v3-byte-complete"
budget_manifest = "data/.encoder_vintage/stats/budget.json"
experiment_config = "src/python/apps/ettax/configs/base.toml"

# Pins the behaviour this run was already published under. `doc` + `first` is
# exactly one truncated window read at [DOC], which is what the pre-policy
# producer did; changing either value here would silently restate published
# `data/shared/embeddings/ettax-v*` artifacts.
checkpoint_layout = "vintage"
pooling_policy = "doc"
article_policy = "first"

[arms.V0]
identifier = "enwiki-20171220"
source = "data/.encoder_vintage/corpus/V0.txt"
role = "zero-exposure floor"

[arms.V1]
identifier = "enwiki-20201220"
source = "data/.encoder_vintage/corpus/V1.txt"
role = "primary outcome-clean arm"

[arms.V3]
identifier = "enwiki-20260801"
source = "data/.encoder_vintage/corpus/V3.txt"
role = "maximum-exposure arm"
