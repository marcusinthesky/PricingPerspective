        cache: false
    - src/latex/projects/05_spatial_pricing/src/images/spatial_exposure_arc.pgf:
        cache: false
    - src/latex/projects/05_spatial_pricing/src/images/w2_operator_construction.pgf:
        cache: false

  p5_barycentric_mixture_figure:
    desc: >-
      Render Paper 5's empirical barycentric interaction field from the frozen
      leave-one-out artifact. Its target rows use target-anchored
      Wasserstein-barycentric reconstruction, computed by transport-aligned
      simplex reconstruction. The shared 150 mm and 124 mm displays keep each
      target's five largest actual coefficients while the side panels disclose
      concentration and displayed mass.
    cmd: >-
      ${py_pipeline} render-paper5-barycentric-mixtures
      --barycentre-dir
      ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
      --universe-csv data/universe.csv
      --output-file
      src/latex/projects/05_spatial_pricing/src/images/w2_barycentric_mixture_weights.pgf
    deps:
    - .semflow/hashes/entrypoints/pipeline/render-paper5-barycentric-mixtures.json
    - ${shared}/barycentres/${paper5.provider_id}/${paper5.representation_id}/${paper5.barycentre_arm_id}
    - data/universe.csv
    outs:
    - src/latex/projects/05_spatial_pricing/src/images/w2_barycentric_mixture_weights.pgf:
        cache: false
    - src/latex/projects/05_spatial_pricing/src/images/w2_barycentric_mixture_weights-img0.png:
        cache: false
    - src/latex/projects/05_spatial_pricing/src/images/w2_barycentric_mixture_weights-img1.png:
        cache: false

  # ====================================================================
  # PAPER 3 - model robustness
  # ====================================================================

  p3_model_robustness_qwen3-embedding-8b:
    desc: >-
      Referee model-robustness ablation (baseline model, qwen3-embedding-8b):
      re-run Paper 3's W2 envelope and backtest for this model only, reusing
      its canonical baseline output. Split from the former monolithic
      p3_model_robustness stage for per-model caching/resume. Writes only
      under ${shared}/ablations/paper3_model_robustness/qwen3-embedding-8b.
      The exact typed W2 arm is consumed directly.
    cmd: >-
      ${py_pipeline} run-paper3-model-robustness
      --returns-dir ${shared}/returns
      --output-dir ${shared}/ablations/paper3_model_robustness
      --params-file params.yaml
      --baseline-model ${scientific_selectors.baseline_model}
      --distance-artifact-dir ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${paper3.primary_distance_id}
      --provider-id ${scientific_selectors.typed_distance_provider}
      --representation-id ${scientific_selectors.typed_distance_representation}
      --distance-id ${paper3.primary_distance_id}
      --canonical-summary ${p3}/empirical/summary.yaml
      --model ${scientific_selectors.baseline_model}
    deps:
    - .semflow/hashes/entrypoints/pipeline/run-paper3-model-robustness.json
    - ${shared}/embeddings/${scientific_selectors.baseline_model}
    - ${shared}/returns
    - ${shared}/typed_distances/${scientific_selectors.typed_distance_provider}/${scientific_selectors.typed_distance_representation}/${paper3.primary_distance_id}
    - ${p3}/empirical/summary.yaml
    params:
    - ablation.grid
    outs:
    - ${shared}/ablations/paper3_model_robustness/${scientific_selectors.baseline_model}

  p3_model_robustness_model:
    matrix:
      model: ${ablation_models}
    desc: >-
      Referee model-robustness ablation for the non-baseline ablation_models
      roster (matrix-ized from the former three hand-rolled
      p3_model_robustness_<model> stages — homogeneous cmd/dep shape, t15
      dvc-graph-symmetry). Writes only under
      ${shared}/ablations/paper3_model_robustness/${item.model}. Per-model
      consumes the exact model-specific W2 arm and emits the Paper 3 summary.
    cmd: >-
      ${py_pipeline} run-paper3-model-robustness
      --returns-dir ${shared}/returns
      --output-dir ${shared}/ablations/paper3_model_robustness
      --params-file params.yaml
      --baseline-model ${scientific_selectors.baseline_model}
      --distance-artifact-dir ${shared}/typed_distances/${item.model}/${item.model}-unit/wasserstein_w2
      --provider-id ${item.model}
      --representation-id ${item.model}-unit
      --distance-id wasserstein_w2
      --canonical-summary ${p3}/empirical/summary.yaml
      --model ${item.model}
    deps:
    - .semflow/hashes/entrypoints/pipeline/run-paper3-model-robustness.json
    - ${shared}/embeddings/${item.model}
    - ${shared}/returns
    - ${shared}/typed_distances/${item.model}/${item.model}-unit/wasserstein_w2
    params:
    - ablation.grid
    outs:
    - ${shared}/ablations/paper3_model_robustness/${item.model}

  p3_model_robustness:
    desc: >-
      Merge the per-model p3_model_robustness_<model> summaries into the
      consolidated ${shared}/ablations/paper3_model_robustness/summary.yaml
      consumed by the Paper 3 figure renderer. Split from the
      former monolithic stage: this merge stage is cheap (I/O only), so the
      expensive per-model work is now independently cacheable/resumable.
    cmd: >-
      ${py_pipeline} merge-paper3-model-robustness
      --output-dir ${shared}/ablations/paper3_model_robustness
      --params-file params.yaml
      --baseline-model ${scientific_selectors.baseline_model}
    deps:
    - .semflow/hashes/entrypoints/pipeline/merge-paper3-model-robustness.json
    - ${shared}/ablations/paper3_model_robustness/qwen3-embedding-4b
    - ${shared}/ablations/paper3_model_robustness/qwen3-embedding-8b
    - ${shared}/ablations/paper3_model_robustness/bge-m3
    - ${shared}/ablations/paper3_model_robustness/bge-large-en-v1.5
    params:
    - ablation.grid
    outs:
    - ${shared}/ablations/paper3_model_robustness/summary.yaml

  # ====================================================================
  # MONTE-CARLO / VALIDATION (data-free)
  # ====================================================================

  mc_variance_floor:
    desc: >-
      Numerically validate Lean theorem portfolio_variance_lower_bound via Monte-Carlo.
    cmd: >-
      ${py_sim} validate-variance-floor
    deps:
    - .semflow/hashes/entrypoints/simulation/validate-variance-floor.json
    params:
    - monte_carlo.n_assets
    - monte_carlo.embedding_dim
    - monte_carlo.n_points_per_asset
    - monte_carlo.n_clusters
    - monte_carlo.n_weight_draws
    - monte_carlo.lipschitz_scale_factors
    - monte_carlo.lipschitz_tightness_probe_factors
    - monte_carlo.tolerance
    - monte_carlo.seed
    outs:
    - ${mc}/monte_carlo_validation/results_portfolio_floor.parquet
    - ${mc}/monte_carlo_validation/violation_summary.csv
    - ${mc}/monte_carlo_validation/summary.yaml

  mc_hedging_error:
    desc: >-
      Monte-Carlo validation: targeted energy barycentre vs hedging-error bound (Papers
      2/3).
    cmd: >-
      ${py_sim} validate-hedging-error
    deps:
    - .semflow/hashes/entrypoints/simulation/validate-hedging-error.json
    params:
    - monte_carlo.n_assets
    - monte_carlo.embedding_dim
    - monte_carlo.n_points_per_asset
    - monte_carlo.n_clusters
    - monte_carlo.tolerance
    - monte_carlo.seed
    - monte_carlo.hedging_error_solver
    - monte_carlo.hedging_error_tol
    - monte_carlo.hedging_error_maxiter
    outs:
    - ${mc}/hedging_error_validation/results.parquet
    - ${mc}/hedging_error_validation/summary.yaml

  mc_pricefree:
    desc: >-
      PUNCHLINE experiment: compare price-free portfolio constructions (max-spread,
      distance-MVO) vs sample-MVO and equal-weight across T in {20,60,250}.
      Tests hypothesis that price-free beats sample-MVO at small T.
    cmd: >-
      ${py_sim} compare-pricefree
    deps:
    - .semflow/hashes/entrypoints/simulation/compare-pricefree.json
    params:
    - monte_carlo.n_assets
    - monte_carlo.embedding_dim
    - monte_carlo.n_points_per_asset
    - monte_carlo.n_clusters
    - monte_carlo.seed
    - monte_carlo.pricefree_T_values
    - monte_carlo.pricefree_sigma_eps
    - monte_carlo.pricefree_n_sims
    - monte_carlo.pricefree_pgd_steps
    - monte_carlo.replication_batch_size
    outs:
    - ${mc}/pricefree_comparison/results.parquet
    - ${mc}/pricefree_comparison/summary.yaml

  mc_test_size_power:
    desc: >-
      Type I / Type II (size/power) validation of the energy permutation test
      used in Papers 2/3 Monte-Carlo sections (ROADMAP §4.5 / §5).
    cmd: >-
      ${py_sim} simulate-size-power
    deps:
    - .semflow/hashes/entrypoints/simulation/simulate-size-power.json
    params:
    - monte_carlo.test_size_power.n_sims
    - monte_carlo.test_size_power.num_permutations
    - monte_carlo.test_size_power.n_values
    - monte_carlo.test_size_power.d_values
    - monte_carlo.test_size_power.alpha_levels
    - monte_carlo.test_size_power.mean_shifts
    - monte_carlo.test_size_power.scale_factors
    - monte_carlo.test_size_power.contamination_fracs
    - monte_carlo.test_size_power.seed
    - monte_carlo.replication_batch_size
    outs:
    - ${mc}/test_size_power/size_results.parquet
    - ${mc}/test_size_power/power_results.parquet
    - ${mc}/test_size_power/summary.yaml

  mc_window_size_power:
    # t17 backtest overlay D6 (ADDITIVE — validates the NEW
    # simulation.sharpe_tests inference layer; changes no published number).
    # HEAVY at n_sims=1000; for the main session / author to `dvc repro`.
    desc: >-
      Monte-Carlo size/power of the overlap-robust Sharpe-superiority test as a
      function of the evaluation-window length T: confirms empirical size ~alpha
      and power rising with T, empirically justifying a minimal feasible window
      (decision brief D6).
    cmd: >-
      ${py_sim} simulate-window-size-power
      --params-file params.yaml
      --output-dir ${mc}/window_size_power
    deps:
    - .semflow/hashes/entrypoints/simulation/simulate-window-size-power.json
    params:
    - monte_carlo.window_size_power.t_values
    - monte_carlo.window_size_power.phi
    - monte_carlo.window_size_power.deltas
    - monte_carlo.window_size_power.alpha_levels
    - monte_carlo.window_size_power.n_sims
    - monte_carlo.window_size_power.n_boot
    - monte_carlo.window_size_power.k_strategies
    - monte_carlo.window_size_power.seed
    - monte_carlo.replication_batch_size
    outs:
    - ${mc}/window_size_power/size_results.parquet
    - ${mc}/window_size_power/power_results.parquet
    - ${mc}/window_size_power/summary.yaml

  mc_equivalence:
    desc: >-
      Paper 2 P0-2: calibrate energy-equivalence size at the exact population
      margin, probability of any rejection across correlated targets, and power. Compares
      the pre-specified studentized k-minus-1 diagnostic with marginal, BH, and
      target-scale comparison procedures.
    cmd: >-
      ${py_sim} simulate-equivalence-calibration
    deps:
    - .semflow/hashes/entrypoints/simulation/simulate-equivalence-calibration.json
    params:
    - monte_carlo.equivalence_calibration.n_sims
    - monte_carlo.equivalence_calibration.n_resamples
    - monte_carlo.equivalence_calibration.n_target
    - monte_carlo.equivalence_calibration.n_candidate
    - monte_carlo.equivalence_calibration.m_values
    - monte_carlo.equivalence_calibration.target_correlation
    - monte_carlo.equivalence_calibration.delta
    - monte_carlo.equivalence_calibration.alpha
    - monte_carlo.equivalence_calibration.null_fractions
    - monte_carlo.equivalence_calibration.power_energy_ratio
    - monte_carlo.equivalence_calibration.variance_cells
    - monte_carlo.equivalence_calibration.seed
    - monte_carlo.replication_batch_size
    outs:
    - ${mc}/equivalence_calibration/results.parquet
    - ${mc}/equivalence_calibration/boundary_design.parquet
    - ${mc}/equivalence_calibration/summary.yaml

  mc_gmm_wolak:
    desc: >-
      Paper 3: size/power of the GMM Wald and Wolak inequality tests on synthetic
      moment panels with a known null. Calibrates the chi-bar-squared weights by
      Monte Carlo and confirms test size — gates the Wave-2 empirical p-values
      (ROADMAP §4.5). Data-free.
    cmd: >-
      ${py_sim} simulate-gmm-wolak-size-power
    deps:
    - .semflow/hashes/entrypoints/simulation/simulate-gmm-wolak-size-power.json
    params:
    - monte_carlo.gmm_wolak_size_power.n_sims
    - monte_carlo.gmm_wolak_size_power.T
    - monte_carlo.gmm_wolak_size_power.m
    - monte_carlo.gmm_wolak_size_power.phi
    - monte_carlo.gmm_wolak_size_power.innov_scale
    - monte_carlo.gmm_wolak_size_power.alpha_levels
    - monte_carlo.gmm_wolak_size_power.power_deltas
    - monte_carlo.gmm_wolak_size_power.power_alpha
    - monte_carlo.gmm_wolak_size_power.n_mc
    - monte_carlo.gmm_wolak_size_power.seed
    - monte_carlo.replication_batch_size
    outs:
    - ${mc}/gmm_wolak_size_power/size_results.parquet
    - ${mc}/gmm_wolak_size_power/power_results.parquet
    - ${mc}/gmm_wolak_size_power/summary.yaml

  mc_kappa_audit:
    desc: >-
      Paper 3: audit which identity form (D², ½κ²D², ½κ_iκ_jD²) makes the
      residual g_ij vanish under a white-noise factor field, and how coloured
      (exponential / Matérn-3/2) kernels break it — settles the figure-10 vs
      figure-22 scaling and calibrates the misspecification tolerance
      (ROADMAP §4 item 3). Data-free.
    cmd: >-
      ${py_sim} audit-kappa-identity
    deps:
    - .semflow/hashes/entrypoints/simulation/audit-kappa-identity.json
    params:
    - monte_carlo.kappa_audit.n_assets
    - monte_carlo.kappa_audit.resolution
    - monte_carlo.kappa_audit.d
    - monte_carlo.kappa_audit.n_clusters
    - monte_carlo.kappa_audit.lengthscale
    - monte_carlo.kappa_audit.kappa_base
    - monte_carlo.kappa_audit.kappa_spread
    - monte_carlo.kappa_audit.kernels
    - monte_carlo.kappa_audit.seed
    outs:
    - ${p3}/kappa_audit/results.parquet
    - ${p3}/kappa_audit/summary.yaml
