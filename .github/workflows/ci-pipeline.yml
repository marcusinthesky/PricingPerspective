name: Analysis checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: DeterminateSystems/nix-installer-action@v21
      - name: Install locked Python environment
        run: nix develop ./infra/nix#prek --command just python::setup
      - name: Check environment and Python
        run: nix develop ./infra/nix#prek --command bash -euc 'just nix::parity; just python::lint; just python::fmt-check; just python::typecheck; just python::tach; just python::deptry; just semflow-check; just python::test-fresh'
