paper = "03_distance_implied_mpt"
claim_id = "prop:p3-barycenter-representation"
assumptions = [
  "finitely many probability laws with finite second moments on a separable real Hilbert space",
  "nonnegative weights summing to one"
]
disclosure = "Machine-checked in the pinned Lean 4 / mathlib v4.35.0 workspace without assuming that either the barycentre infimum or the multimarginal infimum is attained."

[[claims]]
