# Nested prek gates scoped to src/latex/. Dependencies come from infra/nix.
#
# Vendor policy: `interact.cls`, `tf*.bst`, and the per-project copy of
# `pp-manuscript.sty` under `projects/*/src/` are pinned, publisher-owned
# upstream artifacts (materialized by `just _prepare`). They are excluded
# from first-party formatting/linting below; their correctness is gated by
# the compile and `tools/check-log`, not by tex-fmt/chktex.
#
# Generated policy: `projects/*/src/generated/` is pipeline-owned (the Python
# `pipeline.io.values` renderer emits `numbers.tex` from the renderer-neutral
# value model, never hand-authored). It is excluded from tex-fmt/chktex for the
# same reason; its keys/values are gated by citation/value parity and the
# compile. This exclusion mirrors `src/latex/justfile`'s fmt/lint globs.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: tex-fmt
        name: tex-fmt (check)
        language: system
        # wraplen/tabsize live once in src/latex/tex-fmt.toml (t24.16.4 F10);
        # resolved by absolute path so this runs correctly whether prek's cwd
        # is the repo root or the src/latex subtree (see note below).
        entry: bash -euc 'exec tex-fmt --check --config "$(git rev-parse --show-toplevel)/src/latex/tex-fmt.toml" "$@"' --
        files: \.(tex|sty|cls)$
        exclude: ^projects/.*/src/.*\.(sty|cls|bst)$|^projects/.*/src/generated/|^tools/tests/

      - id: chktex
        name: ChkTeX
        language: system
        # Suppression list lives once in src/latex/.chktexrc's CmdLine block
        # (t24.16.4 F10), read via -l with an absolute path for the same
        # cwd-mode reason as the tex-fmt hook above.
        #
        # `-l` adds to ChkTeX's configuration; it does not replace the global
        # chktexrc, whose macro tables this gate's warning set depends on (see
        # the `chktex` derivation comment in infra/nix/flake.nix). Keep ChkTeX
        # provisioned with a texmf tree, or Warning 37 fires on display math.
        entry: bash -euc 'exec chktex -q -I0 -l "$(git rev-parse --show-toplevel)/src/latex/.chktexrc" "$@"' --
        files: \.(tex|sty|cls)$
        exclude: ^projects/.*/src/.*\.(sty|cls|bst)$|^projects/.*/src/generated/|^tools/tests/

      # pass_filenames:false entries below use the sibling src/python convention —
      # `cd $(git rev-parse --show-toplevel)/src/latex && exec …` — so their bare
      # relative tool/recipe paths resolve from the repo-root CWD prek uses under an
      # explicit `-c src/latex/.pre-commit-config.yaml` invocation, not only from the
      # workspace-scoped subtree CWD. Without this they silently skip / miss-resolve
      # off the repo root. Their `files:` triggers are left unanchored (no `^`) so
      # they match whether prek reports paths subtree-relative (workspace mode:
      # `projects/…`) or repo-root-relative (explicit `-c`: `src/latex/projects/…`).
      # The file-scanning hooks above stay filename-driven (prek supplies
      # subtree-correct paths in workspace mode, as in the src/python sibling).
      - id: latex-boundaries
        name: LaTeX architectural boundaries
        language: system
        entry: bash -euc 'cd "$(git rev-parse --show-toplevel)/src/latex" && exec bash tools/lint-boundaries'
        pass_filenames: false
        files: (src/latex/)?(projects|templates|tools)/
